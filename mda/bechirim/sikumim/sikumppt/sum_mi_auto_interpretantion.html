<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>פיענוח אוטם באק"ג</title>
  <script 
      src="https://cdn.counter.dev/script.js" 
      data-id="87cd2eee-d5db-43dc-9575-16e58a14c32d" 
      data-utcoffset="3" 
      defer 
      referrerpolicy="no-referrer"></script>

<style>
 /* קישור חזרה קבוע למעלה */
    .top-link {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      background: #1976d2;
      color: #fff;
      text-align: center;
      padding: 8px 0 4px 0;
      z-index: 101;
      font-size: 1.1em;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px #bbb;
    }
    /* כותרת קבועה מתחת לקישור */
    .sticky-header {
      position: fixed;
      top: 20px;
      right: 0;
      left: 0;
      background: #fff;
      z-index: 100;
      text-align: center;
      padding: 15px 0 8px 0;
      font-size: 1.5em;
      font-weight: bold;
      box-shadow: 0 2px 8px #ddd;
      border-bottom: 1px solid #eee;
    }
    /* ריווח לתוכן */
    .content-wrapper {
      margin-top: 100px; /* מספיק מקום לשני האלמנטים הקבועים */
    }


    h2 {
      color: #0077cc;
      text-align: center;
      font-size: 28px;
    }
  
    .projects {
      text-align: right;
      max-width: 100%;
    }
  
    .projects a, .title-link {
      display: block;
      font-size: 22px;
      color: #0077cc;
      text-decoration: none;
      margin: 20px 0;
    }
  
    .projects a:hover, .title-link:hover {
      text-decoration: underline;
    }
  
    
    .section {
      background: #ffffff;
      margin: 16px 0;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
    }

    ul {
      margin: 0;
      padding-right: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    .results {
      background-color: #e3f2fd;
      border-right: 5px solid #1976d2;
      padding: 12px;
      margin-top: 12px;
      font-weight: bold;
      color: #0d47a1;
    }

    select, input[type="checkbox"] {
      margin-bottom: 8px;
    }
    @media (max-width: 600px) {
      h2 {
        font-size: 40px;
      }
  
      .projects a, .title-link {
        font-size: 26px;
        margin: 25px 0;
      }
    }
  </style>
</head>
<body>
<a href="../../../index.html" class="top-link">חזרה לתפריט הראשי</a>
  <div class="sticky-header">כלי עזר לפיענוח אוטם חריף באק"ג</div>
   <div class="content-wrapper"></div>


<div class="section">
  <label>ציר הלב:</label><br>
  <select id="axis">
    <option value="normal">נורמלי (QRS חיובי ב־I ו־aVF)</option>
    <option value="left">סטייה שמאלה (QRS חיובי ב־I ושלילי ב־aVF)</option>
    <option value="right">סטייה ימינה (QRS שלילי ב־I וחיובי ב־aVF)</option>
  </select>
</div>

<div class="section">
  <label>היכן יש עליות ST?</label><br>
  <input type="checkbox" value="V1">V1
  <input type="checkbox" value="V2">V2
  <input type="checkbox" value="V3">V3
  <input type="checkbox" value="V4">V4
  <input type="checkbox" value="V5">V5
  <input type="checkbox" value="V6">V6
  <input type="checkbox" value="I">I
  <input type="checkbox" value="aVL">aVL
  <input type="checkbox" value="II">II
  <input type="checkbox" value="III">III
  <input type="checkbox" value="aVF">aVF
</div>

<div class="section">
  <label>צורת ST חשודה:</label><br>
  <input type="checkbox" id="tombstone"> צורת "אבן קבר" (Tombstone)<br>
  <input type="checkbox" id="reciprocal"> ירידות ST בלידים נגדיים<br>
</div>

<button onclick="analyze()">נתח סטריפ</button>

<div id="output" class="results"></div>

<script>
function analyze() {
  const leads = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                     .map(cb => cb.value);
  const tombstone = document.getElementById("tombstone").checked;
  const reciprocal = document.getElementById("reciprocal").checked;

  let diagnosis = "";
  if (leads.includes("V1") || leads.includes("V2") || leads.includes("V3") || leads.includes("V4")) {
    diagnosis += "⦿ חשד לאוטם קדמי (Anterior MI)<br>";
  }
  if (leads.includes("V5") || leads.includes("V6") || leads.includes("I") || leads.includes("aVL")) {
    diagnosis += "⦿ חשד לאוטם לטרלי (Lateral MI)<br>";
  }
  if (leads.includes("II") || leads.includes("III") || leads.includes("aVF")) {
    diagnosis += "⦿ חשד לאוטם תחתון (Inferior MI)<br>";
  }
  if (tombstone) {
    diagnosis += "⦿ צורת Tombstone - אוטם חריף חמור!<br>";
  }
  if (reciprocal) {
    diagnosis += "⦿ ירידות ST נגדיות - תומך באוטם חריף<br>";
  }

  if (diagnosis === "") {
    diagnosis = "לא נמצאו ממצאים מחשידים על פי הקלט.";
  }

  document.getElementById("output").innerHTML = diagnosis;
}
</script>

</body>
</html>
