    body {

        /* קישור חזרה קבוע למעלה */
    .top-link {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      background: #1976d2;
      color: #fff;
      text-align: center;
      padding: 8px 0 4px 0;
      z-index: 101;
      font-size: 1.1em;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px #bbb;
    }
    /* כותרת קבועה מתחת לקישור */
    .sticky-header {
      position: fixed;
      top: 36px;
      right: 0;
      left: 0;
      background: #fff;
      z-index: 100;
      text-align: center;
      padding: 18px 0 10px 0;
      font-size: 2em;
      font-weight: bold;
      box-shadow: 0 2px 8px #ddd;
      border-bottom: 1px solid #eee;
      /**/
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

/* סגנונות התפריט */
        .hamburger-menu {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 25px;
            background: transparent;
            border: none;
            padding: 0;
            margin-right: 20px;
            
        }

        .hamburger-line {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
            transition: 0.3s;
        }

        .hamburger-menu.active .hamburger-line:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger-menu.active .hamburger-line:nth-child(2) {
            opacity: 0;
        }

        .hamburger-menu.active .hamburger-line:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -15%;
            width: 15%;
            height: 100vh;
            background-color: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 0;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu h3 {
            padding: 20px;
            background-color: #1976d2;
            color: white;
            margin: 0;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .side-menu-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .side-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .side-menu li {
            border-bottom: 1px solid #eee;
        }

        .side-menu a {
            display: block;
            padding: 15px 20px;
            color: #0077cc;
            text-decoration: none;
            transition: background-color 0.3s;
            font-size: 16px;
        }

        .side-menu a:hover {
            background-color: #f0f0f0;
            text-decoration: underline;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 999;
        }

        .overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .menu-title {
            flex-grow: 1;
            text-align: center;
        }

        .menu-spacer {
            width: 30px;
            margin-left: 20px;
        }
/* עיצוב סרגל הגלילה */
        .side-menu-content::-webkit-scrollbar {
            width: 8px;
        }

        .side-menu-content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .side-menu-content::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .side-menu-content::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
			}
      /* כפתור חזרה בפינה השמאלית */
    .back-button {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      text-decoration: none;
      font-size: 1em;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .back-button:hover {
      opacity: 0.8;
    }
    
    .back-arrow {
      font-size: 1.2em;
      font-weight: bold;
    }	

    /* ריווח לתוכן */
    .content-wrapper {
      margin-top: 100px; /* מספיק מקום לשני האלמנטים הקבועים */
    }

    h2 {

    }
  
    .projects {

    .projects a, .title-link {

      color: #0077cc;
      text-decoration: none;

    }
  
    .projects a:hover, .title-link:hover {

    @media (max-width: 600px) {

      }
       .side-menu {
                width: 70%;
                right: -70%;
            }
    }
  </style>

  <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        // פתיחה/סגירה של התפריט
        hamburgerBtn.addEventListener('click', function() {
            hamburgerBtn.classList.toggle('active');
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('active');
        });

        // סגירה בלחיצה על האוברליי
        overlay.addEventListener('click', function() {
            hamburgerBtn.classList.remove('active');
            sideMenu.classList.remove('open');
            overlay.classList.remove('active');
        });

        // סגירה בלחיצה על ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hamburgerBtn.classList.remove('active');
                sideMenu.classList.remove('open');
                overlay.classList.remove('active');
            }
        });
    </script>
