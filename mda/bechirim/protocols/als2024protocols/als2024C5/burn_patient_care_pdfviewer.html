    <script>

function getPDFData() {
   return {
       pdfPath: '/mda/files/als2024e/chapter_5_trauma_environment_115/burn_patient_care.pdf',
       fileName: 'burn_patient_care',
       title: 'הטיפול בנפגע כוויות'
   };
}

// טעינת PDF
function loadPDF() {
   const pdfData = getPDFData();
   const loadingMessage = document.getElementById('loadingMessage');
   const pdfFrame = document.getElementById('pdfFrame');
   const menuTitle = document.querySelector('.menu-title');

   // עדכון הכותרת
   const displayTitle = pdfData.title;
   
   // עדכון כותרת הדף וכותרת התפריט
   menuTitle.textContent = displayTitle;
   document.title = displayTitle;

   // בניית נתיב ה-PDF עם PDF.js viewer
   const viewerUrl = `/mda/bechirim/sikumim/pdf_files/pdf2web/web/viewer.html?file=${pdfData.pdfPath}`;
   
   // הגדרת מקור ה-iframe לviewer של PDF.js
   pdfFrame.src = viewerUrl;
    
    // הסתרת הודעת הטעינה והצגת ה-iframe
    loadingMessage.style.display = 'none';
    pdfFrame.style.display = 'block';
    if ('ontouchstart' in window) {
    // מניעת זום כפול על האלמנטים הקבועים
    document.querySelector('.top-link').addEventListener('touchstart', function(e) {
        e.preventDefault();
    });
    
    document.querySelector('.sticky-header').addEventListener('touchstart', function(e) {
        if (!e.target.closest('.hamburger-menu')) {
            e.preventDefault();
        }
    });
    
    // מניעת זום על התפריט הצדדי
    document.querySelector('.side-menu').addEventListener('touchstart', function(e) {
        if (e.target.tagName === 'A') {
            return; // אפשר קליקים על קישורים
        }
        e.stopPropagation();
    });
    
    // ודא שה-PDF יכול לקבל זום
    pdfFrame.addEventListener('touchstart', function(e) {
        e.stopPropagation();
    });
}
}

// אתחול הדף - רק טעינת PDF
document.addEventListener('DOMContentLoaded', function() {
    loadPDF();
});

                const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        // פתיחה/סגירה של התפריט
        hamburgerBtn.addEventListener('click', function() {
            hamburgerBtn.classList.toggle('active');
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('active');
        });

        // סגירה בלחיצה על האוברליי
        overlay.addEventListener('click', function() {
            hamburgerBtn.classList.remove('active');
            sideMenu.classList.remove('open');
            overlay.classList.remove('active');
        });

        // סגירה בלחיצה על ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hamburgerBtn.classList.remove('active');
                sideMenu.classList.remove('open');
                overlay.classList.remove('active');
            }
        });
    </script>
