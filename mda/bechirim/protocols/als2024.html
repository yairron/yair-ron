        // Utility functions for cleaning names
        function cleanFileName(name) {
            return name.replace(/[\\/*?"<>|]/g, "").trim().replace(/ /g, "_").replace(/__/g, "_");
        }

        function cleanFolderName(title) {
            return cleanFileName(title);
        }

        // Load chapters data from JSON file
        async function loadChaptersData() {
            try {
                // Try to load English JSON first, fallback to Hebrew
                let response;
                try {
                    response = await fetch('../../json/als_chapters_english.json');
                    if (!response.ok) throw new Error('English JSON not found');
                } catch (e) {
                    console.log('English JSON not found, falling back to Hebrew version');
                    response = await fetch('../../json/als_chapters.json');
                }
                
                const data = await response.json();
                chapters = data.chapters;
                createAccordion();
            } catch (error) {
                console.error('Error loading chapters data:', error);
                displayError('שגיאה בטעינת נתוני הפרקים');
            }
        }

        function displayError(message) {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        function createAccordion() {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = '';

            Object.keys(chapters).forEach((chapterTitle, index) => {
                const files = chapters[chapterTitle];
                const folderName = cleanFolderName(chapterTitle);
                
                // Get Hebrew display name for chapter
                const displayChapterTitle = chapterDisplayMapping[chapterTitle] || chapterTitle;
                
                // Main accordion item
                const accordionItem = document.createElement('div');
                accordionItem.className = 'accordion-item';
                accordionItem.innerHTML = `
                    <div class="accordion-header" onclick="toggleAccordion(${index})">
                        <span>${displayChapterTitle}</span>
                        <span class="accordion-arrow">▼</span>
                    </div>                   
                    <div class="accordion-content">
                        ${files.map(file => {
                            const displayFileName = fileDisplayMapping[file] || file;
                            return `
                                <div class="pdf-item" onclick="openPDF('${folderName}', '${file}')">
                                    <span class="pdf-icon">📄</span>
                                    <span class="pdf-name">${displayFileName}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                
                container.appendChild(accordionItem);
            });
        }

        function toggleAccordion(index) {
            const items = document.querySelectorAll('.accordion-item');
            const item = items[index];
            
            // Close all other main accordion items
            items.forEach((otherItem, otherIndex) => {
                if (otherIndex !== index) {
                    otherItem.classList.remove('active');
                }
            });
            
            item.classList.toggle('active');
        }

        function openPDF(folderName, fileName) {
    // Get Hebrew display name for the file
    const displayFileName = fileDisplayMapping[fileName] || fileName;
    
    // Encode parameters for URL
    const encodedDisplayName = encodeURIComponent(displayFileName);
    
    // Create URL with parameters including Hebrew title
    const viewerUrl = `als2024_pdf_viewer.html?folder=${folderName}&file=${fileName}&title=${encodedDisplayName}`;
    
    // Try to open PDF viewer in new tab
    try {
        window.open(viewerUrl, '_blank');
    } catch (error) {
        // Fallback: create a link and click it
        const link = document.createElement('a');
        link.href = viewerUrl;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
}

                const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        // פתיחה/סגירה של התפריט
        hamburgerBtn.addEventListener('click', function() {
            hamburgerBtn.classList.toggle('active');
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('active');
        });

        // סגירה בלחיצה על האוברליי
        overlay.addEventListener('click', function() {
            hamburgerBtn.classList.remove('active');
            sideMenu.classList.remove('open');
            overlay.classList.remove('active');
        });

        // סגירה בלחיצה על ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hamburgerBtn.classList.remove('active');
                sideMenu.classList.remove('open');
                overlay.classList.remove('active');
