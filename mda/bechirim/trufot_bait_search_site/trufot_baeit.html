.search-container {

#searchInput {

    .clear-button {
      position: absolute;
      right: 0.5em;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      display: none;
      font-weight: bold;
      color: #888;
      font-size: 1.2em;
    }

    .details {
      background: #f9f9f9;
      padding: 1em;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 1em;
    }

    .medications-list div {
      padding: 0.5em 0;
      border-bottom: 1px solid #eee;
    }

    @media (max-width: 600px) {
      body {

    }

<body>
<a href="../../index.html" class="top-link">חזרה לתפריט הראשי</a>
  <div class="sticky-header">תרופות בית נפוצות</div>
  <div class="content-wrapper">
  <!--  <div class="header-area">
        <a href="../../index.html" style="display:block; margin-bottom: 0.5em; color: #007bff; text-decoration: none;">
            חזרה לדף הראשי
          </a>
          <h1>תרופות בית נפוצות</h1>
        -->    
            
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="חפש תרופה...">
          <span class="clear-button" id="clearBtn">✖</span>
        </div>
      </div>
    

  <div id="medicationDetails" class="details" style="display:none;"></div>

  <div class="medications-list" id="medList"></div>

  <script>
    let medications = [];

    fetch('../../json/medications.json')
      .then(response => response.json())
      .then(data => {
      medications = data;
      displayMedicationsList(medications);
      });

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const medDetails = document.getElementById('medicationDetails');

    searchInput.addEventListener('input', function () {
  const value = this.value.trim().toLowerCase();
  clearBtn.style.display = value ? 'block' : 'none';

  const list = document.getElementById('medList');
  list.innerHTML = ''; // ניקוי הרשימה הקיימת

  if (value === '') {
    // אם השדה ריק, מציג את כל התרופות
    displayMedicationsList(medications);
    return;
  }

  const matches = medications.filter(m =>
    m.hebrew.toLowerCase().includes(value) ||
    m.english.toLowerCase().includes(value)
  );

  if (matches.length > 0) {
    matches.forEach(match => {
      const item = document.createElement('div');
      item.innerHTML = `
        <strong>${match.hebrew} ${match.english}</strong><br>
        ${match.ActIng}<br>
        ${match.disease}<br>
        ${match.action}
      `;
      list.appendChild(item);
    });
  } else {
    list.innerHTML = 'לא נמצאו תרופות תואמות.';
  }
});

clearBtn.addEventListener('click', function () {
  searchInput.value = ''; // מוחק את הערך בשדה החיפוש
  clearBtn.style.display = 'none'; // מסתיר את כפתור הניקוי
  const list = document.getElementById('medList');
  list.innerHTML = ''; // מנקה את הרשימה

  // מחזיר את רשימת התרופות המקורית
  displayMedicationsList(medications);
});

function displayMedicationsList(meds) {
  const list = document.getElementById('medList');
  meds.forEach(med => {
    const item = document.createElement('div');
    item.textContent = `${med.hebrew} ${med.english}`;
    list.appendChild(item);
  });
}

    clearBtn.addEventListener('click', function () {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      medDetails.style.display = 'none';
      medDetails.innerHTML = '';
    });

    function displayMedicationsList(meds) {
      const list = document.getElementById('medList');
      meds.forEach(med => {
        const item = document.createElement('div');
        item.textContent = `${med.hebrew} ${med.english}`;
        list.appendChild(item);
      });
    }
  </script>
</body>
