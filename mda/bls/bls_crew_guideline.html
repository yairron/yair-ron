<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      word-wrap: break-word;
    }
  
/* קישור חזרה קבוע למעלה */
    .top-link {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      background: #1976d2;
      color: #fff;
      text-align: center;
      padding: 8px 0 4px 0;
      z-index: 101;
      font-size: 1.1em;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px #bbb;
    }

    
    .top-link .email {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8em;
    }

    .top-link .email a {
      color: #ffffff;
      text-decoration: none;
    }

    .top-link .email a:hover {
      text-decoration: underline;
    }
    /* כותרת קבועה מתחת לקישור */
    .sticky-header {
      position: fixed;
      top: 20px;
      right: 0;
      left: 0;
      background: #fff;
      z-index: 100;
      text-align: center;
      padding: 15px 0 8px 0;
      font-size: 1.5em;
      font-weight: bold;
      box-shadow: 0 2px 8px #ddd;
      border-bottom: 1px solid #eee;
    }
    /* ריווח לתוכן */
    .content-wrapper {
      margin-top: 100px; /* מספיק מקום לשני האלמנטים הקבועים */
    }


    h2 {
      color: #0077cc;
      text-align: center;
      font-size: 28px;
    }
  
    .projects {
      text-align: right;
      max-width: 100%;
    }
  
    .projects a, .title-link {
      display: block;
      font-size: 22px;
      color: #0077cc;
      text-decoration: none;
      margin: 20px 0;
    }
  
    .projects a:hover, .title-link:hover {
      text-decoration: underline;
    }
  
    @media (max-width: 600px) {
      h2 {
        font-size: 40px;
      }
  
      .projects a, .title-link {
        font-size: 26px;
        margin: 25px 0;
      }
    }
    html, body { margin: 0; padding: 0; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
