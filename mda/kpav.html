/* סגנונות התפריט */
        .hamburger-menu {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 25px;
            background: transparent;
            border: none;
            padding: 0;
            margin-right: 20px;
            
        }

        .hamburger-line {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
            transition: 0.3s;
        }

        .hamburger-menu.active .hamburger-line:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger-menu.active .hamburger-line:nth-child(2) {
            opacity: 0;
        }

        .hamburger-menu.active .hamburger-line:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -15%;
            width: 15%;
            height: 100vh;
            background-color: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 0;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu h3 {
            padding: 20px;
            background-color: #1976d2;
            color: white;
            margin: 0;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .side-menu-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .side-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .side-menu li {
            border-bottom: 1px solid #eee;
        }

        .side-menu a {
            display: block;
            padding: 15px 20px;
            color: #0077cc;
            text-decoration: none;
            transition: background-color 0.3s;
            font-size: 16px;
        }

        .side-menu a:hover {
            background-color: #f0f0f0;
            text-decoration: underline;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 999;
        }

        .overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .menu-title {

        }

/* עיצוב סרגל הגלילה */

  /* Accordions (styled details/summary) */
  #accordion-container { margin-top:12px; }
  details.accordion{
    background: transparent;
    border-radius: 10px;
    margin: 10px 0;
    overflow: hidden;
  }

  summary.accordion-summary{
    list-style: none;
    cursor: pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background: linear-gradient(90deg, rgba(25,118,210,0.06), rgba(25,118,210,0.03));
    border: 1px solid rgba(25,118,210,0.08);
    border-radius: 10px;
    transition: background 220ms, box-shadow 220ms;
    direction: rtl;
    position:relative;
    padding-right:46px; /* space for chevron on right */
  }

  summary.accordion-summary:focus{outline: none; box-shadow:0 0 0 4px rgba(25,118,210,0.08);} 

  /* reduced by 50% as requested */
  summary.accordion-summary .title{ font-weight:700; font-size:1.05rem; }
  summary.accordion-summary .meta{ color:var(--muted); font-size:0.95rem; }

  /* custom chevron placed at right */

  summary.accordion-summary::before{
    content: '\25B6'; /* triangle */
    position:absolute;
    right:12px; /* small distance from right edge */
    top:50%;
    transform: translateY(-50%) rotate(0deg);
    transition: transform 220ms, right 180ms;
    color:var(--accent);
    font-size:1rem;
    opacity:0.95;
  }
  details[open] > summary.accordion-summary::before{ transform: translateY(-50%) rotate(90deg); }

  .accordion-body{

<script>
// טעינת קובץ JSON
async function loadCatalog() {
  try {
    const response = await fetch('json/pdf_v_catalog.json');
    if (!response.ok) throw new Error('לא הצלחנו לטעון את הקטלוג');
    
    const catalog = await response.json();
    document.getElementById('loading').style.display = 'none';
    buildAccordions(catalog);
  } catch (error) {
    document.getElementById('loading').innerHTML = 
      `<div style="color: #d32f2f; background: #ffebee; padding: 20px; border-radius: 8px;">
        ❌ שגיאה בטעינת הקטלוג: ${error.message}
      </div>`;
  }
}

// הסרת מספרים מתחילת שם הקובץ
function cleanFileName(fileName) {
  // הסרת .pdf
  let name = fileName.replace('.pdf', '');
  // הסרת מספרים ומקפים/נקודות מהתחלה
  name = name.replace(/^[\d\s\-\.]+/, '');
  return name.trim();
}

// בניית האקורדיונים
function buildAccordions(catalog) {
  const container = document.getElementById('accordion-container');

  // ראש כרטיס קטלוג אחד גדול
  const card = document.createElement('section');
  card.className = 'catalog-card';
  const header = document.createElement('div');
  header.className = 'catalog-header';
  const title = document.createElement('div');
  title.className = 'catalog-title';
  title.textContent = catalog.title || 'קטלוג קבצים';
  const sub = document.createElement('div');
  sub.className = 'catalog-sub';
  sub.textContent = catalog.description || '';
  header.appendChild(title);
  header.appendChild(sub);
  // Toggle all button
  const toggleAllBtn = document.createElement('button');
  toggleAllBtn.className = 'toggle-all-btn';
  toggleAllBtn.id = 'toggleAllBtn';
  toggleAllBtn.textContent = 'פתח הכל';
  header.appendChild(toggleAllBtn);
  card.appendChild(header);

  const accordionsWrap = document.createElement('div');
  accordionsWrap.id = 'accordion-list';

  catalog.folders.forEach(folder => {
    const details = document.createElement('details');
    details.className = 'accordion';

    const summary = document.createElement('summary');
    summary.className = 'accordion-summary';
    summary.setAttribute('role','button');
    summary.setAttribute('aria-expanded','false');

    const sTitle = document.createElement('div');
    sTitle.className = 'title';
    sTitle.textContent = folder.name;

    // no file count in the header per design request
    const sMeta = document.createElement('div');
    sMeta.className = 'meta';
    sMeta.textContent = '';
    summary.appendChild(sTitle);

    // כאשר summary נלחץ - עדכון aria-expanded
    summary.addEventListener('click', (e)=>{
      // toggle handled by details element; update attribute after frame
      requestAnimationFrame(()=>{
        const expanded = details.hasAttribute('open');
        summary.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      });
    });

    const content = document.createElement('div');
    content.className = 'accordion-body';

    if (folder.files && folder.files.length > 0) {
      const list = document.createElement('div');
      list.className = 'file-list';

      folder.files.forEach(file => {
        const a = document.createElement('a');
        a.className = 'file-link';
        a.href = file.google_drive_url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const bullet = document.createElement('span');
        bullet.className = 'bullet';
        bullet.textContent = '•';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = cleanFileName(file.name);

        const meta = document.createElement('span');
        meta.className = 'meta';
        if(file.size) meta.textContent = file.size; // אם קיים שדה גודל

        a.appendChild(bullet);
        a.appendChild(name);
        a.appendChild(meta);

        list.appendChild(a);
      });

      content.appendChild(list);
    } else {
      const emptyMsg = document.createElement('div');
      emptyMsg.className = 'empty-msg';
      emptyMsg.textContent = 'אין קבצים בתיקייה זו';
      content.appendChild(emptyMsg);
    }

    details.appendChild(summary);
    details.appendChild(content);
    accordionsWrap.appendChild(details);
  });

  card.appendChild(accordionsWrap);
  container.appendChild(card);
  // Toggle all functionality
  const toggleBtn = document.getElementById('toggleAllBtn');
  toggleBtn.addEventListener('click', ()=>{
    const all = accordionsWrap.querySelectorAll('details');
    const anyClosed = Array.from(all).some(d => !d.hasAttribute('open'));
    all.forEach(d => { if(anyClosed) d.setAttribute('open',''); else d.removeAttribute('open'); });
    toggleBtn.textContent = anyClosed ? 'סגור הכל' : 'פתח הכל';
  });
}

// טעינה אוטומטית בעת פתיחת הדף
document.addEventListener('DOMContentLoaded', loadCatalog);
</script>




<script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        // פתיחה/סגירה של התפריט
        hamburgerBtn.addEventListener('click', function() {
            hamburgerBtn.classList.toggle('active');
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('active');
        });

        // סגירה בלחיצה על האוברליי
        overlay.addEventListener('click', function() {
            hamburgerBtn.classList.remove('active');
            sideMenu.classList.remove('open');
            overlay.classList.remove('active');
        });

        // סגירה בלחיצה על ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hamburgerBtn.classList.remove('active');
                sideMenu.classList.remove('open');
                overlay.classList.remove('active');
            }
        });
    </script>
