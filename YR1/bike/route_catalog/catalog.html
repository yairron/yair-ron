<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>קטלוג מסלולים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--primary:#1F6B4C;--secondary:#4E9B6B;--accent:#E0923F;--success:#3F7D4E;--light:#F2F8F3;--dark:#123A29;--text:#243A2E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Assistant','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#123A29 0%,#3F7D52 50%,#E0A24E 100%);min-height:100vh;padding:20px;direction:rtl}
.container{max-width:1100px;margin:0 auto}
header{text-align:center;margin-bottom:25px}
h1{font-family:'Varela Round',sans-serif;font-size:2.6rem;font-weight:800;color:white;text-shadow:2px 3px 10px rgba(0,0,0,.3);margin-bottom:8px}
.subtitle{font-size:1rem;color:rgba(255,255,255,.9);text-shadow:1px 2px 8px rgba(0,0,0,.2)}
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.btn-nav{background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:10px 20px;border-radius:20px;color:white;text-decoration:none;font-size:1rem;font-weight:700;border:none;cursor:pointer;transition:all .3s;font-family:'Assistant',sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn-nav:hover{background:rgba(255,255,255,.4);transform:translateY(-2px)}

.control-panel{background:rgba(255,255,255,.95);border-radius:20px;padding:22px 26px;margin-bottom:25px;box-shadow:0 10px 30px rgba(0,0,0,.15);border-right:4px solid var(--accent)}
.control-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.control-row:last-child{margin-bottom:0}
.control-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.control-field label{font-size:.8rem;color:var(--primary);font-weight:700}
.control-field input,.control-field select{font-size:.95rem;padding:9px 12px;border:1px solid #CFE0D3;border-radius:10px;background:var(--light);color:var(--text);font-family:'Assistant',sans-serif}
.control-field input:focus,.control-field select:focus{outline:2px solid var(--secondary)}
.result-count{font-size:.9rem;color:var(--dark);font-weight:600;margin-top:4px}

.select-all-toggle{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-inline-start:6px}
.select-all-toggle input[type="checkbox"]{width:20px;height:20px;cursor:pointer;accent-color:var(--primary);background:white;border-radius:4px}
.select-all-toggle label{color:white;font-weight:700;font-size:.95rem;text-shadow:1px 1px 4px rgba(0,0,0,.3);cursor:pointer;user-select:none}

.recent-searches-dropdown{position:absolute;top:calc(100% + 4px);right:0;left:0;background:white;border:1px solid #CFE0D3;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:10;overflow:hidden}
.recent-search-item{padding:9px 14px;font-size:.9rem;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-search-item:hover{background:var(--light)}

.accordions-container{margin-bottom:25px}
.accordion{background:white;margin-bottom:14px;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.18);overflow:hidden}
.accordion-header{padding:14px 22px;cursor:pointer;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;transition:all .3s;user-select:none}
.accordion-header:hover{background:linear-gradient(135deg,var(--secondary),var(--primary))}
.route-check{width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:var(--accent)}
.route-thumb{width:90px;height:66px;object-fit:cover;border-radius:10px;flex-shrink:0;background:#dde3e0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.route-info{flex:0 1 auto;min-width:0;max-width:420px}
.accordion-title{font-size:1.1rem;font-weight:800;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-id{font-weight:700;color:rgba(255,255,255,.6);margin-inline-end:6px}
.route-meta{font-size:.82rem;color:rgba(255,255,255,.88);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.row-spacer{flex:1;min-width:8px}
.route-stats{display:flex;flex-direction:column;gap:3px;font-size:.85rem;font-weight:700;color:white;text-align:left;flex-shrink:0}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.75rem;font-weight:700;background:rgba(255,255,255,.22)}
.badge-planning{background:var(--accent)}
.badge-invalid{background:#B03A2E}
.accordion-invalid{opacity:.72}
.accordion-invalid .accordion-header{background:linear-gradient(135deg,#5a5a5a,#7a7a7a)}
.accordion-invalid .accordion-header:hover{background:linear-gradient(135deg,#7a7a7a,#5a5a5a)}
.invalid-note{background:#FDECEA;color:#7A2E22;border-right:4px solid #B03A2E;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:.9rem}
.accordion-arrow{font-size:1.1rem;transition:transform .3s;color:white;flex-shrink:0}
.accordion.active .accordion-arrow{transform:rotate(180deg)}
.accordion-content{max-height:0;overflow:hidden;transition:max-height .35s ease}
.accordion.active .accordion-content{max-height:600px}
.accordion-body{padding:18px 24px;font-size:.95rem;line-height:1.8;color:#3A4F42;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.accordion-body .body-details{flex:1;min-width:200px}
.accordion-body .body-details p{margin:4px 0}
.route-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-action{display:inline-block;padding:9px 18px;border-radius:12px;text-decoration:none;font-size:.9rem;font-weight:700;color:white;background:var(--primary);border:none;cursor:pointer;transition:all .2s}
.btn-action:hover{background:var(--dark)}

.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.pagination span{color:white;font-weight:700;text-shadow:1px 1px 4px rgba(0,0,0,.3)}
.btn-page-edge{padding:10px 14px;font-size:.95rem}
.page-jump{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:20px;padding:6px 8px 6px 14px}
.page-jump label{color:white;font-size:.85rem;font-weight:700}
.page-jump input{width:55px;padding:6px 8px;border-radius:10px;border:none;font-size:.9rem;text-align:center;font-family:'Assistant',sans-serif}
.page-jump button{padding:7px 14px;font-size:.85rem}

.selection-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,var(--dark),var(--primary));color:white;padding:14px 20px;display:none;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.3);z-index:50}
.selection-bar.show{display:flex}
.selection-bar .sel-count{font-weight:800;font-size:1rem}
.selection-bar button{padding:9px 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-family:'Assistant',sans-serif;font-size:.9rem}
.selection-bar .btn-primary{background:var(--accent);color:white}
.selection-bar .btn-primary:hover{background:#c97a2c}
.selection-bar .btn-disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.5);cursor:not-allowed}
.selection-bar .btn-clear{background:rgba(255,255,255,.2);color:white}

footer{text-align:center;margin-top:20px;padding:20px 20px 90px;color:rgba(255,255,255,.85);font-size:.9rem}
footer a{color:white;text-decoration:underline;font-weight:600}

.route-thumb{cursor:zoom-in}
.lightbox-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;cursor:zoom-out;padding:30px}
.lightbox-overlay.show{display:flex}
.lightbox-overlay img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}

.map-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--dark);display:none;flex-direction:column;z-index:250}
.map-overlay.show{display:flex}
.map-overlay-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:linear-gradient(135deg,var(--dark),var(--primary));color:white;flex-shrink:0}
.map-overlay-header h3{font-size:1.1rem;font-weight:800}
.map-close-btn{background:rgba(255,255,255,.2);color:white;border:none;border-radius:10px;padding:8px 16px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Assistant',sans-serif}
.map-close-btn:hover{background:rgba(255,255,255,.35)}
.map-body{position:relative;flex:1;min-height:0}
#routeMap{width:100%;height:100%}
.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,58,41,.9);color:white;font-size:1.1rem;font-weight:700;z-index:1001}
.map-legend{position:absolute;bottom:16px;left:16px;background:rgba(255,255,255,.95);border-radius:12px;padding:12px 16px;max-height:35vh;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:1001;font-size:.85rem;min-width:210px;max-width:280px}
.map-legend-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;color:var(--text);border-bottom:1px solid #EEF2EF}
.map-legend-item:last-child{border-bottom:none}
.map-legend-swatch{width:16px;height:4px;border-radius:2px;flex-shrink:0;margin-top:8px}
.map-legend-text{min-width:0;flex:1}
.map-legend-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.map-legend-stats{font-size:.78rem;color:#5C7A6B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media(max-width:768px){
  h1{font-size:1.9rem}
  .accordion-header{flex-wrap:wrap;padding:12px 16px}
  .route-info{order:1;flex-basis:60%}
  .route-thumb{width:70px;height:52px}
  .route-stats{order:2;flex-direction:row;gap:10px;flex-basis:100%;text-align:right;margin-top:4px}
  .row-spacer{display:none}
  .accordion-body{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="container">
  <div class="nav-bar">
    <a href="../../idx1.html" class="btn-nav">🏠 דף ראשי</a>
    <button onclick="history.back()" class="btn-nav">← חזרה</button>
  </div>
  <header>
    <h1>🗺️ קטלוג מסלולים</h1>
    <p class="subtitle" id="subtitleLine">טוען...</p>
  </header>

  <div class="control-panel">
    <div class="control-row">
      <div class="control-field" style="flex:2">
        <label>חיפוש לפי שם, ישוב, מספר מסלול או קורדינטות</label>
        <div style="position:relative">
          <input type="text" id="searchInput" placeholder="למשל: געתון, 558, 33.005,35.215, או 220581/767992...">
          <div class="recent-searches-dropdown" id="recentSearchesDropdown" style="display:none"></div>
        </div>
        <span style="font-size:.75rem;color:#5C7A6B">קורדינטות נתמכות: מעלות עשרוניות (33.005, 35.215) &middot; מעלות/דקות/שניות (33°0'18&quot;N 35°12'54&quot;E) &middot; רשת ישראל החדשה/ITM (220581/767992)</span>
      </div>
      <div class="control-field">
        <label>סוג פעילות</label>
        <select id="activityFilter">
          <option value="">הכול</option>
          <option value="הליכה">🚶 הליכה רגלית</option>
          <option value="רכיבה">🚵 רכיבת אופניים</option>
        </select>
      </div>
      <div class="control-field">
        <label>סוג מקור</label>
        <select id="sourceFilter">
          <option value="">הכול</option>
          <option value="הקלטה">📹 הקלטה</option>
          <option value="תכנון מסלול">🗺️ תכנון מסלול</option>
        </select>
      </div>
      <div class="control-field">
        <label>אזור גיאוגרפי</label>
        <select id="regionFilter">
          <option value="">הכול</option>
          <option value="רמת הגולן והחרמון">רמת הגולן והחרמון</option>
          <option value="בקעת הירדן">בקעת הירדן</option>
          <option value="צפון">צפון</option>
          <option value="מרכז">מרכז</option>
          <option value="ירושלים ומדבר יהודה">ירושלים ומדבר יהודה</option>
          <option value="נגב וערבה">נגב וערבה</option>
        </select>
      </div>
      <div class="control-field">
        <label>מיון</label>
        <select id="sortSelect">
          <option value="date_desc">תאריך: מחדש לישן</option>
          <option value="date_asc">תאריך: מישן לחדש</option>
          <option value="dist_desc">מרחק: מארוך לקצר</option>
          <option value="dist_asc">מרחק: מקצר לארוך</option>
          <option value="name_asc">שם: מא' לת'</option>
          <option value="name_desc">שם: מת' לא'</option>
        </select>
      </div>
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>

  <div class="select-all-toggle" id="selectAllToggle" style="display:none">
    <input type="checkbox" id="selectAllCheckbox" onchange="onSelectAllToggle(this.checked)">
    <label for="selectAllCheckbox">בחר הכל</label>
  </div>

  <div class="accordions-container" id="routesContainer"></div>

  <div class="pagination" id="pagination"></div>
</div>

<footer>
  <p>🤖 פותח עם ❤️ על ידי <a href="mailto:yairron@gmail.com">יאיר רון</a></p>
</footer>

<div class="selection-bar" id="selectionBar">
  <span class="sel-count" id="selCount">נבחרו 0 מסלולים</span>
  <button class="btn-primary" id="btnDownload" onclick="downloadSelected()">📥 הורדה</button>
  <button class="btn-primary" onclick="showOnMap()">🗺️ הצג על מפה</button>
  <button class="btn-primary" onclick="mergeSelectedRoutes()">🔗 עריכת מסלולים</button>
  <button class="btn-primary" onclick="cleanSelectedRoute()">🧹 ניקוי קובץ</button>
  <button class="btn-clear" onclick="clearSelection()">נקה בחירה</button>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <img id="lightboxImg" src="" alt="">
</div>

<div class="map-overlay" id="mapOverlay">
  <div class="map-overlay-header">
    <h3 id="mapOverlayTitle">מסלולים על המפה</h3>
    <button class="map-close-btn" onclick="closeMapOverlay()">✕ סגירה</button>
  </div>
  <div class="map-body">
    <div id="routeMap"></div>
    <div class="map-legend" id="mapLegend"></div>
    <div class="map-loading" id="mapLoading" style="display:none">טוען מסלולים...</div>
  </div>
</div>

<script>
var ALL_ROUTES = [];
var selectedFiles = new Set();
var currentPage = 1;
var PAGE_SIZE = 30;

fetch('data/routes-catalog.json')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    ALL_ROUTES = data.routes;
    document.getElementById('subtitleLine').textContent = data.route_count + ' מסלולים | עודכן: ' + formatGeneratedAt(data.generated_at);
    render();
  })
  .catch(function (err) {
    document.getElementById('subtitleLine').textContent = 'שגיאה בטעינת הקטלוג';
    console.error(err);
  });

function formatGeneratedAt(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function activityBadge(activity) {
  if (activity.indexOf('הליכה') === 0) return '🚶 הליכה';
  if (activity.indexOf('רכיבת') === 0) return '🚵 רכיבה';
  return '❓ לא ברור';
}

var lastCoordSearch = null; // נגיש ל-buildRouteCard כדי להציג מרחק מנקודת החיפוש

function getFiltered() {
  var qRaw = document.getElementById('searchInput').value.trim();
  var q = qRaw.toLowerCase();
  var actFilter = document.getElementById('activityFilter').value;
  var srcFilter = document.getElementById('sourceFilter').value;
  var regionFilter = document.getElementById('regionFilter').value;

  var coord = parseCoordinateQuery(qRaw);
  lastCoordSearch = coord;

  var list = ALL_ROUTES.filter(function (r) {
    if (actFilter && activityBadge(r.activity).indexOf(actFilter) === -1) return false;
    if (srcFilter && r.source !== srcFilter) return false;
    if (regionFilter && r.regions.indexOf(regionFilter) === -1) return false;
    if (coord) {
      var d = routeDistanceKm(r, coord);
      if (d === null || d > COORD_SEARCH_RADIUS_KM) return false;
    } else if (q) {
      // תמיכה בכמה יישובים/מילות חיפוש בפסיקים - "געתון, כברי" מוצא מסלולים
      // שמכילים את **כל** המונחים (לא רק אחד מהם), בכל אחד מהשדות בנפרד.
      var haystack = r.file_name.toLowerCase() + ' ' + r.settlements.join(' ').toLowerCase() + ' ' + r.id;
      var terms = q.split(',').map(function (t) { return t.trim(); }).filter(function (t) { return t.length > 0; });
      if (!terms.length) return false;
      var allTermsMatch = terms.every(function (term) { return haystack.indexOf(term) !== -1; });
      if (!allTermsMatch) return false;
    }
    return true;
  });

  var sortMode = document.getElementById('sortSelect').value;
  list.sort(function (a, b) {
    // מסלולים "לא תקינים" (קפיצת GPS) תמיד בתחתית, לא משנה איזה מיון נבחר
    if (a.invalid !== b.invalid) return a.invalid ? 1 : -1;
    // בחיפוש לפי קורדינטות - תמיד ממויין לפי קרבה, בלי קשר לבחירת "מיון"
    if (coord) return routeDistanceKm(a, coord) - routeDistanceKm(b, coord);
    switch (sortMode) {
      case 'date_asc': return a.date.localeCompare(b.date);
      case 'dist_desc': return b.distance_km - a.distance_km;
      case 'dist_asc': return a.distance_km - b.distance_km;
      case 'name_asc': return a.file_name.localeCompare(b.file_name, 'he');
      case 'name_desc': return b.file_name.localeCompare(a.file_name, 'he');
      default: return b.date.localeCompare(a.date);
    }
  });
  return list;
}

function routeNameOnly(fileName) {
  return fileName.replace(/\.(gpx|GPX)$/, '');
}

function elevationText(r) {
  if (r.elevation_gain_m === null) {
    return r.source === 'תכנון מסלול' ? 'אין נתון (תכנון)' : 'אין נתון';
  }
  return '↗' + r.elevation_gain_m + ' ↘' + r.elevation_loss_m + ' מ׳';
}

function buildRouteCard(r, idx) {
  var elevText = elevationText(r);
  var settlementsText = r.settlements_found ? r.settlements.join(', ') : '📍 מיקום לא זוהה';
  var sourceBadge = r.source === 'תכנון מסלול' ? '<span class="badge badge-planning">🗺️ תכנון</span>' : '<span class="badge">📹 הקלטה</span>';
  var invalidBadge = r.invalid ? ' <span class="badge badge-invalid">⚠️ מסלול לא תקין</span>' : '';
  var thumbSrc = r.thumbnail ? ('data/' + r.thumbnail) : '';
  var checked = selectedFiles.has(r.file_name) ? 'checked' : '';
  var coordDistanceBadge = '';
  if (lastCoordSearch) {
    var d = routeDistanceKm(r, lastCoordSearch);
    if (d !== null) coordDistanceBadge = ' &nbsp;<span class="badge">📍 ' + d.toFixed(2) + ' ק"מ מנקודת החיפוש</span>';
  }

  var el = document.createElement('div');
  el.className = 'accordion' + (r.invalid ? ' accordion-invalid' : '');
  el.innerHTML =
    '<div class="accordion-header" onclick="toggleAcc(this)">' +
      '<input type="checkbox" class="route-check" ' + checked + ' onclick="event.stopPropagation(); onCheckToggle(\'' + escapeAttr(r.file_name) + '\', this.checked)">' +
      (thumbSrc ? '<img class="route-thumb" src="' + thumbSrc + '" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox(\'' + escapeAttr(thumbSrc) + '\')">' : '<div class="route-thumb"></div>') +
      '<div class="route-info">' +
        '<h2 class="accordion-title"><span class="route-id">#' + r.id + '</span>' + escapeHtml(routeNameOnly(r.file_name)) + '</h2>' +
        '<div class="route-meta">📅 ' + r.date + ' &nbsp;' + activityBadge(r.activity) + ' &nbsp;' + sourceBadge + invalidBadge + coordDistanceBadge + '</div>' +
      '</div>' +
      '<div class="route-stats"><span>📏 ' + r.distance_km + ' ק"מ</span><span>' + elevText + '</span></div>' +
      '<div class="row-spacer"></div>' +
      '<span class="accordion-arrow">▼</span>' +
    '</div>' +
    '<div class="accordion-content"><div class="accordion-body">' +
      '<div class="body-details">' +
        (r.invalid ? '<p class="invalid-note">⚠️ נמצאה קפיצת GPS בלתי-אפשרית בקובץ המקורי (כנראה שיבוש/ריגול אות) - ' + r.removed_points + ' נקודות הוסרו לפני החישוב. המרחק/הגובה/המפה כאן מבוססים רק על הנקודות התקינות שנשארו.</p>' : '') +
        '<p><strong>אזור גיאוגרפי:</strong> ' + escapeHtml(r.regions.length ? r.regions.join(', ') : 'לא זוהה') + '</p>' +
        '<p><strong>ישובים סמוכים:</strong> ' + escapeHtml(settlementsText) + '</p>' +
        '<p><strong>מספר נקודות במסלול:</strong> ' + r.point_count + '</p>' +
      '</div>' +
      '<div class="route-actions">' +
        '<a class="btn-action" href="' + encodeURI(r.gpx_path) + '" download>📥 הורדת קובץ GPX</a>' +
      '</div>' +
    '</div></div>';
  return el;
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeAttr(s) {
  return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

// --- חיפושים אחרונים (נוסף 22.08.2026) - עד 5, נשמרים ב-localStorage כדי
// שישרדו גם רענון/סגירת הדף, לא רק מצב הזיכרון של הטאב הנוכחי. ---
var RECENT_SEARCHES_KEY = 'catalogRecentSearches';
var RECENT_SEARCHES_MAX = 5;

function getRecentSearches() {
  try {
    var raw = localStorage.getItem(RECENT_SEARCHES_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveRecentSearch(term) {
  term = (term || '').trim();
  if (!term) return;
  var list = getRecentSearches().filter(function (t) { return t !== term; });
  list.unshift(term);
  list = list.slice(0, RECENT_SEARCHES_MAX);
  try { localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(list)); } catch (e) {}
}

function showRecentSearchesDropdown() {
  var list = getRecentSearches();
  var dropdown = document.getElementById('recentSearchesDropdown');
  if (!list.length) { dropdown.style.display = 'none'; return; }
  dropdown.innerHTML = list.map(function (term) {
    return '<div class="recent-search-item" onmousedown="selectRecentSearch(\'' + escapeAttr(term) + '\')">🕒 ' + escapeHtml(term) + '</div>';
  }).join('');
  dropdown.style.display = 'block';
}

function hideRecentSearchesDropdown() {
  document.getElementById('recentSearchesDropdown').style.display = 'none';
}

function selectRecentSearch(term) {
  document.getElementById('searchInput').value = term;
  hideRecentSearchesDropdown();
  currentPage = 1;
  render();
}

function render() {
  var filtered = getFiltered();
  var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  document.getElementById('resultCount').textContent = 'נמצאו ' + filtered.length + ' מסלולים מתוך ' + ALL_ROUTES.length;

  // "בחר/נקה את כולם" מוצג רק כשהמשתמש הקליד משהו בשדה החיפוש עצמו - לא רק
  // בחר מסנן מרשימה (סוג פעילות/מקור/אזור) בלי חיפוש טקסט/קורדינטות בפועל.
  var searchActive = document.getElementById('searchInput').value.trim().length > 0;
  document.getElementById('selectAllToggle').style.display = searchActive ? 'flex' : 'none';

  var start = (currentPage - 1) * PAGE_SIZE;
  var pageItems = filtered.slice(start, start + PAGE_SIZE);

  var container = document.getElementById('routesContainer');
  container.innerHTML = '';
  pageItems.forEach(function (r, i) { container.appendChild(buildRouteCard(r, i)); });

  renderPagination(totalPages);
  renderSelectionBar();
}

function renderPagination(totalPages) {
  var el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  var atStart = currentPage <= 1;
  var atEnd = currentPage >= totalPages;
  el.innerHTML =
    '<button class="btn-nav btn-page-edge" ' + (atStart ? 'disabled style="opacity:.4"' : 'onclick="goPage(1)"') + ' title="עבור להתחלה">⏭</button>' +
    '<button class="btn-nav" ' + (atStart ? 'disabled style="opacity:.4"' : 'onclick="goPage(' + (currentPage - 1) + ')"') + '>הקודם</button>' +
    '<span>עמוד ' + currentPage + ' מתוך ' + totalPages + '</span>' +
    '<button class="btn-nav" ' + (atEnd ? 'disabled style="opacity:.4"' : 'onclick="goPage(' + (currentPage + 1) + ')"') + '>הבא</button>' +
    '<button class="btn-nav btn-page-edge" ' + (atEnd ? 'disabled style="opacity:.4"' : 'onclick="goPage(' + totalPages + ')"') + ' title="עבור לסוף">⏮</button>' +
    '<span class="page-jump">' +
      '<label for="pageJumpInput">עבור לדף</label>' +
      '<input type="number" id="pageJumpInput" min="1" max="' + totalPages + '" value="' + currentPage + '" onkeydown="if(event.key===\'Enter\')jumpToPage(' + totalPages + ')">' +
      '<button class="btn-nav" onclick="jumpToPage(' + totalPages + ')">עבור</button>' +
    '</span>';
}

function jumpToPage(totalPages) {
  var input = document.getElementById('pageJumpInput');
  var p = parseInt(input.value, 10);
  if (isNaN(p)) return;
  p = Math.max(1, Math.min(totalPages, p));
  goPage(p);
}

function goPage(p) {
  currentPage = p;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onCheckToggle(fileName, checked) {
  if (checked) selectedFiles.add(fileName);
  else selectedFiles.delete(fileName);
  renderSelectionBar();
}

function renderSelectionBar() {
  var bar = document.getElementById('selectionBar');
  var count = selectedFiles.size;
  if (count === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('selCount').textContent = 'נבחרו ' + count + ' מסלולים';
}

function clearSelection() {
  selectedFiles.clear();
  render();
}

// טיק - מנקה בחירה קודמת ובוחר רק את תוצאות החיפוש הנוכחיות (getFiltered(),
// לא כל המסלולים בקטלוג, גם אם רק חלק מהם מוצג בעמוד הנוכחי בגלל עימוד).
// הסרת הטיק - מנקה את כל הבחירה לגמרי.
function onSelectAllToggle(checked) {
  selectedFiles.clear();
  if (checked) {
    getFiltered().forEach(function (r) { selectedFiles.add(r.file_name); });
  }
  render();
}

function downloadSelected() {
  var files = ALL_ROUTES.filter(function (r) { return selectedFiles.has(r.file_name); });
  files.forEach(function (r, i) {
    setTimeout(function () {
      var a = document.createElement('a');
      a.href = encodeURI(r.gpx_path);
      a.download = r.file_name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 300);
  });
}

// נבחרו במכוון בלי אדום/כחול/ירוק/שחור - אלה כבר צבעי הכבישים ותגי הסימון הרשמיים
// של שבילי ישראל על גבי מפת הרקע (Israel Hiking Map) עצמה, ולכן מסלול בצבע כזה נבלע בתוכה.
var ROUTE_MAP_COLORS = ['#E91E8C', '#7C4DFF', '#FF6F00', '#00BCD4', '#AA00FF', '#FFAB00', '#F50057', '#6200EA', '#FF80AB', '#00E5FF'];
var routeMapInstance = null;
var routeMapLayers = [];

// עיגול = התחלה, מעוין (ריבוע מסובב) = סיום - באותו צבע של המסלול עצמו (לא צבע
// אחיד קבוע לכל המסלולים), כדי שבהשוואת כמה מסלולים יחד עדיין אפשר לדעת איזו
// נקודת התחלה/סיום שייכת לאיזה מסלול.
//
// shift (נוסף 20.08.2026): מסלול מעגלי (יוצא וחוזר לאותה נקודה בערך - נפוץ
// מאוד בדאטהסט הזה) גורם לשני הסמנים לחפוף בדיוק, והמעוין (שנוסף אחרון) היה
// מכסה לגמרי את העיגול מתחתיו. ל-shift יש ברירת מחדל '' (בלי היסט) בשימוש
// הרגיל - נדרש רק כשהקורא (showOnMap) מזהה חפיפה ומעביר היסט פיקסלים מפורש.
function routeStartIcon(color, shift) {
  return L.divIcon({
    className: '', iconSize: [14, 14], iconAnchor: [7, 7],
    html: '<div style="width:14px;height:14px;border-radius:50%;background:' + color + ';border:2px solid white;box-shadow:0 1px 3px rgba(0,0,0,.5);transform:' + (shift || '') + '"></div>'
  });
}
function routeEndIcon(color, shift) {
  return L.divIcon({
    className: '', iconSize: [12, 12], iconAnchor: [6, 6],
    html: '<div style="width:12px;height:12px;background:' + color + ';border:2px solid white;box-shadow:0 1px 3px rgba(0,0,0,.5);transform:' + (shift || '') + ' rotate(45deg)"></div>'
  });
}
function haversineM(a, b) {
  var R = 6371000, toRad = function (d) { return d * Math.PI / 180; };
  var dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
  var la1 = toRad(a[0]), la2 = toRad(b[0]);
  var h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// --- חיפוש לפי קורדינטות (נוסף 22.08.2026) ---
// המרה מרשת ישראל החדשה (ITM) ל-WGS84 - זהה במדויק ל-itmToWgs84 ב-
// YR1/bike/gpx_cleaner/gpx_cleaner.html, לא נכתב מחדש.
function itmToWgs84(x, y) {
  var a = 6378137.0, f = 1 / 298.257222101, k0 = 1.0000067;
  var lat0 = 31.73439361111111 * Math.PI / 180, lon0 = 35.20451694444444 * Math.PI / 180;
  var E0 = 219529.584, N0 = 626907.390;
  var e2 = 2 * f - f * f, e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  var calcM = function (phi) {
    return a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi) + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  };
  var M = calcM(lat0) + (y - N0) / k0, mu = M / (a * (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256));
  var phi1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu) + (151 * e1 ** 3 / 96) * Math.sin(6 * mu) + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
  var sinP = Math.sin(phi1), cosP = Math.cos(phi1), tanP = Math.tan(phi1);
  var N1 = a / Math.sqrt(1 - e2 * sinP ** 2), T1 = tanP ** 2, C1 = e2 / (1 - e2) * cosP ** 2, R1 = a * (1 - e2) / (1 - e2 * sinP ** 2) ** 1.5, D = (x - E0) / (N1 * k0);
  var lat = phi1 - (N1 * tanP / R1) * (D ** 2 / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 ** 2 - 9 * e2 / (1 - e2)) * D ** 4 / 24 + (61 + 90 * T1 + 298 * C1 + 45 * T1 ** 2 - 252 * e2 / (1 - e2) - 3 * C1 ** 2) * D ** 6 / 720);
  var lon = lon0 + (D - (1 + 2 * T1 + C1) * D ** 3 / 6 + (5 - 2 * C1 + 28 * T1 - 3 * C1 ** 2 + 8 * e2 / (1 - e2) + 24 * T1 ** 2) * D ** 5 / 120) / cosP;
  return { lat: lat * 180 / Math.PI, lon: lon * 180 / Math.PI };
}

// מפענח טקסט חיפוש כקורדינטה בשלוש שיטות אפשריות - מחזיר {lat, lon} או null
// אם הטקסט לא נראה כמו קורדינטה בכלל (יש בו אותיות שאינן N/S/E/W, כמו שם
// מסלול או ישוב) - כדי לא להפריע לחיפוש טקסט רגיל.
function parseCoordinateQuery(text) {
  var s = (text || '').trim();
  if (!s) return null;
  // בדיקה זולה מראש: אם יש בטקסט אות עברית/לועזית שאינה N/S/E/W - זה כנראה
  // חיפוש טקסט רגיל (שם מסלול/ישוב), לא קורדינטה - לא ממשיכים לנסות לפענח.
  // (a-z פרט ל-e/n/s/w עצמן, פלוס כל הטווח היוניקודי של עברית)
  if (/[a-dA-Df-mF-Mo-rO-Rt-vT-Vx-zX-Z֐-׿]/.test(s)) return null;

  // מעלות/דקות/שניות: 33°0'18.0"N 35°12'54.0"E (או בלי N/E, אחרי מקף/פסיק)
  var dms = /(-?\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)\s*['′]\s*(\d+(?:\.\d+)?)\s*["″]?\s*([NSns])?[,\s]+(-?\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)\s*['′]\s*(\d+(?:\.\d+)?)\s*["″]?\s*([EWew])?/.exec(s);
  if (dms) {
    var lat = parseFloat(dms[1]) + parseFloat(dms[2]) / 60 + parseFloat(dms[3]) / 3600;
    if (dms[4] && dms[4].toUpperCase() === 'S') lat = -lat;
    var lon = parseFloat(dms[5]) + parseFloat(dms[6]) / 60 + parseFloat(dms[7]) / 3600;
    if (dms[8] && dms[8].toUpperCase() === 'W') lon = -lon;
    return { lat: lat, lon: lon };
  }

  // שני מספרים מופרדים בפסיק/רווח/לוכסן, עם N/S/E/W אופציונלי - מעלות עשרוניות
  // אם הערכים קטנים (טווח קווי רוחב/אורך תקין), או רשת ישראל החדשה/ITM
  // (x/y גדולים בהרבה, עשרות-מאות אלפים) אם הערכים גדולים.
  var pair = /^\(?\s*([NSns])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSns])?\s*[,\s/]+\s*([EWew])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([EWew])?\s*\)?$/.exec(s);
  if (pair) {
    var n1 = parseFloat(pair[2]), n2 = parseFloat(pair[5]);
    if (Math.abs(n1) > 1000 || Math.abs(n2) > 1000) {
      return itmToWgs84(n1, n2);
    }
    var isSouth = (pair[1] && pair[1].toUpperCase() === 'S') || (pair[3] && pair[3].toUpperCase() === 'S');
    var isWest = (pair[4] && pair[4].toUpperCase() === 'W') || (pair[6] && pair[6].toUpperCase() === 'W');
    if (isSouth) n1 = -Math.abs(n1);
    if (isWest) n2 = -Math.abs(n2);
    return { lat: n1, lon: n2 };
  }

  return null;
}

// המרחק (ק"מ) הקצר ביותר בין נקודת החיפוש לבין נקודת ההתחלה או הסיום של
// המסלול - null אם אין למסלול קורדינטות בכלל (למשל קובץ בלי נקודות).
var COORD_SEARCH_RADIUS_KM = 3;
function routeDistanceKm(r, coord) {
  var dists = [];
  if (r.start_lat != null && r.start_lon != null) dists.push(haversineM([coord.lat, coord.lon], [r.start_lat, r.start_lon]) / 1000);
  if (r.end_lat != null && r.end_lon != null) dists.push(haversineM([coord.lat, coord.lon], [r.end_lat, r.end_lon]) / 1000);
  if (!dists.length) return null;
  return Math.min.apply(null, dists);
}

function parseGpxPoints(gpxText) {
  var doc = new DOMParser().parseFromString(gpxText, 'application/xml');
  var pts = Array.from(doc.querySelectorAll('trkpt'));
  if (!pts.length) pts = Array.from(doc.querySelectorAll('rtept'));
  if (!pts.length) pts = Array.from(doc.querySelectorAll('wpt'));
  return pts.map(function (el) {
    return [parseFloat(el.getAttribute('lat')), parseFloat(el.getAttribute('lon'))];
  }).filter(function (p) { return !isNaN(p[0]) && !isNaN(p[1]); });
}

function showOnMap() {
  var files = ALL_ROUTES.filter(function (r) { return selectedFiles.has(r.file_name); });
  if (!files.length) return;

  document.getElementById('mapOverlay').classList.add('show');
  document.getElementById('mapOverlayTitle').textContent = files.length === 1 ? routeNameOnly(files[0].file_name) : files.length + ' מסלולים נבחרים';
  document.getElementById('mapLoading').style.display = 'flex';
  document.getElementById('mapLegend').innerHTML = '';

  if (!routeMapInstance) {
    routeMapInstance = L.map('routeMap');
    L.tileLayer('https://israelhiking.osm.org.il/Tiles/{z}/{x}/{y}.png', {
      attribution: '© Israel Hiking Map', maxZoom: 16
    }).addTo(routeMapInstance);

    // לחיצה על נקודה כלשהי במפה - חלונית עם הקורדינטות של הנקודה הזו + כפתור
    // העתקה (לא לחיצה על מסלול/סמן ספציפי - כל נקודה על המפה). מחובר פעם אחת
    // בלבד ליצירת המפה (לא בכל showOnMap), כי המאזין הזה לא תלוי בנתוני מסלול.
    routeMapInstance.on('click', function (e) {
      var text = e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6);
      var popupHtml =
        '<div style="text-align:center;font-family:\'Assistant\',sans-serif">' +
          '<div style="font-family:monospace;margin-bottom:8px;direction:ltr">' + text + '</div>' +
          '<button onclick="copyCoordToClipboard(\'' + text + '\', this)" style="padding:5px 12px;border-radius:8px;border:none;background:var(--primary);color:white;cursor:pointer;font-family:\'Assistant\',sans-serif;font-size:.85rem">📋 העתקת קורדינטות</button>' +
        '</div>';
      L.popup().setLatLng(e.latlng).setContent(popupHtml).openOn(routeMapInstance);
    });
  }
  setTimeout(function () { routeMapInstance.invalidateSize(); }, 50);

  routeMapLayers.forEach(function (l) { routeMapInstance.removeLayer(l); });
  routeMapLayers = [];

  Promise.all(files.map(function (r, i) {
    return fetch(encodeURI(r.gpx_path))
      .then(function (resp) { return resp.text(); })
      .then(function (text) { return { route: r, points: parseGpxPoints(text), color: ROUTE_MAP_COLORS[i % ROUTE_MAP_COLORS.length] }; })
      .catch(function () { return { route: r, points: [], color: ROUTE_MAP_COLORS[i % ROUTE_MAP_COLORS.length] }; });
  })).then(function (results) {
    document.getElementById('mapLoading').style.display = 'none';
    var allBounds = [];
    var legend = document.getElementById('mapLegend');

    results.forEach(function (res) {
      var legendItem = document.createElement('div');
      legendItem.className = 'map-legend-item';
      var statsText = res.points.length
        ? ('📏 ' + res.route.distance_km + ' ק"מ &nbsp;·&nbsp; ' + elevationText(res.route))
        : 'שגיאה בטעינה';
      legendItem.innerHTML =
        '<span class="map-legend-swatch" style="background:' + res.color + '"></span>' +
        '<div class="map-legend-text">' +
          '<div class="map-legend-name">#' + res.route.id + ' ' + escapeHtml(routeNameOnly(res.route.file_name)) + '</div>' +
          '<div class="map-legend-stats">' + statsText + '</div>' +
        '</div>';
      legend.appendChild(legendItem);

      if (res.points.length) {
        var line = L.polyline(res.points, { color: res.color, weight: 4 }).addTo(routeMapInstance);
        var rStart = res.points[0], rEnd = res.points[res.points.length - 1];
        var rCoincide = haversineM(rStart, rEnd) < 30;
        var startMarker = L.marker(rStart, { icon: routeStartIcon(res.color, rCoincide ? 'translate(-5px,-5px)' : '') }).addTo(routeMapInstance);
        var endMarker = L.marker(rEnd, { icon: routeEndIcon(res.color, rCoincide ? 'translate(5px,5px)' : '') }).addTo(routeMapInstance);
        routeMapLayers.push(line, startMarker, endMarker);
        allBounds = allBounds.concat(res.points);
      }
    });

    if (allBounds.length) {
      routeMapInstance.fitBounds(allBounds, { padding: [30, 30] });
    }
  });
}

function closeMapOverlay() {
  document.getElementById('mapOverlay').classList.remove('show');
}

function copyCoordToClipboard(text, btn) {
  function showCopiedThenClose() {
    btn.textContent = '✓ הועתק';
    setTimeout(function () { routeMapInstance.closePopup(); }, 900);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopiedThenClose).catch(function () { copyCoordFallback(text, showCopiedThenClose); });
  } else {
    copyCoordFallback(text, showCopiedThenClose);
  }
}

// גיבוי ל-navigator.clipboard - נחוץ בהקשרים שבהם ה-API החדש לא זמין (למשל
// טעינה לא-מאובטחת/http, נדיר כאן אבל עדיף להישאר עקבי מול שאר האתר).
function copyCoordFallback(text, onSuccess) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); onSuccess(); } catch (e) {}
  document.body.removeChild(ta);
}

// פותח את gpx.studio (עורך GPX חינמי, קוד פתוח, בלי הרשמה) עם כל המסלולים
// שנבחרו טעונים יחד - כולל את פיצ'ר המיזוג האמיתי שלו (Merge). דורש שהקבצים
// יהיו נגישים ב-URL ציבורי (יש להם, הם כבר מתארחים כאן) וגם CORS פתוח על
// תיקיית ה-GPX (ראו netlify.toml). נבנה URL מוחלט יחסית לכתובת העמוד הנוכחי
// עצמו (new URL(...).href) ולא לדומיין קשיח - כך זה עובד נכון גם אם הנתיב/
// הדומיין שהאתר מתארח בו ישתנה בעתיד.
//
// חשוב - שני מנגנוני URL שונים ולא-תואמים באתר gpx.studio (התגלה בפועל
// 20-21.08.2026, אחרי שתי בדיקות עם צילומי מסך מהמשתמש): דף הבית הסטטי
// (gpx.studio/) מתעד בעמוד העזרה שלו ?state={"urls":[...]} - אבל זה מיועד
// ל-**embed** (iframe) בלבד, ומתעלם מ-query string כשנוחתים ישירות על דף
// הבית. עמוד האפליקציה האמיתי (gpx.studio/app) קורא פרמטר שונה לגמרי -
// ?files=["url1","url2"] (מערך JSON פשוט של כתובות, לא עטוף ב-{"urls":...}) -
// מאומת ישירות מול קוד המקור (+page.svelte של /app), לא ניחוש.
function mergeSelectedRoutes() {
  var files = ALL_ROUTES.filter(function (r) { return selectedFiles.has(r.file_name); });
  if (!files.length) return;
  var urls = files.map(function (r) { return new URL(r.gpx_path, window.location.href).href; });
  window.open('https://gpx.studio/app?files=' + encodeURIComponent(JSON.stringify(urls)), '_blank');
}

// מעביר את הקובץ הראשון שנבחר ל-YR1/bike/gpx_cleaner/gpx_cleaner.html (נוסף
// 22.08.2026) - אם נבחרו כמה קבצים, gpx_cleaner מנקה קובץ בודד בכל פעם, אז
// לוקחים רק את הראשון (לפי סדר התצוגה הנוכחי, לא סדר הבחירה). ניווט רגיל
// (לא טאב חדש) - gpx_cleaner.html עצמו טוען את הקובץ לפי פרמטרי ה-URL.
function cleanSelectedRoute() {
  var files = ALL_ROUTES.filter(function (r) { return selectedFiles.has(r.file_name); });
  if (!files.length) return;
  var r = files[0];
  var gpxUrl = new URL(r.gpx_path, window.location.href).href;
  window.location.href = '../gpx_cleaner/gpx_cleaner.html?gpx=' + encodeURIComponent(gpxUrl) + '&name=' + encodeURIComponent(r.file_name);
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxOverlay').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('show');
}
document.getElementById('lightboxOverlay').addEventListener('click', closeLightbox);

function toggleAcc(header) {
  var acc = header.closest('.accordion');
  var wasActive = acc.classList.contains('active');
  var container = acc.parentElement;
  container.querySelectorAll(':scope>.accordion.active').forEach(function (a) { if (a !== acc) a.classList.remove('active'); });
  acc.classList.toggle('active', !wasActive);
}

['searchInput'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', function () { hideRecentSearchesDropdown(); currentPage = 1; render(); });
});
document.getElementById('searchInput').addEventListener('focus', showRecentSearchesDropdown);
document.getElementById('searchInput').addEventListener('blur', function () {
  saveRecentSearch(this.value);
  // עיכוב קצר - כדי ש-onmousedown על פריט ברשימה יספיק להירשם לפני שהיא נסגרת
  setTimeout(hideRecentSearchesDropdown, 150);
});
['activityFilter', 'sourceFilter', 'regionFilter', 'sortSelect'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', function () { currentPage = 1; render(); });
});
