<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחן מקראות לקצונה</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --primary:#2563eb; --primary-dark:#1d4ed8; --border:#e5e7eb;
    --correct:#16a34a; --correct-bg:#dcfce7; --wrong:#dc2626; --wrong-bg:#fee2e2;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text);
    margin:0; padding:20px; direction:rtl;
  }
  .wrap{max-width:820px; margin:0 auto;}
  h1{text-align:center; font-size:1.7em; margin-bottom:4px;}
  .subtitle{text-align:center; color:var(--muted); margin-bottom:20px; font-size:0.95em;}
  .subtitle a{color:var(--primary); text-decoration:none; font-weight:600;}
  .subtitle a:hover{text-decoration:underline;}
  .card{background:var(--card); border-radius:12px; padding:20px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.07); margin-bottom:18px;}
  .setup-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  label{font-weight:600;}
  input[type=number]{
    width:90px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:1em;
  }
  button{
    background:var(--primary); color:#fff; border:none; border-radius:8px; padding:10px 18px;
    font-size:1em; cursor:pointer; font-weight:600; transition:background .15s;
  }
  button:hover{background:var(--primary-dark);}
  button.secondary{background:#6b7280;}
  button.secondary:hover{background:#4b5563;}
  button:disabled{background:#9ca3af; cursor:not-allowed;}
  .hint{color:var(--muted); font-size:0.9em;}
  .chapters-row{display:flex; flex-direction:column; align-items:stretch; gap:8px;}
  .chapters-list{
    max-height:200px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;
    padding:6px 12px; background:#fafafa;
  }
  .chapter-item{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:0.95em; border-bottom:1px solid #eee;}
  .chapter-item:last-child{border-bottom:none;}
  .chapter-item input{accent-color:var(--primary); width:17px; height:17px; flex-shrink:0; cursor:pointer;}
  .chapter-item label{font-weight:400; cursor:pointer;}
  .chapters-actions{display:flex; gap:14px;}
  .chapters-actions a{color:var(--primary); font-size:0.85em; cursor:pointer; text-decoration:none;}
  .chapters-actions a:hover{text-decoration:underline;}
  .q-num{color:var(--muted); font-size:0.9em; margin-bottom:6px;}
  .q-text{font-size:1.15em; font-weight:600; margin-bottom:16px; line-height:1.5;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border:2px solid var(--border);
    border-radius:10px; cursor:pointer; transition:all .12s; font-size:1em;
  }
  .opt:hover{border-color:var(--primary);}
  .opt.selected{border-color:var(--primary); background:#eff6ff;}
  .opt.correct{border-color:var(--correct); background:var(--correct-bg); font-weight:600;}
  .opt.wrong{border-color:var(--wrong); background:var(--wrong-bg); font-weight:600;}
  .opt input{accent-color:var(--primary); width:18px; height:18px; flex-shrink:0;}
  .opt.disabled{cursor:default;}
  .feedback{margin-top:12px; font-weight:700; font-size:1.05em; min-height:1.4em;}
  .feedback.correct{color:var(--correct);}
  .feedback.wrong{color:var(--wrong);}
  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; flex-wrap:wrap;}
  .progress{color:var(--muted); font-size:0.9em;}
  .score-box{text-align:center;}
  .score-box .big{font-size:2.4em; font-weight:800; color:var(--primary); margin:10px 0;}
  .score-box .pct{font-size:1.2em; color:var(--muted); margin-bottom:16px;}
  .hidden{display:none !important;}
  .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .footer-link-btn{
    display:block; margin:16px auto 0; background:none; color:var(--muted); font-size:0.85em;
    font-weight:400; box-shadow:none; padding:6px 10px;
  }
  .footer-link-btn:hover{color:var(--primary); background:none;}
  #revealBtn{background:#f59e0b;}
  #revealBtn:hover{background:#d97706;}
  .opt input:disabled{cursor:default;}
  .explain-row{margin-top:12px;}
  #explainBtn{background:#8b5cf6;}
  #explainBtn:hover{background:#7c3aed;}
  .explain-box{
    max-height:0; overflow:hidden; transition:max-height .25s ease, margin-top .25s ease, padding .25s ease;
    background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; margin-top:0; padding:0 14px;
  }
  .explain-box.open{max-height:400px; margin-top:12px; padding:12px 14px;}
  .explain-box p{margin:0; line-height:1.6; font-size:0.95em; color:#3730a3;}
  @media (max-width:600px){
    .card{padding:16px;}
    h1{font-size:1.4em;}
    .q-text{font-size:1.05em;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>מבחן מקראות לקצונה</h1>
  <div class="subtitle">שאלון תרגול מרובה-ברירה — היסטוריה, אזרחות, מורשת ומועדים</div>
  <div class="subtitle"><a href="files/אוגדן הכנה לקצונה.pdf" target="_blank" rel="noopener">📄 לצפייה באוגדן הכנה לקצונה (PDF)</a></div>

  <div id="setupScreen" class="card">
    <div class="setup-row chapters-row">
      <label>באילו פרקים לתרגל?</label>
      <div class="chapters-actions">
        <a id="selectAllChapters">בחר הכל</a>
        <a id="clearAllChapters">נקה הכל</a>
      </div>
      <div class="chapters-list" id="chaptersList"></div>
    </div>
    <div class="setup-row">
      <label for="numQ">כמה שאלות תרצה בניסיון?</label>
      <input type="number" id="numQ" min="10" value="20">
      <span class="hint">(סה"כ שאלות זמינות בפרקים שנבחרו: <span id="totalCount"></span>)</span>
    </div>
    <div class="btn-row">
      <button id="startBtn">התחל מבחן</button>
    </div>
  </div>

  <div id="quizScreen" class="card hidden">
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-row">
      <button id="revealBtn" class="secondary">גלה תשובה</button>
      <span class="progress" id="progressText"></span>
      <button id="nextBtn" disabled>השאלה הבאה</button>
    </div>
    <div class="explain-row">
      <button id="explainBtn">הצג הסבר</button>
    </div>
    <div class="explain-box" id="explainBox"><p id="explainText"></p></div>
  </div>

  <div id="resultScreen" class="card score-box hidden">
    <h2>סיימת את המבחן!</h2>
    <div class="big" id="scoreText"></div>
    <div class="pct" id="pctText"></div>
    <div class="btn-row">
      <button id="restartBtn">מבחן חדש</button>
    </div>
  </div>

  <button id="backToStartBtn" class="footer-link-btn">חזרה להתחלה</button>
</div>

<script>
const QUESTIONS = [
[`מה תפקיד הקואליציה?`,[`להוות איזון ובלימה לממשלה`,`לגבות בכנסת את צעדי הממשלה ולהגן על חקיקותיה`,`להציע לציבור אלטרנטיבה שלטונית ולבקר את פעילות הממשלה`,`לספק סעד לאזרח או לגופים הנדרשים לו`],1],
[`איזה חוק קובע כי לכל יהודי הזכות לעלות ארצה ולקבל אזרחות ישראלית ללא תנאי?`,[`חוק השיבה לארץ ישראל`,`חוק האזרחות`,`חוק השבות`,`חוק יסוד כבוד האדם וחירותו`],2],
[`איזו אוכלוסיה צורפה לחוק השבות לאחר תיקופו?`,[`יהודים מהעליה הראשונה והשניה`,`ילדיהם ונכדיהם של יהודים`,`גויים המעוניינים להתגייר ולעלות ארצה`,`בני מיעוטים המעוניינים לחיות בשטחי הארץ`],1],
[`איזו מילה לא נמצאת בתוך מגילת העצמאות?`,[`ציונית`,`שואה`,`יהודית`,`דמוקרטית`],3],
[`איזו תנועה או מפלגה הנהיג דויד וולפסון?`,[`אגודת ישראל`,`מפלגת בית"ר`,`התנועה הציונית`,`ההסתדרות הכללית`],2],
[`אילו 2 מערכות ניתן למצוא באופייה הדמוקרטי של כל מדינה?`,[`מערכת חינוך- ערכית, מערכת משפטית- מוסדית`,`מערכת חינוך- מוסדית, מערכת משפטית- ערכית`,`מערכת פורמלית- מוסדית, מערכת תרבותית- ערכית`,`מערכת פורמאלית- ערכית, מערכת תרבותית- מוסדית`],2],
[`אילו אירועים התרחשו בעקבות חקיקת חוק יסוד "ירושלים בירת ישראל"?`,[`פותחו מוסדות כלכליים, חינוכיים ומסחריים רבים בירושלים`,`פותחו מוסדות כלכליים, חינוכיים ודתיים רבים בירושלים`,`שגריריות העבירו את מקום מושבן מתל אביב לירושלים`,`שגריריות העבירו את מקום מושבן מירושלים לתל אביב`],3],
[`אילו מקצועות מוגדים "לימוד חובה" עפ"י הגדרת הסוכנות היהודית במסמך הסטטוס קוו?`,[`היסטוריה, שיטת מחקר, עברית`,`גיאוגרפיה, היסטוריה ועברית`,`מורשת, עברית, היסטוריה`,`עברית, היסטוריה ומדעים`],3],
[`באיזו שנה החל מבקר המדינה לשמש כנציב תלונות הציבור?`,[`1976`,`1972`,`1971`,`1974`],2],
[`באיזו שנה נוסד בנק ישראל?`,[`1950`,`1954`,`1956`,`1952`],1],
[`באיזה שנה נכתב ההמנון?`,[`1887`,`1933`,`1878`,`1947`],2],
[`באילו מקרים מחוייב החייל לסרב פקודה?`,[`כאשר הפקודה קשה לביצוע ונאלצים לערב גורם בכיר`,`כאשר הפקודה ניתנה לא ממפקדו הישיר`,`כאשר הפקודה בלתי חוקית`,`כאשר הפקודה עשויה לפגוע בחייו של אדם במישירין`],3],
[`באילו ערים ישנה תחבורה ציבורית בשבת?`,[`נהריה ואילת`,`ירושלים וחיפה`,`תל אביב וירושלים`,`חיפה ואילת`],3],
[`בעקבות איזה אירוע הוגדר המושג "פקודה בלתי חוקית בעליל"?`,[`מלחמת ששת הימים`,`מלחמת העצמאות`,`אירועי יום האדמה`,`טבח בכפר קסם`],3],
[`האם הדמוקרטיה משפיעה על צה"ל וחייליו?`,[`לא, צה"ל הוא מסגרת נפרדת שלא כפופה לשום גורם ולכן חוקי הדמוקרטיה המדיניים אינם חלים בו`,`לא, צה"ל הוא מסגרת היררכית הפועלת על פי עקורונות שאינם כפופים לעקרונות הדמוקרטיה`,`כן, פקודותיו של צה"ל כפופות לעקרונות הדמוקרטיה ומחוייבות להיות שוויוניות`,`כן, חיילי צה"ל זכאים לקבל את כל הזכויות המגיעות לאזרחים במדינת ישראל`],2],
[`האם חוק השבות יכול להכריע בשאלה "מיהו יהודי"?`,[`כן, החוק בנוסח המקורי יכול להכריע בשאלה זו`,`לא, החוק בנוסח המקורי לא יכול להכריע בשאלה זו`,`לא, פרט ליהודים המגדירים עצמם אתאיסטים, או ליהודים ניצולי שואה`,`כן, פרט ליהודים המגדירים עצמם אתאיסטים, או ליהודים ניצולי שואה`],1],
[`כיצד נבחר מבקר המדינה?`,[`החלטת ראש הממשלה`,`בחירות חשאיות בכנסת`,`החלטת נשיא המדינה`,`משעל עם`],1],
[`כמה חברי כנסת מכהנים בכנסת ישראל?`,[`140`,`120`,`80`,`100`],1],
[`כמה חוקי יסוד קיימים במדינת ישראל?`,[`10`,`15`,`12`,`11`],3],
[`למושג יהדות שלוש פנים, מה הם?`,[`דת, תרבות ומורשת`,`מורשת, תרבות ולאום`,`דת, לאום ותרבות`,`דת, לאום ומורשת`],2],
[`מבין האפשרויות הבאות, מה נחשבת לסוגיה מרכזית בדמוקרטיה הישראלית?`,[`חילול שבת`,`עיקרון הייצוגיות ועיקרון המשילות`,`גיוס בנות למערך הלוחם`,`גיוס חובה לצה"ל`],1],
[`מה מהבאים מכונה "מגילת זכויות האדם"?`,[`פשרת הררי`,`מגילת העצמאות`,`חוק יסוד כבוד האדם וחירותו`,`מסמך הסטטוס קוו`],2],
[`מה מהבאים עיצב מקסים שמיר?`,[`פסל המנורה המוצב מול הכנסת`,`סמל צה"ל`,`דגל ישראל`,`סמלה של מדינת ישראל`],3],
[`מה ניתן למצוא בתוכן חוק שירות וביטחון?`,[`גיל הגיוס, משך השירות, פטור אזרחי משירות`,`משך השירות, הכשרות יסוד, פקודות מטכ"ל`,`הכשרות יסוד, משך השירות, גיל הגיוס`,`פקודות מטכ"ל, גיל הגיוס, פטור אזרחי משירות`],0],
[`מה קובע חוק השבות?`,[`הגדרה למונח "יהודי" על בסיס ההלכה וחוקי הגיור`,`לכל יהודי זכות לעלות ארצה ולקבל אזרחות ישראלית`,`הסדרת חובות השירות הסדיר בצה"ל`,`עליה לארץ וקבלת אזרחות ליהודים ניצולי שואה`],1],
[`מה תפקיד האופוזיציה?`,[`לגבות בכנסת את צעדי הממשלה ולהגן על החלטותיה`,`להוביל את הכנסת ולבקר את הממשלה`,`להציע לציבור אלטרנטיבה שלטונית ולבקר את הממשלה`,`לייצג את הציבור בממשלה ולחוקק חוקים`],2],
[`מה תפקידו השני של מבקר המדינה?`,[`נציב תלונות הציבור`,`נגיד בנק ישראל`,`ממלא מקום נשיא המדינה`,`ח"כ באופוזיציה`],0],
[`מהו אורך כהונתו של הנשיא?`,[`שבע שנים`,`ארבע שנים`,`חמש שנים`,`שש שנים`],0],
[`מהו אחד מתפקידי נשיא המדינה?`,[`מקבל את כתבי האמנה של שגרירים זרים`,`לקבוע את עונשם של אסירי מדינה בלבד`,`נשיא המדינה יחליף את ראש הממשלה בהיעדרו`,`מסמיך שגרירים זרים בישראל`],0],
[`מהו הגורם האחראי לבקרה ופיקוח על גופים ציבוריים?`,[`בית המשפט העליון`,`בית הנשיא`,`הכנסת`,`משרד מבקר המדינה`],3],
[`מהו העקרון החשוב ביותר המנחה את מערכת בתי המשפט?`,[`זכות הנאשם לייצוג עורך דין הולם`,`ניטרליות, עצמאית ונטולת פניות`,`שיוויוניות והימנעות מקבלת שוחד`,`גובה משכורת המונע קבלת שוחד`],1],
[`מהו מטרת מסמך הסטטוס קוו?`,[`דו קיום בין יהודים לבני מיעוטים`,`להכיר במספר דתות במדינת ישראל`,`דו קיום בין דתיים לחילוניים`,`להגדיר את דיני השבת במדינת ישראל`],2],
[`מהו מעמדו של חוק כבוד האדם וחירותו ביחס לחוקים אחרים?`,[`עליון מעל כל חוקי המדינה`,`שווה ערך לחוקי היסוד`,`שווה ערך לחוקי היסוד`,`עליון מעל כל חוקי היסוד`],0],
[`מהו מקום מושבו של בנק ישראל?`,[`ירושלים`,`חיפה`,`תל אביב`,`באר שבע`],0],
[`מהו מקור השם "כנסת"?`,[`הכנסת הגדולה שהתכנסה בי-ם בימי בית שני`,`מקום משכן זקני העיר בתקופת השופטים`,`נלקח מהמילה כינוסייה, מהשפה הלטינית`,`בית הכנסת הגדול בעיירת טיקוצ'ין שבפולין`],0],
[`מהו נציב תלונות הציבור?`,[`גוף שמרכז את תלונות האזרחים שנפגעו מגוף ציבורי`,`גוף העוטר לבג"צ לטובת זכויותיהם של אזרחים`,`גוף המגן על זכויות התושבים במסגרת עירונית`,`גוף ממשלתי המרכז את עבירות הציבור על החוק`],0],
[`מהו עיקרה של היהדות כדת?`,[`מצוות ההלכה והמסורת`,`רעיונות וסמלים לאומיים`,`גורל וייעוד המשותפים לכל יהודי הארץ`,`הזיקה למדינת ישראל`],0],

`השם 'כנסת' נגזר מ'הכנסת הגדולה' שהתכנסה בירושלים בימי בית שני.`,
`נציב תלונות הציבור הוא גוף המרכז תלונות של אזרחים שנפגעו מפעולת גוף ציבורי.`,
`עיקרה של היהדות כדת הוא מצוות ההלכה והמסורת.`,
`'המטבחון' הוא כינוי לפורום המצומצם בממשלה, המקבל החלטות מדיניות וביטחוניות מיידיות ורגישות.`,
`לאחר קום המדינה התמקד תפקידה של הסוכנות היהודית בקידום העלייה והקליטה בארץ.`,
`תפקידה של קק"ל הוא איסוף כספים לרכישת קרקעות בארץ ישראל.`,
`נגיד בנק ישראל משמש כיועץ הכלכלי הראשי של הממשלה.`,
`כנסת ישראל מתכנסת ופועלת בצורת מליאה.`,
`חשיבותו של עיקרון הפרדת הרשויות היא שהרשויות (המחוקקת, המבצעת והשופטת) מאזנות ובולמות זו את זו.`,
`חוק השבות מבטא את אופייה של ישראל כמדינה יהודית וכבית פוטנציאלי לכל יהודי התפוצות.`,
`פקודה בלתי חוקית בעליל היא פקודה שביצועה עלול לפגוע בחיי אדם באופן ברור וגלוי.`,
`'פשרת הררי' (1950) קבעה שחוקי יסוד ייחקקו בהדרגה, במקום חוקה כתובה ומגובשת אחת.`,
`בישראל נהוגה שיטת בחירות פרלמנטרית-יחסית ארצית.`,
`עקרונות היסוד של מערכת המשפט: שוויון בפני החוק, פומביות, זכות להליך הוגן ושקיפות.`,
`קק"ל הם ראשי תיבות של 'קרן קיימת לישראל'.`,
`שני תפקידיה העיקריים של הכנסת: חקיקת חוקים ובקרה על עבודת הממשלה.`,
`שני סוגי הדמוקרטיה הם דמוקרטיה ישירה (הכרעה ישירה של הציבור) ודמוקרטיה עקיפה/ייצוגית (באמצעות נבחרי ציבור).`,
`שלוש הרשויות בדמוקרטיה: הרשות המחוקקת (הכנסת), הרשות המבצעת (הממשלה) והרשות השופטת (בתי המשפט).`,
`כנסת ישראל פועלת בשתי דרכים עיקריות: מליאה (מושב כלל חברי הכנסת) וועדות הכנסת.`,
`תיאודור (בנימין זאב) הרצל הקים ב-1897 את ההסתדרות הציונית העולמית בקונגרס הציוני הראשון בבזל.`,
`הרב אברהם יצחק הכהן קוק היה הרב הראשי האשכנזי הראשון וממייסדי מוסד הרבנות הראשית לישראל.`,
`בתי הדין הרבניים ממונים על ענייני הנישואין והגירושין של יהודים בישראל.`,
`על פי חוק, נשיא המדינה עומד בראש מדינת ישראל, אף שתפקידו בעיקרו טקסי וייצוגי.`,
`כל חייל ומפקד, בשירות סדיר ובמילואים, רשאי לפנות לנציב קבילות החיילים.`,
`ממשלת ישראל מורכבת מכלל השרים המכהנים בה, בראשות ראש הממשלה.`,
`בשנת 1992, עם חקיקת חוק יסוד: כבוד האדם וחירותו, עוגן בחוק אופייה של ישראל כמדינה יהודית ודמוקרטית.`,
`קק"ל (קרן קיימת לישראל) נוסדה בשנת 1901 בקונגרס הציוני החמישי.`,
`חוק יסוד: ירושלים בירת ישראל התקבל בכנסת בשנת 1980.`,
`חוק השבות התקבל בכנסת בשנת 1950.`,
`חוק יסוד: כבוד האדם וחירותו התקבל בכנסת בשנת 1992.`,
`חוק שירות ביטחון התקבל בכנסת בשנת 1949.`,
`דגלה הרשמי של מדינת ישראל נבחר רשמית ב-28 באוקטובר 1948.`,
`ארגון אגודת ישראל, תנועה יהודית-חרדית לא-ציונית, נוסד בשנת 1912.`,
`הסוכנות היהודית לארץ ישראל נוסדה בשנת 1929.`,
`הרבנות הראשית לישראל נוסדה בשנת תרפ"א (1921).`,
`'התקווה' נקבעה רשמית כהמנון התנועה הציונית בקונגרס הציוני ה-18 בשנת 1933.`,
`חוק השבות תוקן ב-1970 (תיקון מספר 2), שהרחיב את זכאות העלייה לבני משפחה נוספים.`,
`מבקר המדינה נבחר על ידי הכנסת בבחירות חשאיות.`,
`המהפכה החוקתית מושתתת על העצמת מעמדו של חוק יסוד: כבוד האדם וחירותו מעל חוקים 'רגילים' אחרים.`,
`חזון הקמת מדינה יהודית בארץ ישראל מושתת, לפי מגילת העצמאות, על חזונם של נביאי ישראל.`,
`הרבנות הראשית ממונה על מערכת הנישואין והגירושין, ניהול הכשרות ותחזוקת מתקנים דתיים יהודיים.`,
`עם קבלת משימה מחויב החייל להזדהות עם חובת ביצוע המשימה, גם אם אינו מסכים עם תוכנה.`,
`תפילת 'כל נדרי' פותחת את יום הכיפורים, ותפילת 'נעילה' מסיימת אותו.`,
`פקידת בתי קברות אינה בין חמשת עמודי האסלאם (עדות אמונה, תפילה, צדקה, צום רמדאן, עלייה לרגל למכה).`,
`פרשת 'שמע' (קריאת שמע) היא הפרשה הכתובה על הקלף שבתוך המזוזה.`,
`הסידור מכיל את כלל התפילות והברכות הנאמרות בחיי היום-יום.`,
`בתקופת החגים נעזרים ב'מחזור' - סידור תפילה מיוחד לימים הנוראים ולרגלים.`,
`בשנת 1963 נקבע בחוק שיום הזיכרון לחללי מערכות ישראל יחול סמוך ליום העצמאות.`,
`בשנים האחרונות ראש השנה לאילנות (ט"ו בשבט) הפך מזוהה עם פעילויות איכות סביבה ושמירה על הקיימות.`,
`יצחק רבין ז"ל נקבר בהר הרצל בירושלים.`,
`חג הסוכות חל בט"ו בתשרי ונמשך שבעה ימים.`,
`חג הפסחא הנוצרי חוגג את יום קימתו של ישו לתחייה.`,
`יום הזיכרון הממלכתי להרצל חל בי' באייר, יום הולדתו.`,
`יום השואה הבינלאומי חל ב-27 בינואר, יום שחרור מחנה ההשמדה אושוויץ בידי הצבא האדום ב-1945.`,
`תפילת העמידה מכונה גם 'תפילת שמונה עשרה' (על שם מספר ברכותיה המקורי).`,
`רחבעם זאבי (גנדי) ז"ל נרצח בידי מתנקשים פלסטינים ממחתרת החזית העממית במלון בירושלים ב-2001.`,
`צום הרמדאן מתחיל מדי יום בארוחת ה'סחור' (לפני עלות השחר) ומסתיים בארוחת ה'אפטאר' (עם השקיעה).`,
`יהודי מאמין מניח תפילין שש פעמים בשבוע, מלבד בשבת.`,
`מוסלמים מתפללים לכיוון העיר מכה, אל עבר הכעבה ('אלחראם').`,
`התורה מתחלקת לשני סוגי מצוות: מצוות שבין אדם למקום ומצוות שבין אדם לחברו.`,
`עולים לרגל לחג הנביא אליהו אל קבר הנביא אלח'אדר (המזוהה עם אליהו הנביא).`,
`קבר הנביא שועייב קדוש לעדה הדרוזית.`,
`ארץ ישראל קדושה לנצרות מכיוון שלפי האמונה הנוצרית ישו חי בה את כל חייו.`,
`צום י"ז בתמוז מציין את פריצת חומות ירושלים בידי נבוכדנצר, לפני חורבן בית המקדש הראשון.`,
`שנה מעוברת נקבעת כדי לסנכרן בין הלוח העברי (המבוסס על הירח) לבין מחזור השנה השמשי.`,
`שוברים כוס בטקס הנישואים היהודי לזכר חורבן בית המקדש והיציאה לגלות, גם בשעת שמחה.`,
`היהודים ה'קראים' אינם מקבלים את פרשנות חז"ל (התורה שבעל פה) לתורה שבכתב, בשונה מהיהדות הרבנית.`,
`הרצל כונה 'חוזה המדינה', על שם חזונו וספרו 'מדינת היהודים' שהתווה את הדרך להקמת מדינה יהודית.`,
`לפי הדת הדרוזית, 'אלחכם' היה נביא אמת, ואילו המוסלמים רואים במוחמד את הנביא האחרון ואינם מכירים בנביאים שלאחריו.`,
`חג הקורבן (עיד אל-אדחא) באסלאם מסמל את מועד העלייה לרגל למכה ולזכר נכונות אברהם להקריב את בנו.`,
`צום הרמדאן מסמל טיהור הגוף והנפש ממחשבות ומעשים רעים.`,
`צום עשרה בטבת מציין את תחילת המצור הבבלי על ירושלים, שהוביל בהמשך לחורבנה.`,
`שנים עשר המשואות (משואות ביום הזיכרון) מסמלות את שנים עשר שבטי ישראל.`,
`ביצת הפסחא מסמלת פריון והיווצרות של חיים חדשים.`,
`ברית המילה מסמלת את הברית והקשר בין עם ישראל לאלוהים.`,
`תקיעת השופר מסמלת את הצורך להתעורר לתשובה ומזכירה את סיפור עקדת יצחק.`,
`צום גדליה מציין את רציחתו של גדליה בן אחיקם בידי מתנקש, לאחר חורבן בית המקדש הראשון.`,
`כ"ב בתשרי הוא תאריך חג שמיני עצרת ושמחת תורה.`,
`מגילת רות מתארת את גיורה של רות המואבייה והצטרפותה לעם ישראל.`,
`'שולחן ערוך' (מאת רבי יוסף קארו) הוא ספר ההלכה המרכזי ביהדות.`,
`ההבדל המהותי הוא שהתורה שבכתב תמציתית, ואילו התורה שבעל פה מפרטת, מסבירה ומרחיבה אותה.`,
`'הנובי גוד' הוא חג ערב השנה החדשה הנהוג ברוסיה ובחבר העמים.`,
`חג הסיגד הוא חג של צום, טהרה והתחדשות אצל יהודי אתיופיה, ובו נערך טקס לחידוש הברית בין העם לאל.`,
`'מצעד החיים' הוא מצעד הזיכרון לשואה הנערך כיום בין מחנות ההשמדה אושוויץ לבירקנאו.`,
`'נביא' הוא אדם שחווה, לפי האמונה, התגלות על-אנושית.`,
`'התוספתא' היא מסמך המכיל 'משניות' (ברייתות) נוספות שלא נכללו בתוך המשנה עצמה.`,
`'הלכה' הוא שם כולל לחוקים, לדינים ולמצוות של היהדות.`,
`התורה שבעל פה היא התורה המפרשת, המבארת ומסבירה את התורה שבכתב.`,
`'כשרות' היא מערכת החוקים הקובעת אילו סוגי מזון מותרים לאכילה על פי היהדות.`,
`מטרת התלמוד היא לפרש ולהרחיב את המשנה.`,
`'פרשת השבוע' היא פרשה מהתורה הנקראת בבית הכנסת בכל שבת.`,
`'שמחת בית השואבה' היא שמחה לזכר טקס ניסוך המים שנערך בימי חול המועד סוכות בתקופת בית המקדש.`,
`תפילת התשליך נאמרת ביום הראשון של ראש השנה, ומבטאת את הרצון להשליך את החטאים ולחזור בתשובה.`,
`ל"ט אבות מלאכה הן שלושים ותשע מלאכות עקרוניות האסורות בשבת על פי ההלכה.`,
`שלושת הרגלים (פסח, שבועות וסוכות) הם חגים שבהם עלו עולי הרגל לבית המקדש בירושלים.`,
`'ברייתות' הן 'משניות' חיצוניות למשנה, שלא נכללו בעריכתה המקורית של רבי יהודה הנשיא.`,
`סת"ם הם ראשי תיבות של שלושה תשמישי קדושה: ספר תורה, תפילין ומזוזה.`,
`'ג'והאל' הוא כינוי לדרוזים שאינם בקיאים בסודות הדת הדרוזית לעומקם.`,
`'אדיגים' הוא כינוי למוסלמים צ'רקסים החיים בישראל.`,
`'התנאים' הם חכמי המשנה, בני התקופה שקדמה לחכמי התלמוד (האמוראים).`,
`הנביא הקדוש ביותר לדרוזים הוא הנביא שועייב (המזוהה עם יתרו).`,
`את 'התפילה לשלום המדינה' חיבר הסופר ש"י עגנון.`,
`את השיר 'מגש הכסף' כתב המשורר נתן אלתרמן.`,
`את המשנה ערך וחתם רבי יהודה הנשיא.`,
`מצוות ארבעת המינים היא נטילת אתרוג, לולב, הדס וערבה בתפילה בחג הסוכות.`,
`חג הנביא סבלאן (אצל הדרוזים) חל בעשירי בספטמבר.`,
`חג הקורבן המוסלמי נמשך חמישה ימים ומסתיים ב-10 לחודש האחרון בלוח השנה ההג'רי.`,
`חנוכה חל בכ"ה בכסלו.`,
`יום הולדתו של הנביא מוחמד חל בי"ב (שנים עשר) בחודש השלישי בלוח ההג'רי (רביע אל-אוול).`,
`יום הזיכרון הממלכתי לז'בוטינסקי חל בכ"ט בתמוז.`,
`יום הזיכרון לחללי מערכות ישראל ולנפגעי פעולות איבה חל בד' באייר.`,
`יום הזיכרון לשואה ולגבורה חל בכ"ז בניסן.`,
`יום הזיכרון הממלכתי לרחבעם זאבי (גנדי) ז"ל חל בל' בתשרי.`,
`יום הכיפורים חל בי' בתשרי.`,
`יום העצמאות חל בה' באייר.`,
`יום ירושלים חל בכ"ח באייר.`,
`ל"ג בעומר חל שלושים ושלושה ימים מפסח (ביום ה-33 לספירת העומר).`,
`פורים חוגגים בי"ד באדר ברוב הארץ, ובירושלים (עיר מוקפת חומה) חוגגים 'שושן פורים' בט"ו באדר.`,
`ראש השנה לאילנות (ט"ו בשבט) חל בט"ו בשבט.`,
`ראש השנה חל באחד בתשרי.`,
`תפילת מנחה מתקיימת בין חצות היום ועד השקיעה.`,
`יצחק רבין ז"ל נרצח ב-4 בנובמבר 1995 בכיכר מלכי ישראל בתל אביב.`,
`לבישת בגדים לבנים בלבד אינה בין איסורי יום הכיפורים הנגזרים מהמצווה 'ועיניתם את נפשותיכם' (אכילה, שתייה, רחיצה, סיכה, נעילת סנדל ויחסי אישות).`,
`רציחת גדליה בן אחיקם אינה קשורה לט' באב (היא מצוינת בצום גדליה, ג' בתשרי) - בט' באב חרבו שני בתי המקדש ואירועים נוספים.`,
`לפני גירוש ספרד (1492) ניתן ליהודים אולטימטום: להתנצר או לעזוב את ספרד.`,
`חג החנוכה נקבע כזכר לניצחון המרד החשמונאי על היוונים ולחנוכת בית המקדש מחדש.`,
`גלות בני האליטה מממלכת יהודה בשנת 597 לפנה"ס מכונה גם 'גלות יהויכין' וגם 'גלות החרש והמסגר'.`,
`משפחת החשמונאים הנהיגה את המרד שפרץ ב-167 לפנה"ס נגד השלטון ההלניסטי (היווני-סלווקי).`,
`'איליה קפיטולינה' הוא שמה של העיר הרומית שנבנתה על חורבות ירושלים לאחר מרד בר כוכבא.`,
`בני האליטה של ממלכת יהודה הוגלו בשנת 597 לפנה"ס במה שמכונה 'גלות יהויכין'.`,
`הקהילה היהודית שדיברה את שפת ה'לדינו' התגוררה בעיקר בספרד ובגירושיה לאחר מכן.`,
`'גלות החרש והמסגר' התרחשה בשנת 597 לפני הספירה.`,
`המהפכה הצרפתית פרצה בשנת 1789.`,
`הגנרל הרומי פומפיוס כבש את ירושלים בשנת 63 לפני הספירה.`,
`אלכסנדר הגדול עלה לכס המלוכה בשנת 336 לפני הספירה.`,
`עזרא הסופר, עם הגיעו לארץ ישראל, ביקש להילחם בתופעת נישואי התערובת בקרב העם.`,
`ה'סבוראים' עסקו בהסברת התלמוד ובהנחלתו לציבור הלומדים, לאחר תקופת האמוראים.`,
`'האנוסים' היו יהודי ספרד ופורטוגל שהומרו בכפייה לדת הנוצרית אך המשיכו לשמור על יהדותם בסתר.`,
`רבי יוחנן בן זכאי ביקש לייסד מרכז רוחני חלופי ליהדות בעיר יבנה, לאחר חורבן בית המקדש השני.`,
`האר"י הקדוש (רבי יצחק לוריא) גדל במצרים.`,
`הקהילה היהודית השנייה בגודלה בעולם (אחרי ישראל) מתקיימת כיום בארה"ב.`,
`יעקב ועשיו הם בניהם של יצחק ורבקה.`,
`יצחק הוא בנה של שרה (ואברהם).`,
`בהיסטוריה של אתיופיה כונו היהודים 'פלאשים'.`,
`'ועד ארבע הארצות' נתן ליישוב היהודי בפולין אוטונומיה פנימית ויכולת קיום עצמאית.`,
`חלוקת פולין פגעה באוטונומיה שהייתה ליהודים ובכך גם בפרנסתם.`,
`רבי יהודה הנשיא כונה בספרות חז"ל בפשטות 'רבי'.`,
`הממלכה המאוחדת של דוד ושלמה כונתה 'ממלכת ישראל המאוחדת'.`,
`חכמי התלמוד מכונים 'אמוראים' (בהבדל מ'תנאים', חכמי המשנה).`,
`המתנגדים לתנועת החסידות כונו 'ליטאים' (או 'מתנגדים').`,
`מסע הנדודים של בני ישראל במדבר נערך במשך כ-40 שנה.`,
`תנועת החסידות פעלה לקרב את כלל היהודים, כולל חסרי השכלה ומעוטי יכולת, אל הדת והאמונה.`,
`עלילת הדם האנטישמית טוענת (בשקר) שיהודים משתמשים בדם ילדים נוצרים לאפיית מצות בפסח.`,
`לפי צוואת הורדוס, ממלכתו חולקה בין בני משפחתו לאחר מותו.`,
`ליהודים היה קל להשתלב בחברה האמריקאית, בין היתר, בשל מאפיין ייחודי של ארה"ב - הפרדת הדת מהמדינה.`,
`הצהרת כורש נתנה רשות ליהודים לשוב לירושלים ולבנות מחדש את בית המקדש.`,
`מפעלו המרכזי של רבי יהודה הנשיא היה חתימת קובץ המשנה.`,
`שבתאי צבי, ה'משיח השקרי', בסופו של דבר התאסלם לאחר שנתפס בידי העות'מאנים.`,
`'ריש גלותא' פירושו 'ראש הגלות' - תואר למנהיג היהודים בגלות בבל.`,
`בעקבות רדיפה דתית קשה בשנים 1678-1679 נאלצו יהודי תימן להתאסלם או לעזוב את בתיהם.`,
`'גירוש ספרד' (1492) הוא הצבת אולטימטום ליהודים בידי המלך פרדיננד - להתנצר או לעזוב את ספרד.`,
`'מתיוון' הוא יהודי שאימץ את התרבות והדת היוונית בתקופה ההלניסטית.`,
`ספרו המרכזי של הרמב"ם הוא 'משנה תורה' (היד החזקה).`,
`שמו המלא של הרמב"ם הוא רבי משה בן מיימון.`,
`שמו המלא של רש"י הוא רבי שלמה יצחקי.`,
`שמו השני של יעקב הוא 'ישראל'.`,
`'תחום המושב' היה האזור שבו הוגבלו יהודי רוסיה הצארית למגורים.`,
`'ממלכת הגדעונים' הוא כינוי לקהילה היהודית העצמאית שהתקיימה באתיופיה.`,
`'עלילת דם' הוא כינוי לסיפור שקרי בעל מאפיינים אנטישמיים, המייחס ליהודים שימוש בדם לצרכי פולחן.`,
`'עלילת דמשק' (1840) - יהודים שם הואשמו ברצח נזיר נוצרי ומשרתו המוסלמי.`,
`'הימים הרעים' היא תקופת לחימה קשה שידעה יהדות אתיופיה בין צבאות אתיופיה, סודן ואיטליה.`,
`'האורית' הוא ספר התורה של יהודי אתיופיה.`,
`'משפטי פראג' (1952) - משפט בו הואשמו 14 פעילים קומוניסטים, ביניהם יהודים, בריגול לטובת ישראל וארה"ב.`,
`'סופות בנגב' הוא כינוי לגל פרעות ופוגרומים ביהודי דרום רוסיה בשלהי המאה ה-19.`,
`את בית המקדש הראשון בנה שלמה, בנו של דוד המלך.`,
`הורדוס בנה את הנמל, אמת המים של קיסריה, ואת מתחם הארמונות במצדה.`,
`יהודה המכבי (ולוחמי המצדה בהמשך) קשור לרעיון 'חירות על פני חיים'; המכבים הובילו את המרד נגד היוונים.`,
`הרב עובדיה יוסף היה מגדולי הפוסקים ואחד ממנהיגיה הרוחניים של היהדות החרדית הספרדית, מייסד ש"ס.`,
`הרב שלמה גורן שימש כרב הראשי האשכנזי לישראל, וקודם לכן כרב הצבאי הראשי.`,
`חיים נחמן ביאליק זכה לכינוי 'המשורר הלאומי' של העם היהודי.`,
`טיטוס היה קיסר רומי (בעצם מפקד, ולימים קיסר) שהחריב את בית המקדש השני ב-70 לספירה.`,
`כורש היה מלכה הראשון של הממלכה הפרסית (האימפריה האח'מנית).`,
`שאול היה מלכה הראשון של ישראל.`,
`תמרת עמנואל היה מנהיג ציבור יהודי באתיופיה ששימש כפרופסור וכרב.`,
`'אסירי ציון' היו פעילים ציוניים שנאסרו בברית המועצות בשל פעילותם למען עלייה לישראל ולימוד עברית.`,
`שאלה זו במסמך המקורי חוזרת בטעות עם תשובת השאלה הקודמת (אסירי ציון); בפועל בניו של אברהם, אבי העם היהודי, הם ישמעאל ויצחק.`,
`בניו של אברהם, אבי העם היהודי, הם ישמעאל ויצחק.`,
`השופטים היו מנהיגים אזוריים של שנים עשר השבטים בתקופה שלאחר מות יהושע בן נון.`,
`'המוסתערבים' הם יהודים שהשתלבו בתרבות ובחברה הערבית הסובבת ודיברו ערבית, עוד לפני גל ההגירה המוסלמי במאה ה-15.`,
`לאחר 'גלות החרש והמסגר' (גלות יהויכין) מונה צדקיהו למלוך על יהודה.`,
`עזרא הסופר ניסה, יחד עם קבוצת עולים, להקים מזבח ולחדש את בית המקדש.`,
`בראש מרד בר כוכבא עמד שמעון בן כוסבא (בר כוכבא).`,
`לאחר שלמה המלך התפלגה הממלכה, ובראש הממלכות שקמו עמדו רחבעם (יהודה) וירבעם (ישראל).`,
`רש"י חיבר פירוש מקיף לתורה ולתלמוד המשמש עד היום כבסיס ללימוד היהודי.`,
`שבטי ישראל מבוססים על צאצאיו של יעקב אבינו (ישראל).`,
`עיסוקו המרכזי של רבי יהודה הנשיא היה חיבור וחתימת המשנה.`,
`עם תחילת מבצע ברברוסה (פלישת גרמניה לברית המועצות, 1941) הופר הסכם ריבנטרופ-מולוטוב.`,
`ב-20 בינואר 1942 התכנסה בברלין ועידת ואנזה.`,
`בתגובה לפלישה הגרמנית לפולין (ספטמבר 1939) הכריזו בריטניה וצרפת מלחמה על גרמניה.`,
`במסגרת 'מבצע ריינהארד' הופעלו לראשונה מחנות ההשמדה בלז'ץ, סוביבור וטרבלינקה.`,
`משפטו של ישראל קסטנר נחתם באמירה כי הוא 'מכר את נשמתו לשטן'.`,
`קסטנר פעל להצלת יהודים באמצעות משא ומתן עם קציני אס-אס בכירים (בעיקר אייכמן).`,
`במחנה ההשמדה הראשון (חלמנו) בוצעה השמדת היהודים בעזרת משאיות גז.`,
`חוק 'יד ושם' אושר בכנסת בשנת 1953.`,
`קסטנר הואשם במשפטו בכך שסייע להכשיר את הקרקע לרצח יהודי הונגריה, בכך שהרגיע אותם לפני השילוח.`,
`בתקופת מגפת 'המוות השחור' הואשמו היהודים בהאשמת שווא של הרעלת בארות המים.`,
`אדולף אייכמן לא הואשם בפשעי מלחמה 'לא קונבנציונליים' (אלא בפשעים נגד העם היהודי והאנושות).`,
`בוועידת ואנזה (1942) עסקו ודנו בייעול תוכנית הנאצים ל'פתרון הסופי' - השמדת יהודי אירופה.`,
`בשנת 1938 אולצו היהודים בגרמניה להוסיף לתעודת הזהות שם ביניים: 'ישראל' לגברים ו'שרה' לנשים.`,
`אדולף אייכמן הסתתר לאחר המלחמה בארגנטינה, שם נתפס בידי המוסד ב-1960.`,
`המרד הגדול ביותר בגטאות התרחש בגטו וורשה (אפריל 1943).`,
`'שארית הפליטה' הוא הכינוי לרבבות היהודים שניצלו מהשואה והפכו לעקורים חסרי בית לאחר המלחמה.`,
`ועידת אוויאן (1938) דנה במתן פתרון לבעיית הפליטים היהודים מגרמניה ואוסטריה, אך לא הביאה לפתרון של ממש.`,
`מלחמת העולם השנייה החלה עם פלישת גרמניה לפולין ב-1 בספטמבר 1939.`,
`פרשת קסטנר הסתיימה בכך שקסטנר זוכה בערעור, אך נרצח קודם לכן בידי מתנקש יהודי (1957).`,
`מיד לאחר המלחמה רוכזו הפליטים היהודים בידי בעלות הברית במחנות עקורים (DP camps).`,
`התקופה שלאחר מלחמת העולם הראשונה בגרמניה מכונה בהיסטוריה 'רפובליקת ויימאר'.`,
`מלחמת העולם השנייה הסתיימה סופית בכל החזיתות עם הפלת שתי פצצות האטום על הירושימה ונגסאקי (אוגוסט 1945).`,
`במשפטו טען אייכמן להגנתו שהיה 'בורג קטן' במערכת הנאצית שרק מילא פקודות ('בנאליות הרוע').`,
`ב-1923 ניסתה המפלגה הנאצית לעלות לשלטון באמצעות הפיכה שכשלה, המכונה 'פוטש בירת המבצרה' במינכן.`,
`התשלום החודשי הקבוע מגרמניה לניצולי שואה בישראל מכונה 'רנטות'.`,
`מחנה ההשמדה הראשון שהוקם נקרא חלמנו.`,
`היחידות שהיו אמונות על 'טיהור הגזע' בעורף הקרבות בברית המועצות נקראו 'איינזצגרופן'.`,
`משפטו של אדולף אייכמן בירושלים (1961) חולל שינוי משמעותי ביחס שקיבלו ניצולי השואה בישראל.`,
`משפטי נירנברג שימשו כבסיס משפטי לעיקרון מניעת רצח עם.`,
`מהומות ליל הבדולח (נובמבר 1938) פרצו בעקבות רצח פקיד בשגרירות גרמניה בפריז בידי יהודי צעיר.`,
`מטרת הסכם ריבנטרופ-מולוטוב (1939) הייתה הבטחת אי-תקיפה הדדית בין גרמניה הנאצית לברית המועצות, וחלוקת פולין ביניהן.`,
`השם 'גטו' מקורו ברובע נפרד בעיר שבו הוגבלו היהודים למגורים כבר בימי הביניים (ונציה).`,
`לאחר מלחמת העולם הראשונה נוצרו בקרב העם הגרמני תחושת השפלה ומשבר כלכלי-חברתי חמור, ששימשו קרקע לעליית הנאציזם.`,
`'הסכם השילומים' (1952) נחתם בין ממשלת מערב גרמניה לישראל, ובו התחייבה גרמניה לתשלום של כ-3 מיליארד מארק.`,
`'ליל הסכינים הארוכות' (1934) הוא חיסול חברי המפלגה הנאצית (בעיקר ה-SA) שנחשדו כמתנגדים להיטלר.`,
`'מישלינגה' הוא כינוי נאצי לצאצא של נישואי תערובת בין יהודים לגרמנים.`,
`'האומשלגפלאץ' הייתה כיכר השילוחים בגטו וורשה, שממנה נשלחו יהודים למחנות ההשמדה.`,
`'דר שטירמר' היה שבועון אנטישמי גרמני שהיווה חלק מרכזי בתעמולה הנאצית.`,
`'החוק בדבר החזרת הפקידות המקצועית על כנה' (1933) שימש לסילוק יהודים ומתנגדים פוליטיים מתפקידי ציבור בגרמניה.`,
`'גרמניה האחרת' הוא מושג שטבע דוד בן-גוריון, ולפיו גרמניה של אחרי המלחמה אינה גרמניה הנאצית.`,
`חוק אזרחות הרייך (מחוקי נירנברג, 1935) קבע שרק בעלי 'דם גרמני' ייחשבו אזרחי המדינה.`,
`'יודנראט' היה הגוף שהוקם מטעם השלטון הנאצי בקהילות היהודיות ותפקידו לתווך בין הציבור היהודי לרשויות הגרמניות.`,
`מבצע ברברוסה (1941) היה שמה הצבאי של פלישת גרמניה הנאצית לברית המועצות.`,
`'אריזציה' היא ההשתלטות האלימה על בתי עסק ונכסים יהודים בגרמניה הנאצית.`,
`'אקציה' הוא כינוי לפעולת שילוח היהודים מהגטאות אל מחנות ההשמדה.`,
`'סלקציה' היא תהליך המיון שבו הופרדו מגיעי הרכבות למחנות בין המיועדים לעבודת פרך לבין המיועדים להשמדה מיידית.`,
`מתנגדי הסכם השילומים, ובראשם מנחם בגין, טענו כי ההסכם מהווה מעין מחילה רשמית לגרמנים על פשעי השואה.`,
`פרשת אוניית ה'סנט לואיס' (1939) - אוניית פליטים יהודים שרוב מדינות העולם סירבו לקבלה.`,
`אוניית 'סנט לואיס' יצאה מגרמניה ב-1939 לכיוון קובה, אך גם קובה וגם ארה"ב סירבו לקבל את נוסעיה.`,
`משפטי נירנברג (1945-1946) היו העמדתם לדין והענשתם של פושעי מלחמה נאצים בכירים.`,
`מיפ חיס הייתה תושבת אמסטרדם שעבדה עם אוטו פרנק וסייעה למשפחת פרנק, ובהם אנה פרנק, להסתתר.`,
`אדולף אייכמן היה מבכירי המנגנון הנאצי, אחראי מרכזי לארגון וביצוע 'הפתרון הסופי' - השמדת יהודי אירופה.`,
`אהרון לידסקינד היה לוחם מחתרת ופרטיזן יהודי, ממקימי המחתרת היהודית בקרקוב.`,
`אוסקר שינדלר היה תעשיין גרמני שניצל את מעמדו החברתי כדי להציל אלפי יהודים בהעסקתם במפעלו.`,
`האנס פרנק היה המושל הנאצי הכללי של פולין הכבושה (ראש ה'גנרל גוברנמן').`,
`יואכים פון ריבנטרופ שימש כשר החוץ של גרמניה הנאצית.`,
`ישראל (רז'ו) קסטנר היה עורך דין ועיתונאי יהודי-הונגרי שפעל להצלת יהודי הונגריה בתקופת השואה.`,
`פרדריך ברברוסה היה אחד ממלכי גרמניה בימי הביניים שנערץ בידי היטלר, ועל שמו נקרא מבצע הפלישה לברית המועצות.`,
`בראש 'הוועד לעזרה והצלה' בהונגריה עמד דב יוסף.`,
`ריינהארד היידריך שימש כראש משטרת הביטחון הגרמנית בשטחי פולין הכבושה, ומראשי מתכנני 'הפתרון הסופי'.`,
`'הפרטיזנים' היו כוחות מורדים שפעלו ביערות ובשטח הכבוש כדי לפגוע בעורף הגרמני.`,
`'חסידי אומות העולם' הם גויים שנטלו חלק בהצלת יהודים תוך סיכון עצמי, ללא תמורה.`,
`את המונח 'אנטישמיות' טבע וילהלם מאר בשנת 1897 (בפועל טבע אותו כבר ב-1879, בהקשר הגרמני).`,
`בנימין הלוי היה שופט שניהל, בין היתר, את משפט קסטנר ואת משפט אייכמן, והשתתף בדיון בפרשת כפר קאסם.`,
`פרימו לוי היה סופר וכימאי יהודי-איטלקי שנכלא באושוויץ וכתב על חוויותיו שם.`,
`צ'יונה סוגיהרה היה קונסול יפני בליטא שניצל את מעמדו והנפיק ויזות שהצילו רבבות יהודים מקובנה.`,
`ראול ולנברג היה איש עסקים ודיפלומט שוודי שהציל רבבות מיהודי הונגריה בתקופת השואה.`,
`'הגנרל גוברנמן' היה שטחי פולין הכבושה שלא סופחו רשמית לגרמניה הנאצית אלא נותרו תחת שלטון צבאי-אזרחי נפרד.`,
`רדיפת יהודי פולין החלה עם הפלישה הגרמנית לפולין בספטמבר 1939.`,
`יהודים נשלחו לראשונה למחנות ריכוז לאחר ליל הבדולח (נובמבר 1938).`,
`גרמניה נכנעה בפני בעלות הברית בשנת 1945.`,
`בעיית פליטי השואה נפתרה סופית עם הקמת מדינת ישראל ב-1948, שאפשרה עלייה המונית.`,
`מלחמת העולם השנייה פרצה ב-1 בספטמבר 1939 עם הפלישה הגרמנית לפולין.`,
`על 'הוועד הלאומי' הוטלה המשימה להנציח את קורבנות השואה.`,
`המחתרות בגטאות התבססו במידה רבה על תשתית תנועות הנוער היהודיות.`,
`'השבת השחורה' (יוני 1946) הייתה פעולת חיפוש ומעצרים רחבת היקף שביצעו הבריטים ביישוב היהודי בארץ ישראל.`,
`ההסתדרות הכללית של העובדים בארץ ישראל הוקמה בשנת 1920.`,
`גל העלייה השנייה נמשך עד לפרוץ מלחמת העולם הראשונה (1914).`,
`הקיבוץ הוא דוגמה לחברה שוויונית המבוססת על עקרונות סוציאליסטיים של שיתוף ושוויון.`,
`פתח תקווה הוקמה במקביל להקמת ראש פינה (1878).`,
`יפו שימשה בתקופת העלייה הראשונה והשנייה כמוקד מרכזי להפצה ולחידוש העברית כשפה מודרנית.`,
`העלייה השלישית (1919-1923) התרחשה בתקופת המנדט הבריטי.`,
`הקבוצה החקלאית 'דגניה' (הקבוצה הראשונה) הוקמה בשנת 1909.`,
`תנועת 'ביל"ו' התנגדה לשיטת הפקידות של פקידי הברון רוטשילד במושבות.`,
`אליעזר בן יהודה הקים אגודות ללימוד השפה העברית, כחלק ממאמציו להחייאתה כשפה מדוברת.`,
`בירושלים פעלה קבוצת מחנכים ואינטלקטואלים לתחיית השפה העברית.`,
`בספר הלבן השלישי (1939) נקבע כי בארץ ישראל תקום מדינה דו-לאומית (ערבית-יהודית) בתוך עשר שנים.`,
`'היישוב הישן' התרכז בעיקר בארבע ערי הקודש: ירושלים, חברון, טבריה וצפת.`,
`הקבוצה 'דגניה' הוקמה בשנת 1909.`,
`בשנת 1917 גירשו הטורקים את תושבי יפו והסביבה, בעקבות חשש מפעילות מרגלים.`,
`גל העלייה השנייה החל בשנת 1904.`,
`'תקופת המאבק' (מאבק היישוב היהודי בשלטון הבריטי) החלה בשנת 1945.`,
`תנועת 'החלוץ' נוסדה בשנת 1880 (בפועל, מקורותיה בתחילת המאה ה-20; לפי חומר הלימוד - 1880).`,
`חברת 'עזרה' דרשה כי הלימודים בטכניון יתקיימו בשפה הגרמנית, מה שעורר את 'מלחמת השפות'.`,
`'מלחמת השפות' התחוללה בין השנים 1913-1914, סביב שפת ההוראה בטכניון.`,
`העלייה הראשונה התרחשה בין השנים 1882-1903.`,
`הסכמי הקפיטולציות נחתמו בין האימפריה העות'מאנית לבין מעצמות אירופה השונות.`,
`חברי 'גדוד העבודה' עסקו בסלילת כבישים ובהקמת יישובים.`,
`אנשי 'הישוב הישן' ישבו בארבע ערי הקודש: ירושלים, צפת, טבריה וחברון.`,
`הברון רוטשילד סייע למושבות בהשקעת סכומי כסף גדולים ובשליחת צוותי מומחים ופקידים לניהולן הכלכלי.`,
`השכונה היהודית הראשונה שהוקמה מחוץ לחומות ירושלים נקראה 'משכנות שאננים'.`,
`בראשית המאה ה-19 מנה היישוב היהודי בארץ ישראל כ-6,000 יהודים בלבד.`,
`בעלייה הראשונה כ-5,000 מתוך העולים דגלו בעבודת אדמה והקימו מושבות חדשות.`,
`ההתיישבות בפתח תקווה, שננטשה זמנית, חודשה לאחר תחילת העלייה הראשונה.`,
`שיטת הפקידות (ניהול המושבות בידי פקידי הברון) יצרה תלות של החקלאים במימון חיצוני מתמשך.`,
`הדגשת העיקרון האידיאולוגי 'כיבוש האדמה' הובילה בהמשך להקמת קיבוצים על קרקעות לאומיות (של הקק"ל).`,
`'הישוב החדש' החל להתקיים מאז העלייה הראשונה.`,
`את העלייה החמישית (שנות ה-30) אפיינה בעיקר החרדה מפני עליית המשטרים הפשיסטיים באירופה.`,
`'ליל הגשרים' (יוני 1946) הייתה פעולה של תנועת המרי העברי שבמהלכה פוצצו 11 גשרים ברחבי הארץ נגד השלטון הבריטי.`,
`רעיון הקבוצה, שהתגלגל לימים לרעיון הקיבוץ, התבסס על התיישבות משותפת ועיבוד משותף של חלקות האדמה.`,
`הקיבוץ הראשון היה דגניה, שהוקם בשנת 1909.`,
`פתח תקווה זכתה לכינוי 'אם המושבות', כמושבה הראשונה שהוקמה בעלייה הראשונה.`,
`ועדת אונסקו"פ (UNSCOP) של האו"ם המליצה על תכנית החלוקה של ארץ ישראל לשתי מדינות (1947).`,
`השכונה היהודית הראשונה שהוקמה מחוץ לחומות ירושלים נקראה 'משכנות שאננים'.`,
`מטרת 'ועדת פיל' (1936-1937) הייתה להציע פתרון לסכסוך הערבי-יהודי המתהווה בארץ ישראל, והיא המליצה על חלוקה.`,
`מאורעות תרפ"ט (1929) הובילו, בין היתר, למינוי ועדות חקירה בריטיות (כגון ועדת שאו) שבחנו את הסכסוך הערבי-יהודי.`,
`על ריבוי האוכלוסייה היהודית בארץ בתקופה הקדם-ציונית השפיעו בעיקר עליות קדם-ציוניות.`,
`משה מונטיפיורי יזם ב-1860 את הקמת השכונה היהודית הראשונה מחוץ לחומות ירושלים (משכנות שאננים).`,
`'הצהרת בלפור' (1917) מהווה הישג דיפלומטי חשוב בדרך להקמת בית לאומי יהודי בארץ ישראל.`,
`בספר הלבן השלישי (1939) נקבע כי בפלסטינה-ארץ ישראל תקום מדינה דו-לאומית תוך עשר שנים.`,
`היהודים הספרדים בתקופת 'הישוב הישן' קיימו מערכת קשרים כלכליים עם אוכלוסיית הרוב המוסלמית, ורבים מהם עבדו לפרנסתם.`,
`'ריב הלשונות' היה ויכוח שפרץ בין תומכי הגרמנית לתומכי העברית כשפת הלימוד בטכניון (1913-1914).`,
`הספר הלבן הראשון היה מסמך רשמי של ממשלת בריטניה שהציג את מדיניותה כלפי היישוב היהודי בארץ ישראל.`,
`'הספר הלבן' הוא כינוי כללי לשינויים במדיניות הבריטית בארץ ישראל, שהוגדרו רשמית בסדרת מסמכים.`,
`השכונה 'אחוזת בית' הפכה לימים לעיר העברית הראשונה - תל אביב.`,
`'ההסתדרות הכללית של העובדים העבריים בארץ ישראל' הייתה ארגון עובדים שאיגד את כל העובדים היהודים בארץ.`,
`'גיא אוני' הוא שמה הקודם/המקורי של ראש פינה.`,
`'הצהרת בלפור' היא הכרתה הרשמית של ממשלת בריטניה בתביעות התנועה הציונית להקמת בית לאומי יהודי בארץ ישראל.`,
`שיטת 'הפקידות' של הברון רוטשילד הפכה את החקלאים העולים ל'מנהלי עבודה' התלויים במימון ובניהול חיצוני.`,
`רוב עולי העלייה הראשונה הגיעו מרוסיה, מרומניה ומפולין.`,
`רוב עולי העלייה החמישית (שנות ה-30) הגיעו מגרמניה, בעקבות עליית הנאצים לשלטון.`,
`'הסכמי קפיטולציות' היו הסכמים שהעניקו זכויות יתר לנתיני מעצמות זרות בשטח האימפריה העות'מאנית.`,
`תוכניות ההצלה נועדו להציל יהודים בזמן מלחמת העולם השנייה, בדרכים כגון מו"מ, הברחה ומסמכי הגנה.`,
`אברהם משה (א"מ) לונץ נחשב לאחד החוקרים הראשונים של ארץ ישראל בעת החדשה.`,
`משה מונטיפיורי היה יהודי עשיר מבריטניה שסייע כלכלית לתושבים היהודים בירושלים ולהתיישבותם מחוץ לחומות העיר.`,
`מדינות ההסכמה במלחמת העולם הראשונה כללו את איטליה, בריטניה, יפן, ארה"ב, רוסיה וצרפת.`,
`את ועדת אונסקו"פ הקים ארגון האומות המאוחדות (האו"ם).`,
`מכספי החלוקה נתמכו בעיקר האשכנזים ב'יישוב הישן'.`,
`העלייה הרביעית (שנות ה-20) הורכבה בעיקרה ממשפחות בנות המעמד הבינוני שעזבו את פולין.`,
`'גירוש תל אביב-יפו' התרחש במרץ 1917, כשהטורקים גירשו את תושבי האזור בחשש מפעילות מרגלים לטובת הבריטים.`,
`הספר הלבן פורסם בידי שר המושבות הבריטי (הממונה על ענייני ארץ ישראל מטעם הממשלה הבריטית).`,
`את הספר הלבן הראשון (1922) פרסם וינסטון צ'רצ'יל, ששימש אז שר המושבות הבריטי.`,
`בעלי תודעה לאומית-סוציאליסטית מהעלייה השנייה נאבקו על 'כיבוש העבודה' - העסקת פועלים יהודים במקום פועלים ערבים.`,
`בסיס מטה מפקדת זרוע היבשה בקריית מלאכי נקרא על שמו של הרמטכ"ל חיים בר-לב.`,
`הנשיא עזר ויצמן הקים בהמשך דרכו הפוליטית את מפלגת 'יחד'.`,
`הנשיא שמעון פרס מונה בעברו למנכ"ל משרד הביטחון.`,
`יצחק בן-צבי, נשיא המדינה השני, נולד ב-1884 בפולטובה שברוסיה ונקבר בהר המנוחות בירושלים.`,
`חיים ויצמן, נשיא המדינה הראשון, פעל רבות מול הבריטים להשגת הצהרת בלפור.`,
`הלחימה בעזה במבצע 'צוק איתן' (2014) הייתה באחריות פיקוד דרום.`,
`חיים לסקוב, לימים רמטכ"ל, התמנה לנציב קבילות החיילים הראשון בצה"ל.`,
`יצחק שמיר שימש שר חוץ בממשלת האחדות שבה שמעון פרס (שניצח בבחירות) כיהן כראש ממשלה, במסגרת רוטציה.`,
`העלייה ההמונית לאחר קום המדינה העצימה בעיקר בעיות כלכליות (קליטה, תעסוקה, דיור).`,
`גל המחאה החברתית שפקד את ישראל בין 1970-1971 נקרא 'הפנתרים השחורים'.`,
`מנחם בגין, שנעצר ב-1940 בברית המועצות, שוחרר בעת מבצע ברברוסה (1941), כשברית המועצות הפכה לבת ברית של הבריטים.`,
`בנימין נתניהו התגייס ב-1967 לסיירת מטכ"ל.`,
`משה שרת התגורר בכפר הערבי עין סיניה בנעוריו.`,
`ישראל הכירה רשמית באש"ף בשנת 1993, במסגרת הסכמי אוסלו.`,
`דוד אלעזר הצטרף לפלמ"ח בשנת 1946.`,
`העלאת יהודי תימן (מבצע 'על כנפי נשרים') התקיימה בשנים 1948-1950.`,
`הטבח בכפר קאסם התרחש ב-29 באוקטובר 1956.`,
`שלושת הנערים גיל-עד, נפתלי ואייל נחטפו ב-12 ביוני 2014.`,
`משה שרת נפטר בשנת 1965.`,
`יצחק רבין ז"ל נרצח ב-4 בנובמבר 1995.`,
`זלמן שזר, לימים נשיא המדינה, כיהן כשר החינוך בממשלת ישראל הראשונה.`,
`אירועי 'ואדי סאליב' פרצו בחיפה בשנת 1959.`,
`גדי אייזנקוט החל לכהן כרמטכ"ל בפברואר 2015.`,
`ועידת מדריד כונסה בשנת 1991.`,
`הסכם השלום עם מצרים נחתם בשנת 1979.`,
`משטר הצנע התקיים בשנים 1949-1952, ומשמעותו הייתה קיצוב ופיקוח על קניית מוצרי יסוד ועל מחיריהם.`,
`ברית המועצות ניהלה מדיניות של אפליה קשה כלפי יהודי המדינה בעיקר בשנות ה-50 וה-60.`,
`יצחק רבין כיהן כרמטכ"ל בשנים 1964-1968.`,
`כהונתו של אהוד אולמרט כראש ממשלה אופיינה בהחרפת הסכסוך ברצועת עזה (כולל מבצע 'עופרת יצוקה').`,
`במהלך 'מבצע יכין' (העלאת יהודי מרוקו) עלו לארץ כ-80 אלף עולים.`,
`תפקודו של אריאל שרון היה שנוי במחלוקת בעיקר במהלך מלחמת שלום הגליל (לבנון הראשונה, 1982).`,
`גולדה מאיר פעלה במסגרת מפלגת 'פועלי ציון'.`,
`אירועי 'גאות ושפל' (האינתיפאדה השנייה) פרצו בעקבות כישלון ועידת קמפ דייוויד (2000).`,
`דוד בן-גוריון עמד בראש מפלגת 'פועלי ארץ ישראל' (מפא"י).`,
`יצחק שמיר למד בגימנסיה העברית בירושלים.`,
`עולי 'מבצע יכין' שוכנו באופן זמני במחנות העקורים.`,
`מבצעי עליית יהודי אתיופיה כונו 'מבצע משה' ו'מבצע שלמה'.`,
`יהודים מזרע ביתא ישראל באתיופיה, שאבותיהם התאסלמו או התנצרו, מכונים 'פלאשמורה'.`,
`מרדכי מקלף שירת כרמטכ"ל כשנה בלבד.`,
`כ-500,000 יהודים עלו מברית המועצות (בעיקר לאחר נפילתה).`,
`הלחימה בעזה במהלך מבצע 'צוק איתן' (2014) נמשכה כ-50 ימים.`,
`לאחר רצח חיים ארלוזורוב (1933) החל משה שרת לעבוד במחלקה המדינית של הסוכנות היהודית.`,
`לאחר שהתפטר מראשות הממשלה, קבע דוד בן-גוריון את ביתו בקיבוץ שדה בוקר.`,
`לאחר שלוי אשכול ויתר על תפקיד שר הביטחון (ערב מלחמת ששת הימים), ניתן התפקיד למשה דיין.`,
`בשנת 2006 מונה גדי אייזנקוט לאלוף פיקוד צפון.`,
`בממשלת בגין הראשונה מונה אריאל שרון לשר החקלאות.`,
`צבי צור התמנה במלחמת העצמאות לתפקידים בחטיבת גבעתי, ובהם פיקוד על גדוד 54.`,
`אסירי ציון נלחמו כדי לאפשר עלייה חופשית של יהודי ברית המועצות לישראל.`,
`יצחק רבין התפטר מראשות הממשלה בדצמבר 1975 בעקבות משבר פוליטי.`,
`חוק השבות תוקן ב-1970 בעקבות עתירת רב-סרן בנימין שליט לבג"ץ בנוגע לרישום ילדיו כיהודים.`,
`מ-1992 הוחלט כי כל מי שאמו יהודייה יוכל לעלות לישראל (עדכון להגדרת 'יהודי' לעניין חוק השבות).`,
`יצחק שמיר, בתפקיד ראש ממשלה במלחמת המפרץ (1991), החליט להיענות לבקשת ארה"ב ולהימנע מתגובה צבאית לעיראק.`,
`אוסוולד רופאייזן, יהודי-פולני שהתנצר והציל יהודים בתקופת השואה, כונה 'האח דניאל'.`,
`'המעברות' היו שיכונים זמניים של צריפים, פחונים ואוהלים שהוקמו בשולי הערים לקליטת העולים בשנות ה-50.`,
`העיקרון הגדול שהכריז עליו בן-גוריון בהקמת המדינה היה עיקרון ה'ממלכתיות'.`,
`מנחם בגין ייסד עם הקמת המדינה את תנועת החירות.`,
`יגאל ידין למד ארכיאולוגיה, ולימים היה מארכיאולוגי ישראל המובילים.`,
`משטר הצנע לא הצליח למנוע היווצרות של פערים חברתיים-כלכליים לאורך זמן.`,
`משמעות משטר הצנע הייתה קיצוב ופיקוח על קניית מוצרי יסוד ועל מחיריהם.`,
`כשרת עבודה עיצבה גולדה מאיר את זכויות העובד הבסיסיות ואת שוק העבודה הישראלי.`,
`יגאל ידין קבע את הכללים היסודיים שעל פיהם מתנהל צה"ל בתחומי הגיוס והמבנה הארגוני.`,
`חוק 'נכסי נפקדים' קובע כי אדמותיו של אדם שעזב לשטחי מדינות אויב יופקעו ממנו.`,
`המחאה שחידדה את הפערים החברתיים-כלכליים במדינה כונתה 'הפנתרים השחורים'.`,
`'מבצע שלמה' היה מבצע הטסה גלוי שבמהלכו עלו לישראל כ-14,000 יהודים מאתיופיה.`,
`אחד הפתרונות המרכזיים שמצא לוי אשכול לקליטת גלי העלייה היה הקמת מעברות.`,
`'מבצע מרבד הקסמים' היה מבצע העלאת יהודי תימן לישראל.`,
`'מבצע יכין' היה מבצע העלאת יהודי מרוקו לישראל.`,
`'מבצע ענבי זעם' (1996) היה מבצע צבאי של צה"ל בדרום לבנון.`,
`עקרון הממלכתיות של בן-גוריון עסק בפירוק מוסדות מפלגתיים טרום-מדינתיים ובבניית מוסדות מדינה חזקים במקומם.`,
`המק"י (המפלגה הקומוניסטית הישראלית) היא תנועה פוליטית ישראלית שדוגלת בקומוניזם.`,
`מטרת 'ועדת מדריד' (1991) הייתה קידום שלום במזרח התיכון בין ישראל לשכנותיה - ירדן, סוריה, לבנון והפלסטינים.`,
`'תכנית ההתנתקות' (2005) הייתה נסיגה חד-צדדית של ישראל מרצועת עזה ומצפון השומרון.`,
`בעת מלחמת יום הכיפורים (1973) כיהן אפרים קציר כנשיא המדינה.`,
`רינת שפירא הייתה מורה 'צברית' שלימדה במספר מעברות עולים בשנות ה-50.`,
`צבי צור הקים את 'פלוגת הג'יפים' (שועלי שמשון).`,
`משה קצב, לימים נשיא המדינה, כיהן כראש הרשות המקומית קריית מלאכי.`,
`על הסכמי אוסלו חתמו יאסר ערפאת ויצחק רבין (בנוכחות ביל קלינטון, 1993).`,
`יעקב דורי מונה למפקד ההגנה בעקבות מאורעות תרפ"ט (1929).`,
`בנימין נתניהו חתם על הסכם וואי (Wye River, 1998) עם הפלסטינים.`,
`משה (בוגי) יעלון פיקד על סיירת צנחנים במהלך מבצע ליטני (1978).`,
`אמנון ליפקין-שחק זכה בעיטור העוז בפעם השנייה על תפקודו במבצע 'אביב נעורים' (1973).`,
`בסיס הטיסה וההכשרות המיוחדות (מרהו"ם) בתל נוף נקרא על שם הרמטכ"ל משה לוי.`,
`'ווקף' הוא המונח המוסלמי להקדש דתי - נכס שהוקדש לצרכים דתיים או ציבוריים.`,
`'אלטלנה' הייתה ספינת נשק של האצ"ל, שהוטבעה בפקודת בן-גוריון ביוני 1948.`,
`בסוף מלחמת העצמאות נחתמו הסכמי שביתת נשק, המכונים גם 'הסכמי רודוס'.`,
`ארגון 'ההגנה' התפתח בצורה משמעותית בעקבות מאורעות תרפ"ט (1929).`,
`ארגון 'ההגנה' קם בעקבות פיזור ארגון 'השומר' (1920).`,
`מבצע נחשון (אפריל 1948) נחשב למבצע הראשון שבוצע לפי עקרונות 'תוכנית ד'.`,
`בעקבות מלחמת שלום הגליל (לבנון הראשונה) ואירועי סברה ושתילה הוקמה ועדת כהן.`,
`את תוצאות מלחמת יום הכיפורים חקרה ועדת אגרנט.`,
`בעקבות מלחמת לבנון השנייה (2006) מונתה ועדת וינוגרד.`,
`ועדת חרטום התכנסה ב-1 בספטמבר 1967, בעקבות מלחמת ששת הימים ('שלושת הלאווים').`,
`העיר יפו נכבשה במסגרת 'מבצע חמץ' במלחמת העצמאות.`,
`ב-29 במרץ 2002 יצא צה"ל למבצע 'חומת מגן', בעקבות גל פיגועי טרור קשה.`,
`ישראל החלה בהקמת גדר ההפרדה בשנת 2003.`,
`הפלמ"ח הוקם בשנת 1941.`,
`יחידה 101 הוקמה בשנת 1953.`,
`פלוגות הלילה המיוחדות הוקמו בשנת 1938.`,
`מלון המלך דוד פוצץ בידי האצ"ל בשנת 1946.`,
`בתום מלחמת העולם הראשונה חולק המזרח התיכון בין הצבא הבריטי לצבא הצרפתי (הסכם סייקס-פיקו).`,
`בעקבות טבח שאירע במאורעות תרפ"ט (1929) חדל להתקיים היישוב היהודי בחברון.`,
`התקיפות של הכנופיות הערביות במאורעות תרפ"א (1921) החלו ביפו, בתל אביב ובכמה מושבות נוספות.`,
`מוקד גל האלימות שפרץ במאי 1921 (מאורעות תרפ"א) היה ביפו, בתל אביב ובכמה מושבות נוספות.`,
`מוקד גל האלימות שפרץ במאי 1921 (מאורעות תרפ"א) היה בעיקר בעיר יפו.`,
`הפלמ"ח הוקם ב-1941 עקב איום הפלישה הגרמנית (של צבא גרמניה הנאצית) לארץ ישראל.`,
`הטורקים גילו על ארגון ניל"י בעקבות תפיסת יונת דואר ששלחו אנשי הארגון אל הבריטים.`,
`האינתיפאדה השנייה כונתה בצה"ל 'אירועי גאות ושפל'.`,
`ארגון השמירה הראשון נקרא 'בר-גיורא' (שקדם ל'השומר').`,
`המרד שפרץ באפריל 1936 של הערבים נגד שלטון המנדט הבריטי נקרא 'המרד הערבי הגדול'.`,
`מצודות המשטרה שנבנו ברחבי הארץ בתקופת המנדט נקראו 'מצודות טיגרט'.`,
`את מלחמת העצמאות ניתן לחלק לשני חלקים עיקריים: שלב המלחמה הבין-קהילתית ושלב הפלישה הפאן-ערבית.`,
`חברי ארגון ניל"י סייעו לבריטים במידע מודיעיני נגד הטורקים.`,
`ארגון ניל"י הוקם כדי לסייע לבריטים לכבוש את הארץ מידי הטורקים.`,
`יוסף טרומפלדור הצטרף לאנשי תל-חי כדי לארגן את השמירה במקום.`,
`ב'ועדת פיל' (1937) הוחלט להמליץ על חלוקת הארץ לשתי מדינות - יהודית וערבית.`,
`בדצמבר 2008 החליטה ממשלת ישראל לצאת למבצע 'עופרת יצוקה' ברצועת עזה.`,
`'הסכמי רודוס' היו הסכמי שביתת הנשק שנחתמו בין ישראל לשכנותיה בתום מלחמת העצמאות (1949).`,
`'החטיבה היהודית הלוחמת' (חי"ל), הידועה גם כ'בריגדה היהודית', לחמה בצבא הבריטי בחזית האיטלקית ונתפסה כמייצגת רשמית את העם היהודי.`,
`המטרה המרכזית במבצע נחשון (1948) הייתה לפרוץ את הדרך לירושלים הנצורה.`,
`'פעולת כראמה' (1968) - כוחות צה"ל השתלטו על עיר ירדנית שבה פעלה מפקדת הפת"ח, במסגרת מלחמת ההתשה.`,
`לאחר הסכמי שביתת הנשק בתום מלחמת העצמאות נקבעו גבולות זמניים (קווי שביתת נשק, לא גבולות בינלאומיים מוכרים) בין ישראל לשכנותיה.`,
`'גדוד נהגי הפרדות' היה גדוד תובלה יהודי שנועד לסייע לצבא הבריטי במלחמת העולם הראשונה.`,
`ארגון 'בר-גיורא' היה ארגון השמירה היהודי הראשון בארץ ישראל.`,
`'כביש הצפון' הוא כביש ביטחון שנסלל לאורך הגבול בין ישראל ללבנון.`,
`'מבצע ענבי זעם' (1996) היה מבצע צבאי של צה"ל בדרום לבנון.`,
`שמה הנוסף של 'החטיבה היהודית הלוחמת' הוא 'הבריגדה היהודית'.`,
`שמה השני של מלחמת סיני (1956) הוא 'מבצע קדש'.`,
`שמו השני של 'מבצע יונתן' (מבצע אנטבה, 1976) הוא 'מבצע כדור רעם'.`,
`'מצודות טיגרט' הן מצודות משטרה שנבנו בתקופת המנדט כדי להגביר את השליטה והביטחון בארץ.`,
`ארגון האצ"ל הוקם מחיבור בין ארגון 'ההגנה' לבין ארגון ב' (פרישה מ'ההגנה').`,
`את 'מבצע יונתן' (חילוץ בני הערובה באנטבה) ביצעה סיירת מטכ"ל.`,
`את רעיון 'הגדודים העבריים' הגה זאב ז'בוטינסקי.`,
`הרמטכ"ל בעת מלחמת ששת הימים (1967) היה יצחק רבין.`,
`חאג' אמין אל-חוסייני היה מנהיג דתי ופוליטי בכיר של ערביי ארץ ישראל (המופתי של ירושלים).`,
`בזמן מלחמת ההתשה כיהן משה דיין כשר הביטחון.`,
`'הנוטרים' היו שוטרים יהודים שגויסו רשמית על ידי הבריטים לשמירה על היישובים.`,
`'הצנחנים הארץ-ישראלים' היו צנחנים יהודים שהוכשרו על ידי הבריטים במלחמת העולם השנייה לצניחה מעבר לקווי האויב.`,
`את פלוגות הלילה המיוחדות הקים הקצין הבריטי צ'ארלס וינגייט.`,
`בזמן מלחמת לבנון השנייה (2006) כיהן דן חלוץ כרמטכ"ל.`,
`בזמן מלחמת לבנון השנייה כיהן אהוד אולמרט כראש הממשלה.`,
`במהלך מלחמת שלום הגליל (1982) כיהן רפאל איתן כרמטכ"ל.`,
`במהלך מלחמת יום הכיפורים (1973) כיהנה גולדה מאיר כראש הממשלה.`,
`מתפקידה של 'ועדת פיל' היה לבדוק את הסיבות לפרוץ מאורעות תרצ"ו-תרצ"ט (המרד הערבי הגדול) ולהציע פתרון לסכסוך היהודי-ערבי.`,
`ארגון 'השומר' הוקם בשנת 1909.`,
`צה"ל הוקם ב-26 במאי 1948.`,
`'המפקדה הארצית' של ארגון ההגנה הוקמה בשנת 1930.`,
`האצ"ל החל לפעול נגד מטרות בריטיות לאחר פרסום הספר הלבן השלישי (1939).`,
`ההסכם עם ירדן לאחר מלחמת העצמאות נחתם ב-3 באפריל 1949.`,
`המלחמה נגד היישוב היהודי לביטול תוכנית החלוקה נפתחה בשנת 1947, מיד לאחר אישור תוכנית החלוקה באו"ם.`,
`הפלמ"ח פורק לחלוטין ב-5 בנובמבר 1948.`,
`במלחמת סיני (אוקטובר 1956) פתחה ישראל בחזית נגד מצרים.`,
`את 'הגדודים העבריים' הקימו יוסף טרומפלדור וזאב ז'בוטינסקי.`,
`נוסח ה'יזכור' הנהוג בישראל מבוסס על הספד שחיבר ברל כצנלסון לזכר הרוגי מאורעות תל חי.`,
`בסיום מלחמת סיני (1956) השתלט צה"ל על חצי האי סיני ועל רצועת עזה (משטחים אלה נסוג בהמשך).`,
`את הצנחנים הארץ-ישראלים הפעילה הסוכנות היהודית (בשיתוף הצבא הבריטי).`,
`לפי הסכמי סייקס-פיקו, אזור אצבע הגליל היה אמור להיות תחת שליטה צרפתית.`
];

QUESTIONS.forEach((q,i)=>{ q[3] = EXPLANATIONS[i] || ''; });

const CHAPTERS = [
  {name:'שער 1 – ישראל: תעודת זהות (אזרחות ומשטר)', from:1, to:33},
  {name:'שער 2 – תרבות ואמונה בישראל (יהדות ודתות)', from:34, to:128},
  {name:'שער 3 – תולדות עם ישראל (מהתנ"ך ועד העת החדשה)', from:129, to:198},
  {name:'שער 4 – בימי שואה', from:199, to:267},
  {name:'שער 5 – בדרך למדינה (התיישבות ותנועה ציונית)', from:268, to:344},
  {name:'שער 6 – סיפורה של מדינה', from:345, to:472},
  {name:'שער 7 – ביטחון ישראל', from:473, to:529},
];

let selectedQuestions = [];
let currentIndex = 0;
let score = 0;
let userSelections = [];
let answered = false;

const totalCountEl = document.getElementById('totalCount');

const setupScreen = document.getElementById('setupScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const numQInput = document.getElementById('numQ');
const chaptersListEl = document.getElementById('chaptersList');

CHAPTERS.forEach((ch, i) => {
  const item = document.createElement('div');
  item.className = 'chapter-item';
  const cbId = `chapter_${i}`;
  item.innerHTML = `<input type="checkbox" id="${cbId}"><label for="${cbId}">${ch.name}</label>`;
  chaptersListEl.appendChild(item);
  item.querySelector('input').addEventListener('change', updateAvailablePool);
});

document.getElementById('selectAllChapters').addEventListener('click', () => {
  chaptersListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
  updateAvailablePool();
});
document.getElementById('clearAllChapters').addEventListener('click', () => {
  chaptersListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  updateAvailablePool();
});

function resetChapterSelection(){
  chaptersListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  updateAvailablePool();
}

function getSelectedPool(){
  const checkboxes = chaptersListEl.querySelectorAll('input[type=checkbox]');
  let pool = [];
  CHAPTERS.forEach((ch, i) => {
    if(checkboxes[i].checked){
      pool = pool.concat(QUESTIONS.slice(ch.from - 1, ch.to));
    }
  });
  return pool;
}

function updateAvailablePool(){
  const poolSize = getSelectedPool().length;
  totalCountEl.textContent = poolSize;
  const minQ = Math.min(10, poolSize || 10);
  numQInput.min = minQ;
  numQInput.max = poolSize;
  if(parseInt(numQInput.value, 10) > poolSize) numQInput.value = poolSize;
  if(parseInt(numQInput.value, 10) < minQ) numQInput.value = minQ;
  document.getElementById('startBtn').disabled = poolSize === 0;
}

resetChapterSelection();

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('restartBtn').addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
  resetChapterSelection();
});
document.getElementById('revealBtn').addEventListener('click', revealAnswer);
document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('explainBtn').addEventListener('click', toggleExplanation);
document.getElementById('backToStartBtn').addEventListener('click', () => {
  quizScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
  resetChapterSelection();
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  const pool = getSelectedPool();
  if(pool.length === 0) return;
  let n = parseInt(numQInput.value, 10);
  if(!n || n < 10) n = Math.min(10, pool.length);
  if(n > pool.length) n = pool.length;
  selectedQuestions = shuffle(pool).slice(0, n);
  currentIndex = 0;
  score = 0;
  userSelections = new Array(n).fill(null);
  setupScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  showQuestion();
}

function showQuestion(){
  answered = false;
  const [qText, opts, correctIdx] = selectedQuestions[currentIndex];
  document.getElementById('qNum').textContent = `שאלה ${currentIndex+1} מתוך ${selectedQuestions.length}`;
  document.getElementById('qText').textContent = qText;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('progressText').textContent = `ניקוד נוכחי: ${score} / ${currentIndex}`;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('revealBtn').disabled = false;

  const explainBtn = document.getElementById('explainBtn');
  const explainBox = document.getElementById('explainBox');
  explainBtn.textContent = 'הצג הסבר';
  explainBox.classList.remove('open');

  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  opts.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.idx = idx;
    div.innerHTML = `<input type="radio" name="opt" id="opt${idx}"><label for="opt${idx}" style="cursor:pointer; flex:1;">${optText}</label>`;
    div.addEventListener('click', () => selectOption(idx, correctIdx));
    box.appendChild(div);
  });
}

function lockOptions(){
  const box = document.getElementById('optionsBox');
  box.querySelectorAll('.opt').forEach(o => {
    o.classList.add('disabled');
    o.style.pointerEvents = 'none';
    const input = o.querySelector('input');
    if(input) input.disabled = true;
  });
}

function selectOption(idx, correctIdx){
  if(answered) return;
  answered = true;
  userSelections[currentIndex] = idx;
  const box = document.getElementById('optionsBox');
  const opts = box.querySelectorAll('.opt');
  opts.forEach(o => {
    o.querySelector('input').checked = (parseInt(o.dataset.idx,10) === idx);
  });
  lockOptions();
  const feedback = document.getElementById('feedback');
  if(idx === correctIdx){
    score++;
    opts[idx].classList.add('correct');
    feedback.textContent = 'נכון! ✔';
    feedback.className = 'feedback correct';
  } else {
    opts[idx].classList.add('wrong');
    opts[correctIdx].classList.add('correct');
    feedback.textContent = 'לא נכון ✘';
    feedback.className = 'feedback wrong';
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('progressText').textContent = `ניקוד נוכחי: ${score} / ${currentIndex+1}`;
}

function revealAnswer(){
  if(answered) return;
  answered = true;
  const [, , correctIdx] = selectedQuestions[currentIndex];
  lockOptions();
  const box = document.getElementById('optionsBox');
  const opts = box.querySelectorAll('.opt');
  opts[correctIdx].classList.add('correct');
  const feedback = document.getElementById('feedback');
  feedback.textContent = 'התשובה הנכונה מסומנת למעלה';
  feedback.className = 'feedback';
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('progressText').textContent = `ניקוד נוכחי: ${score} / ${currentIndex+1}`;
}

function toggleExplanation(){
  const explainBox = document.getElementById('explainBox');
  const explainBtn = document.getElementById('explainBtn');
  const isOpen = explainBox.classList.toggle('open');
  if(isOpen){
    const [, , , explanation] = selectedQuestions[currentIndex];
    document.getElementById('explainText').textContent = explanation || 'אין הסבר זמין לשאלה זו.';
    explainBtn.textContent = 'הסתר הסבר';
  } else {
    explainBtn.textContent = 'הצג הסבר';
  }
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex >= selectedQuestions.length){
    showResult();
  } else {
    showQuestion();
  }
}

function showResult(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  document.getElementById('scoreText').textContent = `${score} / ${selectedQuestions.length}`;
  const pct = Math.round((score/selectedQuestions.length)*100);
  document.getElementById('pctText').textContent = `${pct}% הצלחה`;
}
</script>
</body>
</html>
