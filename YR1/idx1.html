<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יאיר - פרויקטים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2E5B8A;
            --secondary: #4A90B5;
            --accent: #E8A840;
            --light: #F5F9FC;
            --dark: #1A3A52;
            --text: #2C3E50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Assistant', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, 5%) scale(0.95); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Varela Round', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            text-shadow: 3px 5px 15px rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .links-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .accordion-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.3s;
        }

        .accordion-card:hover {
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .accordion-header {
            padding: 30px 35px;
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .accordion-header:hover {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
        }

        .accordion-header.active .link-card-arrow {
            transform: rotate(-90deg);
        }

        .link-card-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .link-card-title {
            font-family: 'Varela Round', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            flex: 1;
            margin: 0;
        }

        .link-card-arrow {
            font-size: 1.5rem;
            transition: transform 0.3s;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #f8f9fa;
        }

        .accordion-content.show {
            max-height: 500px;
        }

        .accordion-links {
            padding: 20px 35px;
        }

        .accordion-links a {
            display: block;
            padding: 15px 20px;
            margin: 10px 0;
            background: white;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s;
            border-right: 4px solid var(--accent);
        }

        .accordion-links a:hover {
            background: #e3f2fd;
            transform: translateX(-5px);
        }

        .accordion-content .links-container {
            margin-bottom: 0;
            gap: 12px;
        }

        .accordion-content .accordion-header {
            padding: 20px 25px;
            background: #e9ecef;
            color: var(--dark);
        }

        .accordion-content .accordion-header:hover {
            background: #dee2e6;
        }

        .accordion-content .link-card-icon {
            width: 48px;
            height: 48px;
            font-size: 1.5rem;
            background: rgba(46, 91, 138, 0.12);
        }

        .accordion-content .link-card-title {
            font-size: 1.4rem;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
        }

        footer a {
            color: white;
            text-decoration: underline;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .accordion-header { padding: 20px 25px; }
            .link-card-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗂️ יאיר - פרויקטים</h1>
        </header>

        <div class="links-container">

            <div class="accordion-card">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <div class="link-card-icon">🧀</div>
                    <h2 class="link-card-title">מעקב יצור גבינה</h2>
                    <span class="link-card-arrow">◀</span>
                </div>
                <div class="accordion-content">
                    <div class="accordion-links">
                        <a href="cheese/cheese_index.html">🧀 כניסה לפרויקט גבינה</a>
                    </div>
                </div>
            </div>

            <div class="accordion-card">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <div class="link-card-icon">🚵</div>
                    <h2 class="link-card-title">אופניים</h2>
                    <span class="link-card-arrow">◀</span>
                </div>
                <div class="accordion-content">
                    <div class="links-container">

                        <div class="accordion-card">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <div class="link-card-icon">🗺️</div>
                                <h2 class="link-card-title">חיפוש מסלול</h2>
                                <span class="link-card-arrow">◀</span>
                            </div>
                            <div class="accordion-content">
                                <div class="accordion-links">
                                    <a href="bike/route_catalog/catalog.html" target="_blank" rel="noopener">🗺️ קטלוג מסלולים</a>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-card">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <div class="link-card-icon">🧹</div>
                                <h2 class="link-card-title">ניקוי קובץ GPX</h2>
                                <span class="link-card-arrow">◀</span>
                            </div>
                            <div class="accordion-content">
                                <div class="accordion-links">
                                    <a href="bike/gpx_cleaner/gpx_cleaner.html">🧹 כלי לניקוי קבצי GPX</a>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-card">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <div class="link-card-icon">🔎</div>
                                <h2 class="link-card-title">בדיקת מסלול חדש</h2>
                                <span class="link-card-arrow">◀</span>
                            </div>
                            <div class="accordion-content">
                                <div class="accordion-links">
                                    <a href="bike/gps_upload/gps_upload.html">🔎 העלאה ובדיקה של מסלול GPX חדש</a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="accordion-card">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <div class="link-card-icon">🎖️</div>
                    <h2 class="link-card-title">מבחן הכנה לקצונה</h2>
                    <span class="link-card-arrow">◀</span>
                </div>
                <div class="accordion-content">
                    <div class="accordion-links">
                        <a href="mikraot/mikraot_test.html">📝 כניסה למבחן מקראות לקצונה</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>
            🤖 פותח עם ❤️ על ידי <a href="mailto:yairron@gmail.com">יאיר רון</a>
        </p>
    </footer>

    <script>
        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            const wasActive = header.classList.contains('active');
            const container = header.closest('.links-container');
            if (container) {
                container.querySelectorAll('.accordion-header.active').forEach(function(h) {
                    if (h !== header) {
                        h.classList.remove('active');
                        h.nextElementSibling.classList.remove('show');
                    }
                });
            }
            header.classList.toggle('active', !wasActive);
            content.classList.toggle('show', !wasActive);
            if (!wasActive) {
                setTimeout(function() {
                    header.closest('.accordion-card').scrollIntoView({behavior: 'smooth', block: 'start'});
                }, 50);
            }
        }
    </script>
</body>
</html>
