<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדריך מקיף לזכויות ניצולי שואה בישראל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2E5B8A;
            --secondary: #4A90B5;
            --accent: #E8A840;
            --success: #2E7D32;
            --danger: #C62828;
            --light: #F5F9FC;
            --dark: #1A3A52;
            --text: #2C3E50;
            --warning: #F57C00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Assistant', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 70px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, 5%) scale(0.95); }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.95);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            margin-bottom: 30px;
            border: none;
            font-size: 1rem;
        }

        .back-button:hover {
            background: white;
            transform: translateX(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            font-family: 'Varela Round', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            text-shadow: 3px 5px 15px rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: rgba(255,255,255,0.95);
            font-weight: 300;
            text-shadow: 1px 2px 8px rgba(0,0,0,0.2);
        }

        .support-info {
            font-size: 1.2rem;
            color: #FFD54F;
            font-weight: 700;
            text-shadow: 1px 2px 8px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }

        .nii-error-banner {
            display: none;
            background: #fff3cd;
            border: 2px solid #f0a500;
            color: #7a5000;
            text-align: center;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .update-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-button {
            padding: 12px 24px;
            background: rgba(255,255,255,0.9);
            color: var(--primary);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: white;
            border-color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }

        .tab-button:hover {
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .accordions-container {
            margin-bottom: 40px;
        }

        .accordion {
            background: white;
            margin-bottom: 0;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.3s;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .accordion:first-child {
            border-radius: 24px 24px 0 0;
        }

        .accordion:last-child {
            border-radius: 0 0 24px 24px;
            border-bottom: none;
        }

        .accordion:hover {
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .accordion-header {
            padding: 20px 35px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            transition: all 0.3s;
        }

        .accordion-header:hover {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
        }

        .accordion-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .accordion-title {
            font-family: 'Varela Round', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            flex: 1;
            margin: 0;
        }

        .accordion-arrow {
            font-size: 1.3rem;
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .accordion.active .accordion-arrow {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .accordion.active .accordion-content {
            max-height: 10000px;
        }

        .accordion-body {
            padding: 35px;
            font-size: 1.1rem;
            line-height: 1.85;
            color: #546E7A;
            overflow-y: auto;
            max-height: 60vh;
        }

        .accordion-body h3 {
            color: var(--primary);
            font-size: 1.4rem;
            margin: 20px 0 15px 0;
            font-weight: 700;
        }

        .accordion-body h4 {
            color: var(--secondary);
            font-size: 1.2rem;
            margin: 18px 0 12px 0;
            font-weight: 600;
        }

        .accordion-body ul, .accordion-body ol {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .accordion-body li {
            padding: 10px 40px 10px 0;
            position: relative;
            border-bottom: 1px solid #E0E7EE;
        }

        .accordion-body li:last-child {
            border-bottom: none;
        }

        .accordion-body li::before {
            content: '✓';
            position: absolute;
            right: 10px;
            color: var(--success);
            font-weight: bold;
            font-size: 1.3rem;
        }

        .accordion-body p {
            margin: 12px 0;
        }

        /* Questionnaire Styles */
        .questionnaire-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
        }

        .question-group {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #E0E7EE;
        }

        .question-group:last-child {
            border-bottom: none;
        }

        .question-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
        }

        .question-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .checkbox-container, .radio-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .checkbox-container:hover, .radio-container:hover {
            background: #F5F9FC;
        }

        input[type="checkbox"], input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        input[type="text"], input[type="number"] {
            padding: 12px 15px;
            border: 2px solid #E0E7EE;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Assistant', sans-serif;
            transition: all 0.3s;
            background: #F8FAFB;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(46, 91, 138, 0.1);
        }

        .text-input-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .text-input-group input {
            flex: 1;
        }

        /* Recommendations Section */
        .recommendations-section {
            background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            border: 2px solid var(--success);
        }

        .recommendations-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recommendation-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-right: 4px solid var(--success);
        }

        .recommendation-item h4 {
            color: var(--primary);
            font-size: 1.15rem;
            margin-bottom: 10px;
        }

        .recommendation-item p {
            color: #546E7A;
            font-size: 1rem;
            margin: 8px 0;
        }

        .no-recommendations {
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Assistant', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(46, 91, 138, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #1B5E20;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Info Box */
        .info-box {
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border-right: 4px solid var(--primary);
            display: flex;
            gap: 15px;
        }

        .info-box-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .info-box-text {
            flex: 1;
        }

        .info-box-text strong {
            color: var(--primary);
        }

        /* Important Numbers */
        .phone-box {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 3px solid var(--accent);
        }

        .phone-icon {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .phone-info {
            flex: 1;
        }

        .phone-label {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .phone-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
        }

        .phone-note {
            font-size: 0.85rem;
            color: #999;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        table th {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            text-align: right;
            font-weight: 700;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #E0E7EE;
        }

        table tr:hover {
            background: #F8FAFB;
        }

        /* Progress indicator */
        .progress-bar {
            background: #E0E7EE;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--accent));
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* Score display */
        .score-display {
            background: linear-gradient(135deg, #FFF9C4 0%, #FFE082 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            border: 2px solid #FBC02D;
        }

        .score-number {
            font-size: 3rem;
            font-weight: 800;
            color: #F57F17;
            margin-bottom: 10px;
        }

        .score-text {
            font-size: 1.2rem;
            color: #E65100;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .accordion-title {
                font-size: 1.3rem;
            }

            .accordion-body {
                padding: 20px;
            }

            .questionnaire-section {
                padding: 20px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .phone-box {
                flex-direction: column;
                text-align: center;
            }

            .text-input-group {
                flex-direction: column;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>

                    description: "עם 50%+ נכות, אתה יכול לבקש הכרה במחלות נוספות (דיכאון, חרדות, וכו')",
                    contact: "הרשות לזכויות ניצולי השואה: *5105"
                }
            }
        ];

        // Initialize page
        async function initializePage() {
            buildAccordions();
            openFromHash();
            window.addEventListener('hashchange', openFromHash);
            buildQuestionnaire();
            try {
                const resp = await fetch('data/nii-constants.json');
                const nii = await resp.json();
                const v = key => nii[key] ? nii[key].value : null;
                const fmt = n => n !== null ? Math.round(n).toLocaleString('he-IL') : '—';
                document.querySelectorAll('[data-nii]').forEach(el => {
                    const key = el.dataset.nii;
                    if (nii[key]) el.textContent = nii[key].value.toLocaleString('he-IL');
                });
                recommendationsRules[0].recommendation.description = `אתה עשוי להיות זכאי לקצבה חודשית של ${fmt(v('holocaust_persecution_min_25pct'))}-${fmt(v('holocaust_persecution_max_100pct'))} ₪ לפי אחוז נכות`;
                recommendationsRules[2].recommendation.description = `אתה עשוי להיות זכאי לקצבה תלת-חודשית של ${fmt(v('holocaust_section2_quarterly_euro'))} אירו`;
                recommendationsRules[3].recommendation.description = `אם לא מקבל קצבה חודשית, אתה עשוי להיות זכאי למענק שנתי של ${fmt(v('holocaust_annual_grant'))} ₪`;
                recommendationsRules[4].recommendation.description = `ניתן לבקש החמרה בקצבה ותוספת 9 שעות סיעוד שבועיות (~${fmt(v('holocaust_nursing_hours_9_value'))} ₪)`;
                recommendationsRules[5].recommendation.description = `אם ההכנסה שלך נמוכה, אתה עשוי להיות זכאי לקצבה גבוהה יותר עד ${fmt(v('holocaust_persecution_enhanced_100'))} ₪`;
            } catch(e) {
                console.warn('NII load failed', e);
                document.getElementById('nii-error-banner').style.display = 'block';
            }
        }

        function buildAccordions() {
            const container = document.getElementById('infoAccordions');
            container.innerHTML = '';

            Object.entries(infoData).forEach(([title, data]) => {
                const accordion = document.createElement('div');
                accordion.className = 'accordion';
                accordion.id = data.id;
                accordion.innerHTML = `
                    <div class="accordion-header" onclick="toggleAccordion(this)">
                        <div class="accordion-icon">${data.icon}</div>
                        <h2 class="accordion-title">${title}</h2>
                        <div class="accordion-arrow">▼</div>
                    </div>
                    <div class="accordion-content">
                        <div class="accordion-body">
                            ${data.content}
                        </div>
                    </div>
                `;
                container.appendChild(accordion);
            });
        }

        function buildQuestionnaire() {
            const container = document.getElementById('questionnaireForm');
            container.innerHTML = '';

            questionnaireData.forEach(q => {
                const group = document.createElement('div');
                group.className = 'question-group';
                group.id = `q-${q.id}`;

                const label = document.createElement('label');
                label.className = 'question-label';
                label.textContent = q.label;
                group.appendChild(label);

                if (q.type === 'radio') {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'question-options';

                    q.options.forEach(opt => {
                        const container = document.createElement('label');
                        container.className = 'radio-container';
                        container.innerHTML = `
                            <input type="radio" name="${q.id}" value="${opt}" onchange="updateDependents()">
                            <span>${opt}</span>
                        `;
                        optionsDiv.appendChild(container);
                    });
                    group.appendChild(optionsDiv);
                } else if (q.type === 'number') {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.id = q.id;
                    input.placeholder = 'הזן מספר...';
                    input.onchange = () => updateDependents();
                    group.appendChild(input);
                }

                container.appendChild(group);
            });
        }

        function updateDependents() {
            questionnaireData.forEach(q => {
                if (q.dependent) {
                    const dependentValue = getFormValue(q.dependent);
                    const questionGroup = document.getElementById(`q-${q.id}`);
                    if (questionGroup) {
                        if (dependentValue === 'כן' || (q.dependent === 'hasDisability' && dependentValue === 'כן')) {
                            questionGroup.style.display = 'block';
                        } else if (dependentValue === 'לא') {
                            questionGroup.style.display = 'none';
                        }
                    }
                }
            });
        }

        function getFormValue(fieldId) {
            const radioInputs = document.querySelectorAll(`input[name="${fieldId}"]:checked`);
            if (radioInputs.length > 0) {
                return radioInputs[0].value;
            }
            const numberInput = document.getElementById(fieldId);
            if (numberInput) {
                return numberInput.value;
            }
            return null;
        }

        function collectFormData() {
            const data = {};
            questionnaireData.forEach(q => {
                data[q.id] = getFormValue(q.id);
            });
            return data;
        }

        function calculateRecommendations() {
            const data = collectFormData();
            const recommendations = recommendationsRules
                .filter(rule => rule.condition(data))
                .map(rule => rule.recommendation);

            displayRecommendations(recommendations, data);
        }

        function displayRecommendations(recommendations, data) {
            const container = document.getElementById('recommendationsContainer');
            const scoringResult = document.getElementById('scoringResult');

            if (recommendations.length === 0) {
                container.innerHTML = `
                    <div class="no-recommendations">
                        <p>😊 לא הצלחנו לזהות זכויות מתאימות בנתונים הנוכחיים.</p>
                        <p>עם זאת, <strong>בכל מקרה מומלץ להתקשר להרשות לזכויות ניצולי השואה (*5105)</strong> לבדיקה מלאה.</p>
                    </div>
                `;
            } else {
                let html = `
                    <div class="recommendations-section">
                        <h2 class="recommendations-title">💡 המלצות לפי תשובותיך:</h2>
                        <p style="margin-bottom: 20px; color: #666;">נמצאנו ${recommendations.length} אפשרויות זכאות אפשריות:</p>
                `;

                recommendations.forEach(rec => {
                    html += `
                        <div class="recommendation-item">
                            <h4>${rec.title}</h4>
                            <p>${rec.description}</p>
                            <p><strong>📞 ${rec.contact}</strong></p>
                        </div>
                    `;
                });

                html += `
                    <div class="action-buttons" style="margin-top: 30px;">
                        <button class="btn btn-primary" onclick="copyInformation()">📋 העתק מידע</button>
                        <button class="btn btn-success" onclick="printRecommendations()">🖨️ הדפס</button>
                    </div>
                    
                    <div class="info-box" style="margin-top: 20px;">
                        <div class="info-box-icon">⚠️</div>
                        <div class="info-box-text">
                            <strong>חשוב:</strong> המידע בשאלון זה הוא הנחיה כללית בלבד. המלצות אלה אינן תחליף לייעוץ משפטי או בדיקה רשמית מהרשויות המוסמכות. מומלץ בחום להתקשר לגורמים המקצועיים המפורטים להנחיה מתאימה למצבך האישי.
                        </div>
                    </div>
                `;

                html += '</div>';
                container.innerHTML = html;
            }

            // Show score
            if (scoringResult) {
                const score = recommendations.length;
                scoringResult.innerHTML = `
                    <div class="score-display">
                        <div class="score-number">${score}</div>
                        <div class="score-text">אפשרויות זכאות זוהו</div>
                        <div style="margin-top: 15px; font-size: 1rem; color: #E65100;">
                            מומלץ להתקשר מיידית לגופים המוצעים כדי למצות את כל הזכויות המגיעות לך
                        </div>
                    </div>
                `;
            }

            switchTab('recommendations');
        }

        function resetForm() {
            document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
            document.querySelectorAll('input[type="number"]').forEach(input => input.value = '');
            document.getElementById('scoringResult').innerHTML = '';
            updateDependents();
        }

        function copyInformation() {
            alert('מידע זה הועתק. תוכל להדביק אותו בדוא"ל או במסמך.');
        }

        function printRecommendations() {
            window.print();
        }

        function openFromHash() {
            const hash = decodeURIComponent(window.location.hash.slice(1));
            if (!hash) return;
            const target = document.getElementById(hash);
            if (!target) return;
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('info').classList.add('active');
            document.querySelectorAll('.tab-button').forEach(btn =>
                btn.classList.toggle('active', btn.getAttribute('onclick') === "switchTab('info')")
            );
            document.querySelectorAll('.accordion.active').forEach(a => a.classList.remove('active'));
            target.classList.add('active');
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 450);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleAccordion(header) {
            const accordion = header.closest('.accordion');
            const isActive = accordion.classList.contains('active');

            document.querySelectorAll('.accordion.active').forEach(acc => {
                acc.classList.remove('active');
            });

            if (!isActive) {
                accordion.classList.add('active');
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
    <script src="data/hamburger-nav.js"></script>
</body>
</html>
