<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שאלון לפונה לייעוץ לקשיש (עדיין בפיתוח)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .back-button::before {
            content: '← ';
            margin-left: 5px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 8px;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .section-description {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-right: 4px solid #667eea;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .required {
            color: #e74c3c;
            margin-right: 3px;
        }

        .options {
            margin-top: 15px;
        }

        .option {
            margin-bottom: 12px;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-left: 10px;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            user-select: none;
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
            font-weight: 600;
        }

        .sub-question {
            margin-top: 15px;
            margin-right: 30px;
            padding: 15px;
            background: #fff8e1;
            border-radius: 8px;
            display: none;
        }

        .sub-question.show {
            display: block;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.9em;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-small:hover {
            background: #c0392b;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .results-header h2 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .print-button {
            margin-top: 30px;
            text-align: center;
        }

        .validation-error {
            color: #e74c3c;
            margin-top: 8px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .dynamic-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .dynamic-table th,
        .dynamic-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: right;
        }

        .dynamic-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .dynamic-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .add-row-form {
            margin-top: 15px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
        }

        .add-row-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .add-row-form input {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .income-table-container {
            margin-top: 15px;
        }

        .income-table-container .dynamic-table td {
            vertical-align: middle;
        }

        .income-table-container .dynamic-table input[type="number"] {
            padding: 8px;
        }

        .income-table-container .dynamic-table input[type="checkbox"]:disabled + label,
        .income-table-container .dynamic-table input[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="number"],
        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-button">חזרה לדף הבית</a>
            <h1>שאלון לפונה לייעוץ לקשיש (עדיין בפיתוח)</h1>
            <p>אנא מלא/י את השאלון בקפידה</p>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="content">
            <div id="questionnaire"></div>
        </div>
    </div>

    <script>
        console.log('Script started loading...');
        let questionsData = [];
        let currentSection = 0;
        let answers = {};

        // Load questions from JSON file
        console.log('Starting to fetch intake_questions.json...');
        fetch('intake_questions.json')
            .then(response => {
                console.log('Response received:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Data loaded:', data);
                questionsData = data.sections;
                console.log('questionsData set, rendering section:', currentSection);
                renderSection(currentSection);
            })
            .catch(error => {
                console.error('Error loading questions:', error);
                document.getElementById('questionnaire').innerHTML = 
                    '<div class="error">שגיאה בטעינת השאלון. אנא נסה שוב מאוחר יותר.<br>שגיאה: ' + error.message + '</div>';
            });

        function renderSection(sectionIndex) {
            const container = document.getElementById('questionnaire');
            if (!container) {
                console.error('Container element not found!');
                return;
            }
            
            const section = questionsData[sectionIndex];
            console.log('Rendering section:', sectionIndex, section);
            
            if (!section) {
                console.log('No section at index', sectionIndex, 'calling showResults');
                showResults();
                return;
            }

            if (section.condition && !checkCondition(section.condition)) {
                const nextIndex = getNextSectionIndex(sectionIndex, 1);
                if (nextIndex === -1) {
                    showResults();
                    return;
                }
                currentSection = nextIndex;
                renderSection(currentSection);
                return;
            }

            let html = `
                <div class="section active">
                    <h2 class="section-title">${section.title}</h2>
                    ${section.description ? `<p class="section-description">${section.description}</p>` : ''}
                    <div class="questions-container">
            `;

            section.questions.forEach(question => {
                // Render all questions, but hide those that don't meet conditions
                const shouldShow = !question.condition || checkCondition(question.condition);
                html += renderQuestion(question, shouldShow);
            });

            html += `
                    </div>
                    <div class="buttons">
                        ${sectionIndex > 0 ? '<button class="btn btn-secondary" onclick="previousSection()">הקודם</button>' : '<div></div>'}
                        <button class="btn btn-primary" onclick="nextSection()">${sectionIndex < questionsData.length - 1 ? 'הבא' : 'סיום'}</button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            updateProgress();
            attachEventListeners();
        }

        function getNextSectionIndex(startIndex, direction) {
            let idx = startIndex + direction;
            while (idx >= 0 && idx < questionsData.length) {
                const section = questionsData[idx];
                if (!section.condition || checkCondition(section.condition)) {
                    return idx;
                }
                idx += direction;
            }
            return -1;
        }

        function renderQuestion(question, shouldShow = true) {
            const value = answers[question.id] || '';
            
            let html = `<div class="question" id="${question.id}_container" style="display: ${shouldShow ? 'block' : 'none'};">`;
            html += `<div class="question-text">`;
            if (question.required) {
                html += '<span class="required">*</span>';
            }
            html += `${question.text}</div>`;

            switch (question.type) {
                case 'radio':
                    html += '<div class="options">';
                    question.options.forEach(option => {
                        const checked = value === option.value ? 'checked' : '';
                        const selectedClass = value === option.value ? 'selected' : '';
                        html += `
                            <div class="option ${selectedClass}">
                                <input type="radio" 
                                       id="${question.id}_${option.value}" 
                                       name="${question.id}" 
                                       value="${option.value}" 
                                       ${checked}
                                       onchange="handleAnswer('${question.id}', this.value)">
                                <label for="${question.id}_${option.value}">${option.label}</label>
                            </div>
                        `;
                    });
                    html += '</div>';
                    break;

                case 'checkbox':
                    html += '<div class="options">';
                    question.options.forEach(option => {
                        const checked = (answers[question.id] && answers[question.id].includes(option.value)) ? 'checked' : '';
                        const selectedClass = checked ? 'selected' : '';
                        html += `
                            <div class="option ${selectedClass}">
                                <input type="checkbox" 
                                       id="${question.id}_${option.value}" 
                                       name="${question.id}" 
                                       value="${option.value}" 
                                       ${checked}
                                       onchange="handleCheckboxAnswer('${question.id}')">
                                <label for="${question.id}_${option.value}">${option.label}</label>
                            </div>
                        `;
                    });
                    html += '</div>';
                    break;

                case 'number':
                    html += `<input type="number" 
                                   id="${question.id}" 
                                   name="${question.id}" 
                                   value="${value}"
                                   placeholder="${question.placeholder || ''}"
                                   onchange="handleAnswer('${question.id}', this.value)">`;
                    break;

                case 'text':
                case 'textarea':
                    if (question.type === 'textarea') {
                        html += `<textarea 
                                       id="${question.id}" 
                                       name="${question.id}" 
                                       placeholder="${question.placeholder || ''}"
                                       onchange="handleAnswer('${question.id}', this.value)">${value}</textarea>`;
                    } else {
                        html += `<input type="text" 
                                       id="${question.id}" 
                                       name="${question.id}" 
                                       value="${value}"
                                       placeholder="${question.placeholder || ''}"
                                       onchange="handleAnswer('${question.id}', this.value)">`;
                    }
                    break;

                case 'date':
                    html += `<input type="date" 
                                   id="${question.id}" 
                                   name="${question.id}" 
                                   value="${value}"
                                   onchange="handleAnswer('${question.id}', this.value)">`;
                    break;

                case 'radio_with_amount':
                    html += '<div class="options">';
                    question.options.forEach(option => {
                        const checked = value === option.value ? 'checked' : '';
                        const selectedClass = value === option.value ? 'selected' : '';
                        html += `
                            <div class="option ${selectedClass}">
                                <input type="radio" 
                                       id="${question.id}_${option.value}" 
                                       name="${question.id}" 
                                       value="${option.value}" 
                                       ${checked}
                                       onchange="handleAnswer('${question.id}', this.value)">
                                <label for="${question.id}_${option.value}">${option.label}</label>
                            </div>
                        `;
                        if (option.hasAmount && value === option.value) {
                            const amountValue = answers[question.id + '_amount'] || '';
                            html += `
                                <div class="sub-question show">
                                    <label>סכום חודשי (₪):</label>
                                    <input type="number" 
                                           id="${question.id}_amount" 
                                           value="${amountValue}"
                                           onchange="handleAnswer('${question.id}_amount', this.value)"
                                           style="margin-top: 8px;">
                                </div>
                            `;
                        }
                    });
                    html += '</div>';
                    break;

                case 'dual_column_table':
                    html += renderDualColumnTable(question);
                    break;

                case 'income_table':
                    html += renderIncomeTable(question);
                    break;

                case 'table':
                    html += renderTable(question);
                    break;
            }

            html += '</div>';
            return html;
        }

        function renderIncomeTable(question) {
            const incomeData = answers[question.id] || {};
            let html = `
                <div class="income-table-container">
                    <table class="dynamic-table">
                        <thead>
                            <tr>
                                <th style="width: 50%;">סוג הכנסה</th>
                                <th style="width: 15%; text-align: center;">יש</th>
                                <th style="width: 35%;">סכום (₪)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            question.items.forEach(item => {
                const hasIncome = incomeData[item.id]?.has || false;
                const amount = incomeData[item.id]?.amount || '';
                const details = incomeData[item.id]?.details || '';
                
                html += `
                    <tr>
                        <td>${item.label}</td>
                        <td style="text-align: center;">
                            <input type="checkbox" 
                                   id="${question.id}_${item.id}_has"
                                   ${hasIncome ? 'checked' : ''}
                                   onchange="handleIncomeTableChange('${question.id}', '${item.id}', 'has', this.checked)"
                                   style="width: 20px; height: 20px; cursor: pointer;">
                        </td>
                        <td>
                            <input type="number" 
                                   id="${question.id}_${item.id}_amount"
                                   value="${amount}"
                                   placeholder="${item.amountLabel}"
                                   min="0"
                                   step="0.01"
                                   ${!hasIncome ? 'disabled' : ''}
                                   onchange="handleIncomeTableChange('${question.id}', '${item.id}', 'amount', this.value)"
                                   style="padding: 8px; border: 2px solid ${hasIncome ? '#667eea' : '#e0e0e0'}; border-radius: 4px; width: 100%;">
                `;
                
                if (item.hasDetails) {
                    html += `
                            <input type="text" 
                                   id="${question.id}_${item.id}_details"
                                   value="${details}"
                                   placeholder="${item.detailsLabel}"
                                   ${!hasIncome ? 'disabled' : ''}
                                   onchange="handleIncomeTableChange('${question.id}', '${item.id}', 'details', this.value)"
                                   style="padding: 8px; border: 2px solid ${hasIncome ? '#667eea' : '#e0e0e0'}; border-radius: 4px; width: 100%; margin-top: 8px;">
                    `;
                }
                
                html += `
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            return html;
        }

        function handleIncomeTableChange(questionId, itemId, field, value) {
            if (!answers[questionId]) {
                answers[questionId] = {};
            }
            if (!answers[questionId][itemId]) {
                answers[questionId][itemId] = { has: false, amount: '', details: '' };
            }
            
            answers[questionId][itemId][field] = value;
            
            // If unchecking "has", clear the amount and details
            if (field === 'has' && !value) {
                answers[questionId][itemId].amount = '';
                answers[questionId][itemId].details = '';
                const amountInput = document.getElementById(`${questionId}_${itemId}_amount`);
                const detailsInput = document.getElementById(`${questionId}_${itemId}_details`);
                if (amountInput) {
                    amountInput.value = '';
                    amountInput.disabled = true;
                    amountInput.style.borderColor = '#e0e0e0';
                }
                if (detailsInput) {
                    detailsInput.value = '';
                    detailsInput.disabled = true;
                    detailsInput.style.borderColor = '#e0e0e0';
                }
            } else if (field === 'has' && value) {
                // Enable the amount input when checking "has"
                const amountInput = document.getElementById(`${questionId}_${itemId}_amount`);
                const detailsInput = document.getElementById(`${questionId}_${itemId}_details`);
                if (amountInput) {
                    amountInput.disabled = false;
                    amountInput.style.borderColor = '#667eea';
                    amountInput.focus(); // Focus on amount field when checking
                }
                if (detailsInput) {
                    detailsInput.disabled = false;
                    detailsInput.style.borderColor = '#667eea';
                }
            }
        }

        function renderDualColumnTable(question) {
            const tableData = answers[question.id] || {};
            
            // בדיקה אם צריך לטפל בלוגיקה דינמית לסעיף 8
            const isDynamic = question.dynamicRows || false;
            let hasWorkIncomeApplicant = false;
            let hasWorkIncomeSpouse = false;
            
            if (isDynamic && question.id === 'q8_work_details') {
                // בדיקה האם יש הכנסה מעבודה בסעיף 3
                const incomeTableApplicant = answers['q3_income_applicant'];
                if (incomeTableApplicant && incomeTableApplicant.employed_income) {
                    hasWorkIncomeApplicant = incomeTableApplicant.employed_income.has === true;
                }
                
                const incomeTableSpouse = answers['q3_income_spouse'];
                if (incomeTableSpouse && incomeTableSpouse.employed_income) {
                    hasWorkIncomeSpouse = incomeTableSpouse.employed_income.has === true;
                }
            }
            
            let html = `
                <div class="table-container">
                    <table class="dynamic-table">
                        <thead>
                            <tr>
                                <th style="width: 40%;"></th>
            `;
            
            question.columns.forEach(col => {
                html += `<th style="width: 30%; text-align: center;">${col.label}</th>`;
            });
            html += `</tr></thead><tbody>`;

            question.rows.forEach(row => {
                // סינון שורות לפי תנאים דינמיים
                const shouldShowRowApplicant = !isDynamic || !row.showIfNoWorkIncome || !hasWorkIncomeApplicant;
                const shouldShowRowSpouse = !isDynamic || !row.showIfNoWorkIncome || !hasWorkIncomeSpouse;
                
                // אם לא צריך להציג את השורה בשתי העמודות - דלג עליה
                if (isDynamic && row.showIfNoWorkIncome && hasWorkIncomeApplicant && hasWorkIncomeSpouse) {
                    return; // Skip this row entirely
                }
                
                html += `<tr><td><strong>${row.label}</strong></td>`;
                
                question.columns.forEach(col => {
                    const cellId = `${question.id}_${row.id}_${col.id}`;
                    const cellValue = tableData[row.id] && tableData[row.id][col.id] ? tableData[row.id][col.id] : '';
                    
                    // בדיקה אם צריך להציג את התא הזה
                    const shouldShowCell = col.id === 'applicant' ? shouldShowRowApplicant : shouldShowRowSpouse;
                    
                    html += '<td style="text-align: center;">';
                    
                    if (!shouldShowCell) {
                        html += '<span style="color: #999;">-</span>';
                    } else if (row.type === 'radio' && row.options) {
                        row.options.forEach((opt, idx) => {
                            const checked = cellValue === opt.value ? 'checked' : '';
                            html += `
                                <label style="margin: 0 8px; display: inline-flex; align-items: center;">
                                    <input type="radio" 
                                           name="${cellId}"
                                           value="${opt.value}"
                                           ${checked}
                                           onchange="handleDualColumnTableChange('${question.id}', '${row.id}', '${col.id}', this.value)"
                                           style="margin-left: 5px;">
                                    ${opt.label}
                                </label>
                            `;
                        });
                    } else if (row.type === 'date') {
                        html += `
                            <input type="date" 
                                   id="${cellId}"
                                   value="${cellValue}"
                                   onchange="handleDualColumnTableChange('${question.id}', '${row.id}', '${col.id}', this.value)"
                                   style="padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                        `;
                    } else {
                        html += `
                            <input type="text" 
                                   id="${cellId}"
                                   value="${cellValue}"
                                   onchange="handleDualColumnTableChange('${question.id}', '${row.id}', '${col.id}', this.value)"
                                   style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                        `;
                    }
                    
                    html += '</td>';
                });
                
                html += '</tr>';
            });

            html += `
                    </tbody>
                    </table>
                </div>
            `;

            return html;
        }

        function handleDualColumnTableChange(questionId, rowId, colId, value) {
            if (!answers[questionId]) {
                answers[questionId] = {};
            }
            if (!answers[questionId][rowId]) {
                answers[questionId][rowId] = {};
            }
            answers[questionId][rowId][colId] = value;
        }

        function renderTable(question) {
            const tableData = answers[question.id] || [];
            let html = `
                <div class="table-container">
                    <table class="dynamic-table">
                        <thead>
                            <tr>
            `;
            
            question.columns.forEach(col => {
                html += `<th>${col.label}</th>`;
            });

            tableData.forEach((row, rowIndex) => {
                html += '<tr>';

                    if (col.type === 'select' && Array.isArray(col.options)) {

            `;

                if (col.type === 'select' && Array.isArray(col.options)) {
                    html += `

                        <select id="${question.id}_${col.id}_input" style="width: 100%; padding: 8px; border: 2px solid #e0e0e0; border-radius: 4px;">

                `;
                    col.options.forEach(opt => {
                        const isDefaultNo = col.defaultValue === opt.value;
                        html += `<option value="${opt.value}" ${isDefaultNo ? 'selected' : ''}>${opt.label}</option>`;
                    });
                    html += `
                        </select>
                    </div>
                `;
                } else {
                    const defaultVal = col.defaultValue ? ` value="${col.defaultValue}"` : '';
                    html += `

                               id="${question.id}_${col.id}_input"${defaultVal}>

            html += `
                        <button class="btn btn-primary" onclick="addTableRow('${question.id}')">הוסף</button>

                    </div>
                </div>
            `;

            return html;
        }

        function checkCondition(condition) {
            if (!condition) return true;
            
            for (const [questionId, expectedValue] of Object.entries(condition)) {
                const actualValue = answers[questionId];
                
                if (Array.isArray(expectedValue)) {
                    if (!expectedValue.includes(actualValue)) {
                        return false;
                    }
                } else {
                    if (actualValue !== expectedValue) {
                        return false;
                    }
                }
            }
            
            return true;
        }

        function handleAnswer(questionId, value) {
            answers[questionId] = value;
            updateConditionalQuestions();
        }

        function handleCheckboxAnswer(questionId) {
            const checkboxes = document.querySelectorAll(`input[name="${questionId}"]:checked`);
            answers[questionId] = Array.from(checkboxes).map(cb => cb.value);
            updateConditionalQuestions();
        }

        function updateConditionalQuestions() {
            const section = questionsData[currentSection];
            if (!section) return;

            section.questions.forEach(question => {
                const container = document.getElementById(`${question.id}_container`);
                if (!container) return;

                if (question.condition && !checkCondition(question.condition)) {
                    container.style.display = 'none';
                } else {
                    container.style.display = 'block';
                }
            });
        }

        function attachEventListeners() {
            // Add event listeners for option selection visual feedback
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const input = this.querySelector('input');
                    if (input && input.type === 'radio') {
                        this.closest('.options').querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        this.classList.add('selected');
                    } else if (input && input.type === 'checkbox') {
                        this.classList.toggle('selected');
                    }
                });
            });
        }

        function nextSection() {
            if (validateSection()) {
                const nextIndex = getNextSectionIndex(currentSection, 1);
                if (nextIndex === -1) {
                    showResults();
                    return;
                }
                currentSection = nextIndex;
                renderSection(currentSection);
                window.scrollTo(0, 0);
            }
        }

        function previousSection() {
            const prevIndex = getNextSectionIndex(currentSection, -1);
            if (prevIndex !== -1) {
                currentSection = prevIndex;
                renderSection(currentSection);
                window.scrollTo(0, 0);
            }
        }

        function validateSection() {
            const section = questionsData[currentSection];
            let isValid = true;
            let errorMessages = [];

            section.questions.forEach(question => {
                if (question.required && (!question.condition || checkCondition(question.condition))) {
                    const value = answers[question.id];
                    
                    // Special validation for income_table
                    if (question.type === 'income_table') {
                        const incomeData = value || {};
                        let hasAtLeastOne = false;
                        let missingAmounts = [];
                        
                        question.items.forEach(item => {
                            if (incomeData[item.id]?.has) {
                                hasAtLeastOne = true;
                                if (!incomeData[item.id].amount || incomeData[item.id].amount === '') {
                                    missingAmounts.push(item.label);
                                }
                            }
                        });
                        
                        if (missingAmounts.length > 0) {
                            errorMessages.push(`נא למלא סכום עבור: ${missingAmounts.join(', ')}`);
                            isValid = false;
                        }
                    } else if (!value || (Array.isArray(value) && value.length === 0)) {
                        errorMessages.push(`אנא השב/י על השאלה: ${question.text}`);
                        isValid = false;
                    }
                }
            });

            if (!isValid) {
                alert(errorMessages.join('\n'));
            }

            return isValid;
        }

        function updateProgress() {
            const progress = ((currentSection + 1) / questionsData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showAddRowForm(questionId) {
            document.getElementById(`${questionId}_form`).style.display = 'block';
        }

        function hideAddRowForm(questionId) {
            document.getElementById(`${questionId}_form`).style.display = 'none';
        }

        function addTableRow(questionId) {
            const section = questionsData[currentSection];
            const question = section.questions.find(q => q.id === questionId);
            
            const newRow = {};
            let allFilled = true;

            question.columns.forEach(col => {
                const input = document.getElementById(`${questionId}_${col.id}_input`);
                if (!input) {
                    allFilled = false;
                    return;
                }

                const value = input.value ? input.value.trim() : '';
                if (value) {
                    newRow[col.id] = value;
                    if (input.tagName === 'SELECT') {
                        input.value = '';
                    } else {
                        input.value = '';
                    }
                } else {
                    allFilled = false;
                }
            });

            if (!allFilled) {
                alert('אנא מלא/י את כל השדות');
                return;
            }

            if (!answers[questionId]) {
                answers[questionId] = [];
            }
            answers[questionId].push(newRow);

            renderSection(currentSection);
            hideAddRowForm(questionId);
        }

        function deleteTableRow(questionId, rowIndex) {
            if (confirm('האם אתה בטוח שברצונך למחוק שורה זו?')) {
                answers[questionId].splice(rowIndex, 1);
                renderSection(currentSection);
            }
        }



        function formatAnswer(question, answer) {
            if (question.type === 'dual_column_table') {
                let html = '<table class="dynamic-table"><thead><tr>';
                html += '<th></th>';
                question.columns.forEach(col => {

                });
                html += '</tr></thead><tbody>';
                
                question.rows.forEach(row => {
                    html += `<tr><td><strong>${row.label}</strong></td>`;
                    question.columns.forEach(col => {

                        let displayValue = cellValue;
                        
                        if (row.type === 'radio' && row.options && cellValue) {
                            const opt = row.options.find(o => o.value === cellValue);
                            displayValue = opt ? opt.label : cellValue;
                        }
                        
                        html += `<td style="text-align: center;">${displayValue}</td>`;
                    });
                    html += '</tr>';
                });
                
                html += '</tbody></table>';
                return html;
            } else if (question.type === 'income_table') {
                let html = '<table class="dynamic-table"><thead><tr>';
                html += '<th>סוג הכנסה</th><th>סכום (₪)</th>';
                html += '</tr></thead><tbody>';
                
                let totalIncome = 0;
                question.items.forEach(item => {
                    if (answer[item.id]?.has && answer[item.id]?.amount) {
                        const amount = parseFloat(answer[item.id].amount) || 0;
                        totalIncome += amount;
                        html += '<tr>';
                        html += `<td>${item.label}`;
                        if (answer[item.id].details) {
                            html += ` - ${answer[item.id].details}`;
                        }
                        html += '</td>';
                        html += `<td style="text-align: left;">${amount.toLocaleString('he-IL')} ₪</td>`;
                        html += '</tr>';
                    }
                });
                
                if (totalIncome > 0) {
                    html += `<tr style="background: #f0f4ff; font-weight: 600;"><td>סה"כ הכנסות</td><td style="text-align: left;">${totalIncome.toLocaleString('he-IL')} ₪</td></tr>`;
                }
                
                html += '</tbody></table>';
                return html;
            } else if (question.type === 'table' && Array.isArray(answer)) {
                let html = '<table class="dynamic-table"><thead><tr>';
                question.columns.forEach(col => {
                    html += `<th>${col.label}</th>`;
                });
                html += '</tr></thead><tbody>';
                answer.forEach(row => {
                    html += '<tr>';
                    question.columns.forEach(col => {
                        html += `<td>${row[col.id] || ''}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                return html;
            } else if (Array.isArray(answer)) {
                return answer.join(', ');
            } else if (question.type === 'radio' || question.type === 'radio_with_amount') {
                const option = question.options.find(opt => opt.value === answer);
                let result = option ? option.label : answer;
                if (answers[question.id + '_amount']) {
                    result += ` - ${answers[question.id + '_amount']} ₪`;
                }
                return result;
            }
            return answer;
        }

        // ==================== אלגוריתם חישוב זכאות ====================

        // ==================== חישובי גיל פרישה לנשים ====================
        
        // חישוב גיל פרישה מדויק לנשים (בשנים וחודשים)
        function getRetirementAgeWomenDetailed(birthYear, birthMonth) {
            // טבלה מדויקת לפי הביטוח הלאומי:
            // עד 31.12.1959: 62 שנים
            // 1.1.1960-31.12.1960: 62 שנים ו-4 חודשים
            // 1.1.1961-31.12.1961: 62 שנים ו-8 חודשים
            // 1.1.1962-31.12.1962: 63 שנים
            // 1.1.1963-31.12.1963: 63 שנים ו-4 חודשים
            // 1.1.1964-31.12.1964: 63 שנים ו-8 חודשים
            // 1.1.1965-31.12.1965: 64 שנים
            // 1.1.1966-31.12.1966: 64 שנים ו-4 חודשים
            // 1.1.1967 ואילך: 65 שנים
            
            const retirementAgesWomen = {
                1959: 62.0,
                1960: 62 + 4/12,      // 62.333...
                1961: 62 + 8/12,      // 62.666...
                1962: 63.0,
                1963: 63 + 4/12,      // 63.333...
                1964: 63 + 8/12,      // 63.666...
                1965: 64.0,
                1966: 64 + 4/12,      // 64.333...
                1967: 65.0
            };
            
            if (birthYear <= 1959) return 62.0;
            if (birthYear >= 1967) return 65.0;
            return retirementAgesWomen[birthYear] || 65.0;
        }

        // חישוב גיל מדויק (בשנים וחודשים)
        function calculateAgeDetailed(birthYear, birthMonth) {
            const currentYear = 2026;
            const currentMonth = 2; // פברואר
            
            let ageInYears = currentYear - birthYear;
            let ageInMonths = currentMonth - (birthMonth || 1);
            
            if (ageInMonths < 0) {
                ageInYears--;
                ageInMonths += 12;
            }
            
            const preciseAge = ageInYears + ageInMonths / 12;
            return {
                years: ageInYears,
                months: ageInMonths,
                precise: preciseAge
            };
        }

        // בדיקה אם אישה הגיעה לגיל פרישה
        function hasReachedRetirementAgeWomen(gender, age, birthYear, birthMonth) {
            if (gender === 'male') {
                // גברים: גיל פרישה קבוע 67
                return age >= 67;
            }
            
            // לנשים: בדיקה מדויקת לפי גיל ושנת לידה
            const retirementAgeWomen = getRetirementAgeWomenDetailed(birthYear, birthMonth);
            const ageDetailed = calculateAgeDetailed(birthYear, birthMonth);
            
            return ageDetailed.precise >= retirementAgeWomen;
        }

        // בדיקה אם הגיעה לגיל 70 (זכאות מוחלטת)
        function hasReachedAbsoluteEligibilityAge(age, birthYear, birthMonth) {
            // גיל 70 הוא גיל הזכאות המוחלט (ללא מבחן הכנסות) לכל אחד
            return age >= 70;
        }

        // חישוב שנות דחיה מדויקות (בין גיל פרישה ל-70)
        function calculateDeferralYears(gender, birthYear, birthMonth, workStopDate) {
            if (!workStopDate) return 0;
            
            const retirementAgeWomen = getRetirementAgeWomenDetailed(birthYear, birthMonth);
            const retirementAgeByGender = gender === 'male' ? 67 : retirementAgeWomen;
            
            // חישוב תאריך הגעה לגיל פרישה
            const retirementYears = Math.floor(retirementAgeByGender);
            const retirementMonths = Math.round((retirementAgeByGender % 1) * 12);
            
            const retirementDate = new Date(birthYear + retirementYears, (birthMonth || 1) - 1 + retirementMonths, 1);
            
            // תאריך עצירת קבלת הקצבה
            const [stopYear, stopMonth, stopDay] = workStopDate.split('-').map(Number);
            const workStopDateObj = new Date(stopYear, stopMonth - 1, stopDay);
            
            // חישוב הפרש בשנים וחודשים
            if (workStopDateObj < retirementDate) {
                return 0; // עוד לא הגיע לגיל פרישה
            }
            
            // חישוב בדיוק של שנים וחודשים
            let deferralYears = 2026 - stopYear;
            let deferralMonths = 2 - (stopMonth || 1);
            
            if (deferralMonths < 0) {
                deferralYears--;
                deferralMonths += 12;
            }
            
            const preciseDeferralYears = deferralYears + deferralMonths / 12;
            
            // הגבלה: עד גיל 70
            const maxDeferralYears = 70 - Math.ceil(retirementAgeByGender);
            return Math.min(preciseDeferralYears, maxDeferralYears);
        }

        // חישוב גיל פרישה לנשים (פשוט)
        function getRetirementAgeWomen(birthYear) {
            if (birthYear <= 1959) return 62;
            if (birthYear >= 1967) return 65;
            return CONSTANTS_2026.RETIREMENT_AGE_WOMEN[birthYear.toString()] || 65;
        }

        // חישוב גיל מדויק
        function calculateAge(birthYear) {
            const currentYear = 2026;
            return currentYear - birthYear;
        }

        // חישוב הכנסות ממסמך השאלון
        function calculateTotalIncome() {
            let totalIncome = 0;
            
            // הכנסות מסעיף 3 (income_table) - היחיד
            const incomeTable = answers['q3_income_applicant'];
            if (incomeTable && typeof incomeTable === 'object') {
                Object.keys(incomeTable).forEach(key => {
                    if (incomeTable[key].has && incomeTable[key].amount) {
                        totalIncome += parseFloat(incomeTable[key].amount) || 0;
                    }
                });
            }
            
            return totalIncome;
        }

        // חישוב הכנסות בן/בת זוג
        function calculateSpouseIncome() {
            let spouseIncome = 0;
            
            // הכנסות מסעיף 3 (spouse income_table) - בן הזוג
            const spouseIncomeTable = answers['q3_income_spouse'];
            if (spouseIncomeTable && typeof spouseIncomeTable === 'object') {
                Object.keys(spouseIncomeTable).forEach(key => {
                    if (spouseIncomeTable[key].has && spouseIncomeTable[key].amount) {
                        spouseIncome += parseFloat(spouseIncomeTable[key].amount) || 0;
                    }
                });
            }
            
            return spouseIncome;
        }

        // בדיקה אם יש בן/בת זוג
        function hasSpouse() {
            return answers['q2_1_has_spouse'] === 'yes';
        }

        // ספירת ילדים עד גיל 24
        function countChildren() {
            const childrenTable = answers['q6_children_table'];
            if (!Array.isArray(childrenTable)) return 0;
            
            // מקסימום 2 ילדים לצורך חישוב
            return Math.min(childrenTable.length, 2);
        }

        // חישוב זכאות לקצבת אזרח ותיק - מגיש הבקשה
        function calculateOldAgePensionApplicant() {
            const gender = answers['q1_1_gender'];
            const age = answers['q1_2_age'];
            const hasSpouseValue = hasSpouse();
            const totalIncome = calculateTotalIncome();
            const spouseIncome = hasSpouseValue ? calculateSpouseIncome() : 0;
            const childrenCount = countChildren();
            const vetMonths = getVeteranMonths();
            
            let result = {
                eligible: false,
                type: '', // 'full', 'partial', 'none'
                reason: '',
                amount: 0,
                details: []
            };

            // בדיקת גיל פרישה
            let retirementAge;
            if (gender === 'male') {
                retirementAge = CONSTANTS_2026.RETIREMENT_AGE_MEN;
            } else {
                const birthYear = 2026 - age;
                retirementAge = getRetirementAgeWomen(birthYear);
            }

            if (age < retirementAge) {
                const birthYear = 2026 - age;
                const detailedRetirementAge = getRetirementAgeWomenDetailed(birthYear, null);
                const ageDetailed = calculateAgeDetailed(birthYear, 1);
                
                // בנשים: הצג בדיוק של חודשים
                if (gender === 'female') {
                    const yearsToRetirement = Math.floor(detailedRetirementAge - ageDetailed.precise);
                    const monthsToRetirement = Math.round((detailedRetirementAge - ageDetailed.precise) * 12);
                    result.reason = `טרם הגעת לגיל פרישה. גיל פרישה: ${Math.floor(detailedRetirementAge)} שנים ו-${Math.round((detailedRetirementAge % 1) * 12)} חודשים. עוד ${monthsToRetirement} חודשים עד הגעה לגיל הפרישה.`;
                } else {
                    result.reason = `טרם הגעת לגיל פרישה (${retirementAge}). גיל נוכחי: ${age}`;
                }
                return result;
            }

            // מעל גיל 70 - זכאות מוחלטת ללא מבחן הכנסות
            if (age >= CONSTANTS_2026.FULL_ELIGIBILITY_AGE) {
                result.eligible = true;
                result.type = 'full';
                result.reason = `מעל גיל 70 - זכאות מוחלטת ללא מבחן הכנסות`;
                
                // חישוב קצבה בסיסית - ללא תוספת בן זוג (כל אחד בנפרד)
                let basePension = age >= 80 ? CONSTANTS_2026.BASIC_PENSION_SINGLE_80 : CONSTANTS_2026.BASIC_PENSION_SINGLE;
                result.details.push(`קצבה בסיסית: ${basePension.toLocaleString('he-IL')} ₪`);
                
                // תוספת וותק
                const veteranSupplement = calculateVeteranSupplement(vetMonths);
                const pensionWithVeteran = Math.round(basePension * (1 + veteranSupplement));
                if (veteranSupplement > 0) {
                    result.details.push(`תוספת וותק (${Math.round(veteranSupplement * 100)}%): +${Math.round(pensionWithVeteran - basePension).toLocaleString('he-IL')} ₪`);
                }
                
                // תוספת דחיה
                const workDetails = answers['q8_work_details'];

        // חישוב אחוז תוספת וותק
        function calculateVeteranSupplement(months) {
            // לפי החוק - כל שנה (12 חודשים) צבירה מעל 10 שנים (120 חודשים) מוסיפה 2%
            // עד מקסימום 50% (כ-35 שנים + 120 חודשים)
            
            if (months <= 120) {
                // עד 10 שנים - ללא תוספת וותק
                return 0;
            }
            
            const excessMonths = months - 120;
            const excessYears = excessMonths / 12;
            const supplement = Math.min(0.50, excessYears * 0.02);
            return supplement;
        }

        // חישוב אחוז תוספת דחיה
        function calculateDeferralSupplement(gender, age, workStopDate) {
            // תוספת דחיה: 5% לכל שנה שהוכתשה הקצבה מגיל הפרישה עד גיל 70
            // גברים: מקסימום 15% (3 שנים מגיל 67 עד 70)
            // נשים: מקסימום עד 40% (8 שנים מגיל 62 עד 70)
            
            if (!workStopDate) {
                return 0; // לא הוכתשה קצבה
            }
            
            // חישוב גיל פרישה
            let retirementAge;
            if (gender === 'male') {
                retirementAge = CONSTANTS_2026.RETIREMENT_AGE_MEN;
            } else {
                const birthYear = 2026 - age;
                retirementAge = getRetirementAgeWomen(birthYear);
            }
            
            // חישוב שנת הפסקת העבודה
            const stopDateParts = workStopDate.split('-');
            if (stopDateParts.length !== 3) {
                return 0; // תאריך לא תקין
            }
            
            const stopYear = parseInt(stopDateParts[0]);
            const stopMonth = parseInt(stopDateParts[1]);
            
            // חישוב שנים שהוכתשה קצבה (מגיל פרישה)
            const currentYear = 2026;
            const currentMonth = 2; // פברואר
            
            let yearsDeferred = currentYear - stopYear;
            let monthsDeferred = currentMonth - stopMonth;
            
            if (monthsDeferred < 0) {
                yearsDeferred--;
                monthsDeferred += 12;
            }
            
            const preciseDeferralYears = yearsDeferred + monthsDeferred / 12;
            
            // מקסימום דחיה עד גיל 70
            const maxDeferralYears = 70 - Math.ceil(retirementAge);
            const actualDeferralYears = Math.min(preciseDeferralYears, maxDeferralYears);
            
            if (actualDeferralYears <= 0) {
                return 0;
            }
            
            // תוספת דחיה: 5% לשנה
            // גברים: מקסימום 15% (3 שנים)
            // נשים: מקסימום 40% (8 שנים)
            const maxSupplement = gender === 'male' ? 0.15 : 0.40;
            const deferralSupplement = Math.min(maxSupplement, actualDeferralYears * 0.05);
            return deferralSupplement;
        }

        // חישוב זכאות להשלמת הכנסה
        // פונקציה ראשית להצגת תוצאות
        function showResults() {

            const gender = answers['q1_1_gender'];
            const age = answers['q1_2_age'];
            const birthYear = 2026 - age;
            const retirementAge = gender === 'male' ? 67 : getRetirementAgeWomen(birthYear);

                        <strong>גיל פנסיה (70):</strong> ${spouseHasReachedPension ? '✅ הגיע' : '❌ טרם הגיע'}
                    </p>
                `;
            }
            
            let html = `
                <div class="results show">
                    <div class="results-header">
                        <h2>📋 סיכום ותוצאות אבחון זכאות</h2>
                        <p>על פי התשובות שסיפקת, הנה ניתוח הזכאות שלך לקצבאות:</p>
                    </div>

                    <!-- קצבת אזרח ותיק - מגיש הבקשה -->
                    <div style="background: ${oldAgePensionApplicant.eligible ? '#e8f5e9' : '#ffebee'}; padding: 25px; border-radius: 12px; border-right: 5px solid ${oldAgePensionApplicant.eligible ? '#4caf50' : '#f44336'}; margin: 25px 0;">
                        <h3 style="color: ${oldAgePensionApplicant.eligible ? '#2e7d32' : '#c62828'}; margin-bottom: 15px;">
                            ${oldAgePensionApplicant.eligible ? '✅' : '❌'} קצבת אזרח ותיק (קצבת זקנה) - מגיש הבקשה
                        </h3>
                        <p style="margin-bottom: 10px; font-size: 0.95em;">
                            <strong>גיל:</strong> ${age} | 
                            <strong>גיל פרישה:</strong> ${Math.floor(retirementAge)} ${hasReachedRetirement ? '✅ הגיע' : '❌ טרם הגיע'} | 
                            <strong>גיל פנסיה (70):</strong> ${hasReachedPension ? '✅ הגיע' : '❌ טרם הגיע'}
                        </p>
                        <p style="font-size: 1.1em; font-weight: 600; margin-bottom: 10px;">
                            <strong>סטטוס:</strong> ${oldAgePensionApplicant.eligible ? (oldAgePensionApplicant.type === 'full' ? 'זכאי לקצבה מלאה' : 'זכאי לקצבה חלקית') : 'לא זכאי'}
                        </p>
                        <p style="margin-bottom: 10px;"><strong>הסבר:</strong> ${oldAgePensionApplicant.reason}</p>
                        ${oldAgePensionApplicant.amount > 0 ? `<p style="font-size: 1.3em; font-weight: bold; color: #1976d2;">💰 סכום משוער: ${oldAgePensionApplicant.amount.toLocaleString('he-IL')} ₪ לחודש</p>` : ''}
                        ${oldAgePensionApplicant.details.length > 0 ? `
                            <div style="background: white; padding: 15px; border-radius: 8px; margin-top: 15px;">
                                <h4>פירוט החישוב:</h4>
                                <ul style="margin: 10px 0 0 20px;">
                                    ${oldAgePensionApplicant.details.map(detail => `<li>${detail}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>

                    ${oldAgePensionSpouse ? `
                    <!-- קצבת אזרח ותיק - בן/בת הזוג -->
                    <div style="background: ${oldAgePensionSpouse.eligible ? '#e8f5e9' : '#ffebee'}; padding: 25px; border-radius: 12px; border-right: 5px solid ${oldAgePensionSpouse.eligible ? '#4caf50' : '#f44336'}; margin: 25px 0;">
                        <h3 style="color: ${oldAgePensionSpouse.eligible ? '#2e7d32' : '#c62828'}; margin-bottom: 15px;">
                            ${oldAgePensionSpouse.eligible ? '✅' : '❌'} קצבת אזרח ותיק (קצבת זקנה) - בן/בת הזוג
                        </h3>
                        ${spouseAgeInfo}
                        <p style="font-size: 1.1em; font-weight: 600; margin-bottom: 10px;">
                            <strong>סטטוס:</strong> ${oldAgePensionSpouse.eligible ? (oldAgePensionSpouse.type === 'full' ? 'זכאי לקצבה מלאה' : 'זכאי לקצבה חלקית') : 'לא זכאי'}
                        </p>
                        <p style="margin-bottom: 10px;"><strong>הסבר:</strong> ${oldAgePensionSpouse.reason}</p>
                        ${oldAgePensionSpouse.amount > 0 ? `<p style="font-size: 1.3em; font-weight: bold; color: #1976d2;">💰 סכום משוער: ${oldAgePensionSpouse.amount.toLocaleString('he-IL')} ₪ לחודש</p>` : ''}
                        ${oldAgePensionSpouse.details.length > 0 ? `
                            <div style="background: white; padding: 15px; border-radius: 8px; margin-top: 15px;">
                                <h4>פירוט החישוב:</h4>
                                <ul style="margin: 10px 0 0 20px;">

                    ${oldAgePensionApplicant.eligible && oldAgePensionSpouse && oldAgePensionSpouse.eligible ? `

                            ${(oldAgePensionApplicant.amount + oldAgePensionSpouse.amount).toLocaleString('he-IL')} ₪ לחודש

                        <p style="font-size: 0.95em; color: #555;">
                            מגיש הבקשה: ${oldAgePensionApplicant.amount.toLocaleString('he-IL')} ₪ + בן/בת הזוג: ${oldAgePensionSpouse.amount.toLocaleString('he-IL')} ₪

                    <!-- סיכום נתוני השאלון -->
                    <div style="background: #f5f5f5; padding: 25px; border-radius: 12px; margin: 25px 0;">

            `;

            // הצגת תשובות לפי סעיפים
            let lastSectionWasIncome = false;
            questionsData.forEach((section, index) => {
                html += `
                    <div style="margin-bottom: 20px;">
                        <h4 style="color: #667eea; margin-bottom: 10px;">${section.title}</h4>
                        <div style="background: white; padding: 15px; border-radius: 8px;">
                `;

                section.questions.forEach(question => {
                    const answer = answers[question.id];
                    if (answer !== undefined && answer !== null && answer !== '') {
                        const formattedAnswer = formatAnswer(question, answer);
                        html += `
                            <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e0e0e0;">
                                <strong>${question.text}</strong><br>
                                <span style="color: #555;">${formattedAnswer}</span>
                            </div>
                        `;
                        
                        // אם זה טבלת הכנסה של בן הזוג, הוסף סה"כ הכנסה משפחתית
                        if (question.id === 'q3_income_spouse') {
                            const totalAppIncome = calculateTotalIncome();
                            const totalSpouseIncome = calculateSpouseIncome();
                            const totalFamilyIncome = totalAppIncome + totalSpouseIncome;
                            html += `
                                <div style="margin-bottom: 12px; padding: 15px; background: #e3f2fd; border-radius: 6px; border-right: 4px solid #2196f3; font-weight: 600;">
                                    <strong style="color: #1565c0;">💰 סה"כ הכנסה משפחתית: ${totalFamilyIncome.toLocaleString('he-IL')} ₪</strong>
                                </div>
                            `;
                        }
                    }
                });

                html += `
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- המלצות והצעדים הבאים -->
                    <div style="background: #fff8e1; padding: 25px; border-radius: 12px; border-right: 5px solid #ffc107; margin: 25px 0;">
                        <h3 style="color: #f57f17; margin-bottom: 15px;">📌 המלצות וצעדים הבאים</h3>
                        <ul style="margin: 15px 0 0 20px; line-height: 1.8;">
                            ${oldAgePensionApplicant.eligible || (oldAgePensionSpouse && oldAgePensionSpouse.eligible) || incomeSupplement.eligible ? `
                                <li><strong>הגש תביעה:</strong> מומלץ להגיש תביעה לביטוח הלאומי בהקדם</li>

                                <li><strong>זמן טיפול:</strong> התביעה מטופלת בדרך כלל תוך 30-45 יום</li>
                            ` : `
                                <li><strong>בדיקה חוזרת:</strong> מומלץ לבדוק שוב בעת שינוי במצב ההכנסות או הגיל</li>
                                <li><strong>ייעוץ:</strong> פנה לעובד סוציאלי או למוקד הביטוח הלאומי לייעוץ נוסף</li>
                            `}
                            <li><strong>מוקד הביטוח הלאומי:</strong> *6050 או 02-6371200</li>
                            <li><strong>אתר הביטוח הלאומי:</strong> <a href="https://www.btl.gov.il" target="_blank">btl.gov.il</a></li>
                        </ul>
                    </div>

                    <!-- כפתור הדפסה -->
                    <div class="print-button">
                        <button class="btn btn-primary" onclick="window.print()">🖨️ הדפס דו"ח</button>
                        <button class="btn btn-secondary" onclick="location.reload()" style="margin-right: 10px;">🔄 התחל מחדש</button>
                    </div>

                    <!-- הצהרת מדיניות -->
                    <div style="background: #fafafa; padding: 20px; border-radius: 8px; margin-top: 25px; font-size: 0.9em; color: #666;">
                        <p><strong>⚠️ הצהרה:</strong> תוצאות אבחון זה הן לצרכי הערכה בלבד ואינן מהוות החלטה רשמית. הזכאות הסופית נקבעת על ידי הביטוח הלאומי בהתאם לחוק ולבדיקת המסמכים. הנתונים מבוססים על נתוני 2026 ועשויים להשתנות.</p>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            window.scrollTo(0, 0);
        }
    </script>
