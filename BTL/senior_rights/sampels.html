<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="מערכת שאלות ותשובות - קצבאות וגמלאות ביטוח לאומי">
    <meta name="keywords" content="ביטוח לאומי, קצבה, אזרח ותיק, גמלה, תוספת ותק">
    <meta name="author" content="מערכת מידע ביטוח לאומי">
    <title>דוגמאות - קצבת זיקנה והשלמת הכנסה</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="sampels_style.css">
    <style>
        .back-button-container {
            text-align: center;
            padding: 20px 0;
        }

        .back-button {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .back-button::before {
            content: '← ';
            margin-left: 5px;
        }

        .support-info {
            font-size: 1.1rem;
            color: #FFD54F;
            font-weight: 700;
            text-shadow: 1px 2px 8px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.95em !important;
            opacity: 0.75 !important;
        }
    </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XFYGMQ47QN"></script>

  gtag('js', new Date());

  gtag('config', 'G-XFYGMQ47QN');
</script>
</head>
<body>
    <!-- Back Button -->
    <div class="back-button-container">
        <a href="../index.html" class="back-button">חזרה לדף ראשי</a>
    </div>

    <!-- Header -->
    <div class="container">
        <div class="header">
            <h1>דוגמאות</h1>
            <p class="support-info">מרכז תמיכה ומידע טלפוני ארצי בטלפון <span dir="ltr">*9696</span></p>
            <p>קצבת אזרח ותיק והשלמת הכנסה</p>
        </div>

        <!-- Content Area -->
        <div class="content" id="content">
            <!-- Content will be dynamically loaded here by JavaScript -->
            <div style="text-align: center; padding: 50px; color: #666;">
                <p style="font-size: 1.2em;">טוען נתונים...</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="sampels_app.js"></script>
