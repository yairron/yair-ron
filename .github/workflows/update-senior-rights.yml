name: עדכון אוטומטי - קטגוריה אחת ליום

# מתי להריץ
on:
  # כל יום בחצות (שעון ישראל: 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

  # אפשרות להריץ ידנית
  workflow_dispatch:

jobs:
  update-data:
    name: עדכון מידע מעודכן מהאינטרנט
    runs-on: ubuntu-latest
    
    steps:
      # 1. שכפול הקוד
      - name: 📥 Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. התקנת Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # 3. התקנת תלויות (מדלג - משתמש ב-fetch מובנה)
      - name: 📦 Skip dependencies
        run: |
          echo "✅ משתמש ב-fetch מובנה של Node.js, לא צריך node_modules"
      
      # 4. הרצת סקריפט העדכון (קטגוריה אחת ליום)
      - name: 🔄 Update 1 category today
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🚀 מתחיל עדכון קטגוריה אחת היום..."
          cd BTL/senior_rights
          node scripts/update-data.js
          echo "✅ עדכון הושלם!"
      
      # 5. בדיקה אם יש שינויים
      - name: 📊 Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      # 6. Commit והעלאה לGitHub
      - name: 💾 Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add BTL/senior_rights/data/
          git commit -m "🤖 עדכון יומי - קטגוריה אחת - $(date +'%Y-%m-%d')"
          git push
      
      # 7. הודעת סיום
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ בסיס הנתונים עודכן בהצלחה!"
          echo "📅 תאריך: $(date)"
      
      # 8. הודעת שגיאה
      - name: ❌ Error notification
        if: failure()
        run: |
          echo "❌ אירעה שגיאה בעדכון בסיס הנתונים"
          echo "בדוק את הלוגים למעלה"
