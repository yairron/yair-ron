name: עדכון אוטומטי של בסיס נתונים זכויות אזרחים ותיקים

# מתי להריץ
on:
  # כל יום בחצות (שעון ישראל: 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'
  
  # אפשרות להריץ ידנית
  workflow_dispatch:
  
  # אפשרות להריץ אוטומטית כל שבוע (ראשון בבוקר)
  # schedule:
  #   - cron: '0 6 * * 0'  # ראשון ב-06:00 UTC (08:00 בישראל)

jobs:
  update-data:
    name: עדכון מידע מעודכן מהאינטרנט
    runs-on: ubuntu-latest
    
    steps:
      # 1. שכפול הקוד
      - name: 📥 Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. התקנת Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # 3. התקנת תלויות
      - name: 📦 Install dependencies
        run: |
          npm install
          npm install node-fetch@2
      
      # 4. הרצת סקריפט העדכון
      - name: 🔄 Update data from web sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🚀 מתחיל עדכון בסיס נתונים..."
          cd BTL/senior_rights
          node scripts/update-data.js
          echo "✅ עדכון הושלם!"
      
      # 5. בדיקה אם יש שינויים
      - name: 📊 Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      # 6. Commit והעלאה לGitHub
      - name: 💾 Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add BTL/senior_rights/data/
          git commit -m "🤖 עדכון אוטומטי של בסיס הנתונים - $(date +'%Y-%m-%d %H:%M')"
          git push
      
      # 7. הודעת סיום
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ בסיס הנתונים עודכן בהצלחה!"
          echo "📅 תאריך: $(date)"
      
      # 8. הודעת שגיאה
      - name: ❌ Error notification
        if: failure()
        run: |
          echo "❌ אירעה שגיאה בעדכון בסיס הנתונים"
          echo "בדוק את הלוגים למעלה"
